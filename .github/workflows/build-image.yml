name: Build image

on:
  workflow_call:
    inputs:
      service:
        type: string
        required: true
      image:
        type: string
        required: true
      context:
        type: string
        required: true
      dockerfile:
        type: string
        required: true
      build-args:
        default: ""
        type: string
      publish:
        type: boolean
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v3.12.0
      - uses: docker/login-action@v3.7.0
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5.10.0
        id: meta
        with:
          images: ghcr.io/${{ inputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=pr-${{ github.event.number }}-${{ github.sha }},enable=${{ github.event_name == 'pull_request' }}
            type=raw,value=main-${{ github.sha }},enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v6.19.2
        id: build
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          build-args: ${{ inputs.build-args }}
          push: ${{ inputs.publish }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}
      - name: Record published image
        if: inputs.publish
        env:
          REPOSITORY: ghcr.io/${{ inputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SERVICE: ${{ inputs.service }}
        run: |
          jq -n --arg repository "${REPOSITORY,,}" --arg digest "$DIGEST" --arg revision "$GITHUB_SHA" \
            '{repository: $repository, digest: $digest, revision: $revision}' > "$SERVICE.json"
      - uses: actions/upload-artifact@v7.0.2
        if: inputs.publish
        with:
          name: image-${{ inputs.service }}
          path: ${{ inputs.service }}.json
          if-no-files-found: error
