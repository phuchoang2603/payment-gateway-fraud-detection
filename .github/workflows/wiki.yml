name: Publish documentation wiki

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/wiki_links.py"
      - ".github/workflows/wiki.yml"

permissions:
  contents: write

concurrency:
  group: publish-wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # The action flattens pages to the wiki root but keeps other files nested; point images and reports at them.
      - run: python3 scripts/wiki_links.py docs "$GITHUB_REPOSITORY"
      # Includes link conversion for nested docs and repository source files.
      - uses: Andrew-Chen-Wang/github-wiki-action@93c86ef70e8354bbd677185b355ba164cb29288f
        with:
          path: docs
          disable-empty-commits: true
