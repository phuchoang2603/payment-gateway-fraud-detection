name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: phuchoang2603/devenv-modules/.github/workflows/devenv.yml@main
    with:
      run: devenv tasks run repo:lint
      timeout-minutes: 30
      cache-key: lint

  streaming-jvm:
    uses: phuchoang2603/devenv-modules/.github/workflows/devenv.yml@main
    with:
      run: bash scripts/check.sh jvm
      timeout-minutes: 20
      cache-key: streaming-jvm
