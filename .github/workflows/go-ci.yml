name: Go CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: go-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go (${{ matrix.project }})
    strategy:
      fail-fast: false
      matrix:
        project:
          - src/llm/agent_runtime
          - src/payment-gateway/edge
          - src/payment-gateway/fraud
          - src/payment-gateway/notifier
          - src/payment-gateway/payments
          - src/payment-gateway/processor-simulator
          - src/payment-gateway/shared
          - src/payment-gateway/vault-simulator
    uses: phuchoang2603/devenv-modules/.github/workflows/devenv.yml@main
    with:
      run: CI_TEST_REPORTS=/tmp/test-evidence bash scripts/check.sh go ${{ matrix.project }}
      timeout-minutes: 30
      cache-key: go-${{ matrix.project }}
      artifact-name: go-test-evidence-${{ matrix.project }}
      artifact-path: /tmp/test-evidence

  mutation:
    if: github.event_name == 'pull_request'
    name: mutation (${{ matrix.project }})
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        project:
          - src/llm/agent_runtime
          - src/payment-gateway/edge
          - src/payment-gateway/fraud
          - src/payment-gateway/notifier
          - src/payment-gateway/payments
          - src/payment-gateway/processor-simulator
          - src/payment-gateway/shared
          - src/payment-gateway/vault-simulator
    uses: phuchoang2603/devenv-modules/.github/workflows/devenv.yml@main
    with:
      run: CI_TEST_REPORTS=/tmp/mutation-evidence MUTATION_BASE=${{ github.event.pull_request.base.sha }} MUTATION_BUDGET=15m bash scripts/check.sh go-mutations ${{ matrix.project }} diff
      fetch-depth: 0
      timeout-minutes: 55
      cache-key: go-${{ matrix.project }}
      artifact-name: go-mutation-evidence-${{ matrix.project }}
      artifact-path: /tmp/mutation-evidence
