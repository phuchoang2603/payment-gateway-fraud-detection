name: Service images

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.images.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: images
        run: echo "matrix=$(jq -c . .github/service-images.json)" >> "$GITHUB_OUTPUT"

  images:
    needs: matrix
    name: ${{ matrix.service }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.images) }}
    uses: ./.github/workflows/build-image.yml
    with:
      image: ${{ github.repository }}${{ matrix.image-suffix }}
      context: ${{ matrix.context }}
      dockerfile: ${{ matrix.dockerfile }}
      build-args: ${{ matrix.build-args || '' }}
      publish: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}

  pin:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
      - uses: docker/setup-buildx-action@v3.12.0
      - uses: docker/login-action@v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pin production charts after all main images publish
        run: bash scripts/pin-service-images.sh
