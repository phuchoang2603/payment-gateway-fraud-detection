name: Service images

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.images.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: images
        run: echo "matrix=$(jq -c . .github/service-images.json)" >> "$GITHUB_OUTPUT"

  images:
    needs: matrix
    name: ${{ matrix.service }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.images) }}
    uses: ./.github/workflows/build-image.yml
    with:
      service: ${{ matrix.service }}
      image: ${{ github.repository }}${{ matrix.image-suffix }}
      context: ${{ matrix.context }}
      dockerfile: ${{ matrix.dockerfile }}
      build-args: ${{ matrix.build-args || '' }}
      publish: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}

  deploy:
    needs: images
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'pull_request' && 'dev' || 'prod' }}
    permissions:
      contents: write
    concurrency:
      group: gateway-deploy-${{ github.event_name == 'pull_request' && 'dev' || 'prod' }}
      cancel-in-progress: false
    env:
      DEPLOY_ENVIRONMENT: ${{ github.event_name == 'pull_request' && 'dev' || 'prod' }}
      SOURCE_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/merge', github.event.number) || 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.1.0
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: image-*
          path: .image-manifests
          merge-multiple: true
      - name: Publish the complete GitOps release
        run: uv run --with PyYAML==6.0.3 python scripts/publish-release.py
