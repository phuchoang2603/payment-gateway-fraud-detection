name: Service images

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.images.outputs.matrix }}
      has-images: ${{ steps.images.outputs.has-images }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: images
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          matrix=$(python3 scripts/select-service-images.py "$BASE" "$GITHUB_SHA")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "has-images=$(jq '.include | length > 0' <<< "$matrix")" >> "$GITHUB_OUTPUT"

  images:
    needs: matrix
    if: needs.matrix.outputs.has-images == 'true'
    name: ${{ matrix.service }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.images) }}
    uses: ./.github/workflows/build-image.yml
    with:
      service: ${{ matrix.service }}
      image: ${{ github.repository }}${{ matrix.image-suffix }}
      context: ${{ matrix.context }}
      dockerfile: ${{ matrix.dockerfile }}
      build-args: ${{ matrix.build-args || '' }}
      publish: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}

  pin:
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.images.result == 'success'
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
      - uses: astral-sh/setup-uv@v10.1.0
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: image-*
          path: .image-manifests
          merge-multiple: true
      - name: Pin production charts after affected main images publish
        run: uv run --with PyYAML==6.0.3 python scripts/pin-service-images.py .image-manifests
      - name: Commit updated production image pins
        run: |
          if git diff --quiet -- 'infra/**/values-prod.yaml'; then
            echo "production images already match published digests"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'infra/**/values-prod.yaml'
          git commit -m "chore(infra): pin published images from ${GITHUB_SHA} [skip ci]"
          git push
