name: Python CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: src/**/uv.lock
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Spark test jars
        run: |
          python3 scripts/prepare-dp1-jars.py "$RUNNER_TEMP/dp1-jars" --local
          echo "DP1_JARS=$(find "$RUNNER_TEMP/dp1-jars" -name 'iceberg-spark-runtime*.jar' -print -quit)" >> "$GITHUB_ENV"
      - name: Python lint, format and tests
        run: bash scripts/ci-checks.sh python
