name: Python CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
      - name: Lint and format release scripts
        run: bash scripts/ci-checks.sh python-scripts

  projects:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.projects.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      # Pull requests test the projects their change affects; pushes to main test them all.
      - id: projects
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: echo "matrix=$(python3 scripts/ci-matrix.py --kind python ${BASE:+--changed "$BASE"})" >> "$GITHUB_OUTPUT"

  python:
    needs: projects
    if: fromJSON(needs.projects.outputs.matrix).include[0] != null
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.projects.outputs.matrix) }}
    name: Python ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: src/**/uv.lock
      - uses: actions/setup-java@v5
        if: matrix.java
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@v4
        if: matrix.ivy
        with:
          path: ~/.ivy2.5.2
          key: spark-ivy-${{ hashFiles(format('{0}/tests/conftest.py', matrix.project)) }}
      - uses: actions/cache@v4
        if: matrix.project == 'src/llm/rag_serving'
        with:
          path: src/llm/rag_serving/mutants
          key: knowledge-mutmut-3.8.1-${{ runner.os }}-${{ hashFiles('src/llm/rag_serving/tests/**', 'src/llm/rag_serving/pyproject.toml', 'src/llm/common/**', 'src/llm/uv.lock', 'scripts/ci-checks.sh') }}-${{ github.sha }}
          restore-keys: |
            knowledge-mutmut-3.8.1-${{ runner.os }}-${{ hashFiles('src/llm/rag_serving/tests/**', 'src/llm/rag_serving/pyproject.toml', 'src/llm/common/**', 'src/llm/uv.lock', 'scripts/ci-checks.sh') }}-
      - name: Python lint, format and tests
        env:
          PY_PROJECT: ${{ matrix.project }}
          CI_TEST_REPORTS: /tmp/python-test-evidence
          MUTATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/ci-checks.sh python "$PY_PROJECT"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: python-test-evidence-${{ matrix.id }}
          path: /tmp/python-test-evidence
          if-no-files-found: warn
