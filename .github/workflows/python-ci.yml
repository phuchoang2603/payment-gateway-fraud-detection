name: Python CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (${{ matrix.project }}${{ matrix.marker && format(' -m {0}', matrix.marker) || '' }})
    strategy:
      fail-fast: false
      matrix:
        project:
          - src/data-pipeline/feast
          - src/data-pipeline/openmetadata
          - src/data-pipeline/simulator
          - src/data-pipeline/streaming
          - src/llm/common
          - src/llm/rag_pipeline
          - src/llm/rag_serving
          - src/llm/risk_serving
          - src/ml
          - src/ml/pipelines
        include:
          - project: src/data-pipeline/batch
            marker: property
          - project: src/data-pipeline/batch
            marker: not property
    uses: phuchoang2603/devenv-modules/.github/workflows/devenv.yml@main
    with:
      run: CI_TEST_REPORTS=/tmp/test-evidence MUTATION_BASE=${{ github.event.pull_request.base.sha || github.event.before }} bash scripts/check.sh python ${{ matrix.project }} ${{ matrix.marker && format('-m "{0}"', matrix.marker) || '' }}
      fetch-depth: 0
      timeout-minutes: 40
      artifact-name: python-test-evidence-${{ matrix.project }}${{ matrix.marker && format('-{0}', matrix.marker) || '' }}
      artifact-path: /tmp/test-evidence
      cache-path: |
        ~/.ivy2.5.2
        src/llm/rag_serving/mutants
      cache-key: python-${{ matrix.project }}
      cache-hash-files: src/**/uv.lock
