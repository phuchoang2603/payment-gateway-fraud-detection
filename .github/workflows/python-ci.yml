name: Python CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
      - name: Lint and format release scripts
        run: bash scripts/ci-checks.sh python-scripts

  projects:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.projects.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: projects
        run: echo "matrix=$(python3 scripts/ci-matrix.py --kind python)" >> "$GITHUB_OUTPUT"

  python:
    needs: projects
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.projects.outputs.matrix) }}
    name: Python ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: src/**/uv.lock
      - uses: actions/setup-java@v5
        if: matrix.java
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@v4
        if: matrix.ivy
        with:
          path: ~/.ivy2.5.2
          key: spark-ivy-${{ hashFiles(format('{0}/tests/conftest.py', matrix.project)) }}
      - name: Python lint, format and tests
        env:
          PY_PROJECT: ${{ matrix.project }}
        run: bash scripts/ci-checks.sh python "$PY_PROJECT"
