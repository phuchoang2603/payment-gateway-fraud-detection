name: Python CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (${{ matrix.project }})
    strategy:
      fail-fast: false
      matrix:
        project:
          - src/data-pipeline/batch
          - src/data-pipeline/feast
          - src/data-pipeline/openmetadata
          - src/data-pipeline/simulator
          - src/data-pipeline/streaming
          - src/llm/common
          - src/llm/rag_pipeline
          - src/llm/rag_serving
          - src/llm/risk_serving
          - src/ml
          - src/ml/pipelines
    uses: phuchoang2603/devenv-modules/.github/workflows/devenv.yml@main
    with:
      run: MUTATION_BASE=${{ github.event.pull_request.base.sha || github.event.before }} bash scripts/check.sh python ${{ matrix.project }}
      fetch-depth: 0
      timeout-minutes: 40
