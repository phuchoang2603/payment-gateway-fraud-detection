name: Python CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: src/**/uv.lock
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Python lint, format and tests
        run: bash scripts/ci-checks.sh python

  mutation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MUTATION_BASE: ${{ github.event.pull_request.base.sha }}
      CI_TEST_REPORTS: /tmp/python-mutation-evidence
      DATA_PRODUCTS_ROOT: ${{ github.workspace }}/contracts/data-products
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: src/**/uv.lock
      - name: Check mutations in changed Python functions
        run: python scripts/check-python-mutations.py
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: python-mutation-evidence
          path: ${{ env.CI_TEST_REPORTS }}
          if-no-files-found: warn
