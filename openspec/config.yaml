schema: spec-driven

context: |
  This repository implements a real-time payment gateway and fraud detection.
  Go services, including fraud, own their runtime, contracts and dependencies.
  Python remains available for simulation and future training/model tooling.
  Public HTTP/JSON belongs at the Go edge. Internal synchronous business APIs use
  gRPC with versioned protobuf contracts and generated bindings; do not maintain
  parallel internal REST/JSON APIs. Events may use protobuf over their event transport.
  Keep transport (HTTP/gRPC and wire mapping) separate from domain (business
  rules and validated values) in Go and Python. Add application/use-case
  coordination and storage adapters only when concrete workflows or persistence
  require them. Telemetry remains service-owned; composition roots wire the code.
  Domain code must not depend on transport, generated protobuf, databases or
  observability. Create only layers with real responsibilities: the current Go
  edge has no business domain until checkout behavior is added. Extract shared
  runtime helpers only for real reuse within the same language; contracts/ is
  the existing cross-language shared boundary.
  Keep protobuf definitions under root contracts/ and generated Go bindings
  under src/payment-gateway/shared/proto/ outside domain code.
  Prefer supported modern APIs and idiomatic code; use Context7 for current public
  library, SDK and framework guidance. Prefer the repository's Nix devenv.
  Keep devenv task definitions and CI workflow steps short. Move substantive shell
  logic into tracked scripts, reuse focused functions for repeated checks, and
  include devenv script paths in execIfModified so edits rerun tasks.
  Remove obsolete code, dead paths and unnecessary compatibility layers when
  changing an area. Preserve legacy behavior only when explicitly required.
  Update affected producers, consumers, contracts and configuration together.
  Choose simple designs with a concrete benefit; avoid speculative abstractions,
  dependencies or protocol migrations just to adopt something newer.
  Keep tests small and behavior-focused. Each test should protect a distinct
  business rule, boundary, failure mode, resource lifecycle or integration contract.
  Reuse coverage; avoid duplicate assertions across layers, getter/no-op tests,
  implementation-mirroring tests and equivalent parameter combinations.
  Keep Python tests, Go lint and Helm lint in independent CI jobs without
  change-detection jobs or matrices. Discover and validate all Helm charts. Keep
  check jobs in the CI workflow and reuse one image workflow for explicit service
  image jobs. Do not run any tests locally, including unit, integration, smoke,
  end-to-end or acceptance tests. Let CI checks run all tests and image builds;
  inspect their results and report pending or failed checks honestly. Local
  verification is limited to non-test checks such as lint, formatting, schema
  validation and diff review.
  Do not add score-only tests or custom coverage/mutation gate tooling. Record real
  failures honestly; replacing a verification policy does not turn old failures into passes.
  Keep documentation minimal. The root README is the entry point; CONTRIBUTING.md
  covers only initial prerequisites, entering devenv and a wiki link. Keep workflow,
  storage, CI and project-specific instructions in docs/ for the wiki, not in
  CONTRIBUTING.md. Update existing pages instead of adding per-directory READMEs
  or repeating information maintained elsewhere.

rules:
  proposal:
    - Explain the concrete problem and expected behavior concisely.
    - Identify intentional breaking changes; do not assume legacy compatibility is required.
  design:
    - Prefer supported APIs and remove obsolete paths within the changed area.
    - Keep transport separate from domain in both languages; add storage and use-case coordination only when behavior needs them, without empty packages.
    - Justify new abstractions, dependencies and protocols with a current requirement.
    - Plan coordinated contract and caller updates for intentional breaking changes.
  specs:
    - Specify observable behavior and meaningful boundaries without mirroring implementation details.
  tasks:
    - Include cleanup of superseded code and affected references in implementation tasks.
    - Reuse existing behavioral coverage; add tests only for distinct uncovered risks.
    - Run all tests through CI checks, never locally; distinguish non-test local checks from CI test execution.
    - Keep documentation work proportional; update existing guides instead of adding READMEs.

operations:
  apply:
    guidance:
      - Use devenv when available and Context7 for current public API guidance.
      - Remove superseded implementations rather than retaining parallel legacy paths.
      - Never run tests locally; let CI checks run all unit, integration, smoke, end-to-end and acceptance tests. Use only relevant non-test checks locally and inspect CI results.
      - Report actual validation results and remaining gaps without adding low-value tests.
  archive:
    guidance:
      - Keep the outcome concise and report unresolved verification gaps honestly.
