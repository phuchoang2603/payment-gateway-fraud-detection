[project]
name = "fraud-agent-runtime"
version = "0.1.0"
description = "kagent's Python agent runtime with prompts, model settings and A/B variants from Langfuse"
requires-python = ">=3.12,<3.13"
dependencies = ["kagent-adk==1.0.0rc1", "kagent-proto", "langfuse==4.15.6"]

[project.scripts]
fraud-agent-runtime = "fraud_agent_runtime.entrypoint:main"

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.0", "pytest-cov==7.1.0", "ruff==0.17.3"]

# kagent publishes its runtime packages to PyPI except kagent-proto, which ships only in its repository.
[tool.uv.sources]
kagent-proto = { git = "https://github.com/kagent-dev/kagent", tag = "v1.0.0-rc1", subdirectory = "python/packages/kagent-proto" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fraud_agent_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "--cov=fraud_agent_runtime --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
extend = "../pyproject.toml"
