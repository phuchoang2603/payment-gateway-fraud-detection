[project]
name = "fraud-llm"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.3"]

[tool.uv]
package = false
# Feast pins tenacity<9 and Google ADK needs tenacity>=9; the agent runtime never shares an environment with Feast.
conflicts = [
    [{ package = "fraud-agent-runtime" }, { package = "fraud-rag-common" }],
    [{ package = "fraud-agent-runtime" }, { package = "fraud-rag-pipeline" }],
    [{ package = "fraud-agent-runtime" }, { package = "fraud-rag-serving" }],
]

[tool.uv.workspace]
members = ["common", "rag_pipeline", "rag_serving", "decision", "agent_runtime"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 119
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
