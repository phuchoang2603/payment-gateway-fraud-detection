[project]
name = "fraud-rag-pipeline"
version = "0.1.0"
description = "RAG knowledge pipeline: corpus, chunk, embed, validate, write, verify and OpenMetadata publishing"
requires-python = ">=3.12,<3.13"
dependencies = ["fraud-rag-common", "pyiceberg[pyarrow]==0.12.0", "pyyaml==6.0.3"]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.3"]

[tool.uv]
package = false

[tool.uv.sources]
fraud-rag-common = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
extend = "../pyproject.toml"
