[project]
name = "fraud-risk-serving"
version = "0.1.0"
description = "Read-only MCP scoring over Feast and Triton"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.162.0", "uvicorn==0.54.0", "mcp==2.3.0", "httpx==0.28.1", "prometheus-client==0.24.1"]

[dependency-groups]
dev = ["pytest==9.2.0", "hypothesis==6.170.14", "ruff==0.17.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
extend = "../pyproject.toml"
