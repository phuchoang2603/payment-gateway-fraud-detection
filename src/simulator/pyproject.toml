[project]
name = "payment-gateway-simulator"
version = "0.1.0"
description = "Seeded synthetic payment history generator"
requires-python = ">=3.14,<3.15"
dependencies = [
    "boto3==1.43.117",
    "psutil==7.2.2",
    "duckdb==1.5.5",
    "duckdb-extension-httpfs==1.5.5",
    "numpy>=2.3,<3",
    "pyarrow>=23,<25",
    "pydantic>=2.12,<3",
    "pytz==2026.5",
    "pyyaml>=6,<7",
]

[project.scripts]
simulator = "simulator.cli:main"

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.14,<1",
]
notebook = [
    "jupyter>=1.1,<2",
    "matplotlib>=3.10,<4",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "simulator"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["notebooks"]
line-length = 119
src = ["."]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
