[project]
name = "payment-risk-predictor"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "kserve==0.21.0",
    "xgboost-cpu==2.1.4",
    "numpy>=2,<3",
]

[dependency-groups]
dev = ["hypothesis>=6.170,<7", "pytest==9.0.2", "ruff==0.14.14"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "payment_risk_predictor"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
