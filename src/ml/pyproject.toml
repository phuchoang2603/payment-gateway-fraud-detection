[project]
name = "risk-model"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fraud-feast[spark]",
    "xgboost==2.1.4",
    "scikit-learn==1.9.1",
    "pandas>=2.2,<3",
    "pyarrow>=21",
    "pyiceberg[pyarrow]>=0.10,<0.11",
    "model-registry==0.3.18",
    "kubernetes>=31,<36",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4.4,<5", "matplotlib>=3.9,<4"]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "httpx2>=2.16,<3",
    "hypothesis>=6.170,<7",
    "pyspark==4.1.3",
    "pytest==9.0.2",
    "ruff==0.14.14",
]

[tool.uv.sources]
fraud-feast = { path = "../data-pipeline/feast", editable = true }

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "risk_model"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "D100", "D101", "D102", "D103", "D104"]

[tool.ci]
coverage-fail-under = 90
