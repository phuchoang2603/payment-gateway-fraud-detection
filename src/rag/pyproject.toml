[project]
name = "fraud-rag"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.3"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["common", "pipeline", "serving"]

[tool.ruff]
line-length = 119
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
