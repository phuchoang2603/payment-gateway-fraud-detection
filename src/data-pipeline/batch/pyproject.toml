[project]
name = "fraud-batch"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3==1.43.117",
    "confluent-kafka>=2.12,<3",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pyarrow>=18,<22",
    "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
    "grpcio-tools==1.84.0",
    "pyspark==4.1.3",
    "pytest>=9,<10",
    "ruff>=0.14,<1",
    "testcontainers==4.15.0",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "batch"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 119
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
