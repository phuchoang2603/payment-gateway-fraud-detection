[project]
name = "fraud-batch"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3==1.43.117",
    "confluent-kafka>=2.12,<3",
    "pyarrow>=23,<25",
    "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
    "pyspark==4.1.3",
    "pytest>=9,<10",
    "ruff>=0.14,<1",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "batch"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 119
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.protobuf]
descriptor = "batch/payments.pb"
sources = ["payments/v1/events.proto", "payments/v1/labels.proto"]
