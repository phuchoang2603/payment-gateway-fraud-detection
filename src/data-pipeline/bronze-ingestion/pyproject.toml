[project]
name = "fraud-data-platform"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "great-expectations==1.24.0",
  "datacontract-cli[duckdb]==1.2.7",
  "acryl-datahub[iceberg]==1.7.0.16",
  "acryl-datahub-gx-plugin==1.7.0.16",
  "pyiceberg[pyarrow,s3fs]==0.11.1",
  "pyarrow==23.0.1",
  "pyyaml==6.0.3",
  "boto3==1.42.36",
  "certifi==2026.10.19",
]

[project.optional-dependencies]
spark = ["pyspark==3.5.8"]

[project.scripts]
dp1 = "data_platform.cli:main"

[dependency-groups]
dev = ["pyspark==3.5.8", "pytest==9.0.2", "ruff==0.15.0", "numpy>=2.3,<3", "pydantic>=2.12,<3"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "data_platform"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 119
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
