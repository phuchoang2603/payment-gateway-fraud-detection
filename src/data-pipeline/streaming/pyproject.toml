[project]
name = "fraud-streaming"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["protobuf==4.25.8", "confluent-kafka==2.12.0"]

[dependency-groups]
dev = ["hypothesis==6.170.14", "pytest==9.0.2", "ruff==0.14.14", "sqlalchemy>=2,<3", "testcontainers[kafka]==4.15.0"]
flink = ["apache-flink==2.2.1"]
history = ["pyiceberg[pyarrow]>=0.10,<0.11", "boto3>=1.38,<2", "duckdb>=1.4,<2"]

[tool.uv]
package = false
default-groups = ["dev", "flink"]
conflicts = [[{group = "flink"}, {group = "history"}]]

[[tool.uv.dependency-metadata]]
name = "crcmod"
version = "1.7"
requires-dist = []

[tool.ci]
# The history seed runs with pyiceberg and DuckDB, which cannot share an environment with PyFlink.
test-groups = ["history"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.protobuf]
descriptor = "fraud_streaming/contracts.pb"
sources = ["payments/v1/events.proto", "features/v2/features.proto"]
