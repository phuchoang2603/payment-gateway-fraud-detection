[project]
name = "fraud-feast"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "feast[redis]==0.67.0",
    "confluent-kafka==2.12.0",
    "protobuf==7.36.1",
    "pyiceberg[pyarrow,sql-sqlite]>=0.10,<0.11",
    "boto3>=1.38,<2",
]

[project.optional-dependencies]
spark = ["feast[spark]==0.67.0", "pyspark==4.1.3"]

[dependency-groups]
dev = ["httpx>=0.28,<1", "hypothesis[crosshair]==6.170.14", "pytest==9.0.2", "ruff==0.14.14", "testcontainers[redis,kafka]==4.15.0", "pyspark==4.1.3"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fraud_feast"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../streaming"]

[tool.ruff]
extend-exclude = ["fraud_feast/contracts"]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.protobuf]
python-package = "fraud_feast.contracts"
sources = ["features/v2/features.proto"]
