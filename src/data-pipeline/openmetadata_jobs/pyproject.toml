[project]
name = "fraud-openmetadata-jobs"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pyyaml>=6,<7"]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.14,<1",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "openmetadata_jobs"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 119
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
