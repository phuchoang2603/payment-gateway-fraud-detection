[project]
name = "payment-gateway-simulator"
version = "0.1.0"
description = "Seeded synthetic payment history generator"
requires-python = ">=3.14,<3.15"
dependencies = [
    "boto3==1.43.117",
    "httpx>=0.28,<1",
    "confluent-kafka>=2.12,<3",
    "protobuf>=7.36.1,<8",
    "psutil==7.2.2",
    "numpy>=2.3,<3",
    "pyarrow>=23,<25",
    "pydantic>=2.12,<3",
    "pytz==2026.5",
    "pyyaml>=6,<7",
]

[project.scripts]
simulator = "simulator.runtime:main"

[dependency-groups]
dev = [
    "duckdb==1.5.5",
    "pytest>=9,<10",
    "mutmut==3.8.0",
    "ruff>=0.14,<1",
]
notebook = [
    "duckdb==1.5.5",
    "duckdb-extension-httpfs==1.5.5",
    "jupyter>=1.1,<2",
    "matplotlib>=3.10,<4",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "simulator"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]

[tool.ruff]
extend-exclude = ["notebooks", "simulator/contracts"]
line-length = 119
src = ["."]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.protobuf]
python-package = "simulator.contracts"
sources = ["payments/v1/types.proto", "payments/v1/events.proto", "payments/v1/labels.proto"]

[tool.mutmut]
source_paths = ["simulator"]
only_mutate = ["simulator/config.py"]
pytest_add_cli_args_test_selection = ["tests/test_schema_schedule.py", "tests/test_runtime.py"]
