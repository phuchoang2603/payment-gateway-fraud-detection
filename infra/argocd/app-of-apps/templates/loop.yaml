{{- range $name, $application := .Values.applications }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ printf "%s-%s" $.Values.namePrefix $name }}
  namespace: argo-cd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: payment-gateway-fraud-detection
  destination:
    server: {{ $.Values.destinationServer | quote }}
    namespace: {{ $application.destinationNamespace }}
  source:
    repoURL: {{ $.Values.global.repoURL }}
    targetRevision: {{ $.Values.global.targetRevision | quote }}
    path: {{ $application.path }}
    helm:
      releaseName: {{ $name }}
      valueFiles:
        - {{ printf "values-%s.yaml" ($.Values.environment | default "dev") }}
      {{- with $application.releaseValues }}
      valuesObject:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - ServerSideApply=true
{{- end }}
