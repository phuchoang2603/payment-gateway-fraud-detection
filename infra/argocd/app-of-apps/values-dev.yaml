environment: dev
namePrefix: payment-gateway-dev
# Dev runs the gateway, streaming, data pipelines and a bounded live simulator for the feature-store and model runs; the
# LLM applications are off so they do not compete with them for dev-server1.
applications:
  live-traffic:
    enabled: true
  llm-platform:
    enabled: false
  rag-pipeline:
    enabled: false
