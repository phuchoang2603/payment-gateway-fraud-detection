environment: dev
namePrefix: payment-gateway-dev
applications:
  live-traffic:
    enabled: true
  ml-training:
    enabled: true
  llm-platform:
    enabled: true
    ignoreDifferences:
      - group: ate.dev
        kind: WorkerPool
        jsonPointers: [/spec/replicas]
      - group: argoproj.io
        kind: Rollout
        name: risk-serving
        namespace: llm
        jsonPointers: [/spec/replicas]
      - group: ""
        kind: Service
        name: risk-serving
        namespace: llm
        jsonPointers: [/spec/selector/rollouts-pod-template-hash]
      - group: ""
        kind: Service
        name: risk-serving-preview
        namespace: llm
        jsonPointers: [/spec/selector/rollouts-pod-template-hash]
  rag-pipeline:
    enabled: true
    ignoreDifferences:
      - group: argoproj.io
        kind: Rollout
        name: rag-api
        namespace: llm
        jsonPointers: [/spec/replicas]
      - group: ""
        kind: Service
        name: rag-api
        namespace: llm
        jsonPointers: [/spec/selector/rollouts-pod-template-hash]
      - group: ""
        kind: Service
        name: rag-api-preview
        namespace: llm
        jsonPointers: [/spec/selector/rollouts-pod-template-hash]
