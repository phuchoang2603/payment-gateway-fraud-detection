apiVersion: batch/v1
kind: Job
metadata:
  name: knowledge-loadtest
  namespace: llm
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: llm-benchmark
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: locust
          image: locustio/locust:2.46.7
          command: [sh, -c]
          args:
            - |
              locust -f /loadtest/locustfile.py --headless --host http://rag-api.llm.svc.cluster.local:8080 \
                --users 60 --spawn-rate 10 --run-time 5m --html /tmp/report.html --only-summary
              echo ===LOCUST-HTML===; cat /tmp/report.html; echo; echo ===END===
          env:
            - {name: HOME, value: /tmp}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: loadtest, mountPath: /loadtest}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: loadtest
          configMap:
            name: knowledge-loadtest
        - name: tmp
          emptyDir: {}
