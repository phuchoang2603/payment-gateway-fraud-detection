global:
  imageTags:
    ghcr.io/phuchoang2603/payment-gateway-fraud-detection/rag-pipeline: dev
    ghcr.io/phuchoang2603/payment-gateway-fraud-detection/rag-serving: dev
    ghcr.io/phuchoang2603/payment-gateway-fraud-detection/data-platform-metadata: dev

images:
  pipeline:
    repository: ghcr.io/phuchoang2603/payment-gateway-fraud-detection/rag-pipeline
  serving:
    repository: ghcr.io/phuchoang2603/payment-gateway-fraud-detection/rag-serving
  metadata:
    repository: ghcr.io/phuchoang2603/payment-gateway-fraud-detection/data-platform-metadata

uid: 65532
# The ingest workflow runs where Argo Workflows, Polaris and OpenMetadata already admit pipelines; the store and
# the knowledge API stay in the release namespace (llm).
pipelineNamespace: data
storageClass: local-path
secretStore: gateway-doppler
# Platform-owned credentials: the Polaris client shared with the other lakehouse writers.
platformSecretStore: doppler

# The gateway storage identity, scoped to datasets/payment-gateway/, runs/payment-gateway/ and lakehouse/.
storage:
  bucket: platform-dev
  endpoint: https://minio.home.phuchoang.sbs
  region: us-east-1
  pathStyle: true
  keys:
    AWS_ACCESS_KEY_ID: OBJECT_GATEWAY_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: OBJECT_GATEWAY_SECRET_ACCESS_KEY

catalog:
  restUri: http://iceberg-catalog.data.svc.cluster.local:8181/api/catalog
  warehouse: lakehouse
  clientId: platform
  oauth2Uri: http://iceberg-catalog.data.svc.cluster.local:8181/api/catalog/v1/oauth/tokens
  clientSecretKey: ICEBERG_CLIENT_SECRET

openmetadata:
  url: http://openmetadata.data.svc.cluster.local:8585/api
  tokenKey: OPENMETADATA_TOKEN
  clickhouseDatabase: lakehouse
  # The checks job ingests only the knowledge tables before testing them, so it never touches other tables.
  clickhouse:
    hostPort: clickhouse.data.svc.cluster.local:8123
    username: openmetadata
    passwordKey: CLICKHOUSE_OPENMETADATA_PASSWORD

# The llm-platform chart owns the gateway and the client key Secrets used here.
gateway:
  url: http://agentgateway.llm.svc.cluster.local
  serviceAccount: agentgateway
  ingestKey: LLM_GATEWAY_RAG_INGEST_API_KEY
  apiKeySecret: llm-gateway-ragapi

# Must match models.embedding in the llm-platform chart; a change here produces a new knowledge version.
embedding:
  model: qwen3-embedding
  revision: 97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3

database:
  name: rag-pgvector
  dbname: rag
  imageName: ghcr.io/cloudnative-pg/postgresql:18.3-standard-trixie
  size: 2Gi
  nodeSelector: {}
  writerPasswordKey: RAG_DB_WRITER_PASSWORD
  readerPasswordKey: RAG_DB_READER_PASSWORD
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}

workflow:
  activeDeadlineSeconds: 1800
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 2Gi}

api:
  replicas: 2
  port: 8080
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 1Gi}

# AI assets the catalog step registers in OpenMetadata. These facts must match the llm-platform chart.
aiAssets:
  llmService:
    name: agent-gateway
    baseUrl: http://agentgateway.llm.svc.cluster.local/v1
  models:
    - name: qwen3-8b
      baseModel: Qwen/Qwen3-8B-FP8
      revision: 220b46e3b2180893580a4454f21f22d3ebb187d3
      provider: Qwen
      description: Chat model (FP8) served by vLLM through KServe LLMInferenceService with the llm-d endpoint picker.
    - name: qwen3-embedding
      baseModel: Qwen/Qwen3-Embedding-0.6B
      revision: 97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3
      provider: Qwen
      description: 1024-dimension embedding model served by vLLM's pooling runner; embeds the knowledge base and queries.
  mcpServer:
    name: knowledge
    service: agent-gateway-mcp
    url: http://agentgateway.llm.svc.cluster.local/mcp/knowledge
    description: Read-only payment-gateway knowledge base over the Feast pgvector store, served by rag-api behind the agent gateway.
    tools:
      - name: search_knowledge
        description: Vector search over knowledge chunks; returns passages with chunk_id and distance.
      - name: get_knowledge_chunk
        description: Returns one knowledge chunk by chunk_id.
  agent:
    name: evidence-agent
    version: 0.2.0
    primaryModel: qwen3-8b
    description: Read-only fraud-analyst agent that explains declines, risk decisions and payment behaviour from the knowledge base.
