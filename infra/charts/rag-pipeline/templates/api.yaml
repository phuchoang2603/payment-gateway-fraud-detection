{{- $api := .Values.api }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: rag-api
spec:
  # KEDA owns the replica count (ScaledObject below), so the chart leaves it unset.
  strategy:
    blueGreen:
      activeService: rag-api
      previewService: rag-api-preview
      previewReplicaCount: 1
      autoPromotionEnabled: true
      scaleDownDelaySeconds: 30
      prePromotionAnalysis:
        templates:
          - templateName: rag-api-preview
  minReadySeconds: 10
  progressDeadlineSeconds: 300
  progressDeadlineAbort: true
  selector:
    matchLabels:
      app.kubernetes.io/name: rag-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rag-api
        app.kubernetes.io/part-of: rag-pipeline
    spec:
      serviceAccountName: rag-api
      automountServiceAccountToken: false
      securityContext:
        {{- include "rag-pipeline.podSecurity" . | nindent 8 }}
      containers:
        - name: api
          image: {{ include "rag-pipeline.image" (dict "image" .Values.images.serving "global" .Values.global) | quote }}
          ports:
            - {name: http, containerPort: {{ $api.port }}}
          env:
            - name: PORT
              value: {{ $api.port | quote }}
            {{- include "rag-pipeline.gatewayEnv" (dict "root" . "secret" .Values.gateway.apiKeySecret) | nindent 12 }}
            {{- include "rag-pipeline.dbEnv" (dict "root" . "secret" "rag-db-reader") | nindent 12 }}
          # Importing Feast takes close to a minute on a busy dev node.
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          securityContext:
            {{- include "rag-pipeline.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml $api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: rag-api
spec:
  selector:
    app.kubernetes.io/name: rag-api
  ports:
    - {name: http, port: {{ $api.port }}, targetPort: http}
---
apiVersion: v1
kind: Service
metadata:
  name: rag-api-preview
spec:
  selector:
    app.kubernetes.io/name: rag-api
  ports:
    - {name: http, port: {{ $api.port }}, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rag-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rag-api
---
# REST requests and MCP tool calls load the same process, so the target is their combined rate.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: rag-api
spec:
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: rag-api
  minReplicaCount: {{ $api.autoscaling.minReplicas }}
  maxReplicaCount: {{ $api.autoscaling.maxReplicas }}
  triggers:
    - type: prometheus
      metadata:
        serverAddress: {{ $api.autoscaling.prometheus }}
        query: {{ printf "sum(rate({__name__=~\"knowledge_api_requests_total|knowledge_mcp_tool_calls_total\",namespace=\"%s\",job=\"%s/rag-api\"}[1m]))" .Release.Namespace .Release.Namespace | quote }}
        threshold: {{ $api.autoscaling.requestsPerSecondPerReplica | quote }}
---
# Agents reach the knowledge tools only through the gateway's /mcp/knowledge route.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: rag-api
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: rag-api
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/{{ .Release.Namespace }}/sa/{{ .Values.gateway.serviceAccount }}
              - {{ .Values.metricsAgent }}
              # The on-demand load test (loadtest/job.yaml) measures the API itself, behind the gateway's rate limit.
              - cluster.local/ns/{{ .Release.Namespace }}/sa/{{ .Values.api.loadTestServiceAccount }}
              - cluster.local/ns/{{ .Release.Namespace }}/sa/rag-api-analysis
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: rag-api
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: rag-api
  podMetricsEndpoints:
    - port: http
      path: /metrics/
