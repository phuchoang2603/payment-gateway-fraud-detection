apiVersion: v1
kind: ServiceAccount
metadata:
  name: rag-pipeline
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rag-pipeline
rules:
  - apiGroups: [argoproj.io]
    resources: [workflowtaskresults]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rag-pipeline
subjects:
  - kind: ServiceAccount
    name: rag-pipeline
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rag-pipeline
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rag-api
automountServiceAccountToken: false
