{{- define "rag-pipeline.externalSecret" -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .store }}
  target:
    name: {{ .name }}
    {{- with .username }}
    template:
      type: kubernetes.io/basic-auth
      data:
        username: {{ . }}
        password: '{{ "{{ .password }}" }}'
    {{- end }}
  data:
    {{- range $local, $remote := .data }}
    - secretKey: {{ $local }}
      remoteRef:
        key: {{ $remote }}
    {{- end }}
{{- end -}}
{{ include "rag-pipeline.externalSecret" (dict "name" "rag-storage" "store" .Values.secretStore "data" .Values.storage.keys) }}
---
{{ include "rag-pipeline.externalSecret" (dict "name" "rag-iceberg" "store" .Values.platformSecretStore "data" (dict "ICEBERG_CLIENT_SECRET" .Values.catalog.clientSecretKey)) }}
---
{{ include "rag-pipeline.externalSecret" (dict "name" "rag-openmetadata" "store" .Values.secretStore "data" (dict "OPENMETADATA_TOKEN" .Values.openmetadata.tokenKey)) }}
---
{{ include "rag-pipeline.externalSecret" (dict "name" "rag-db-writer" "store" .Values.secretStore "username" "rag_writer" "data" (dict "password" .Values.database.writerPasswordKey)) }}
---
{{ include "rag-pipeline.externalSecret" (dict "name" "rag-db-reader" "store" .Values.secretStore "username" "rag_reader" "data" (dict "password" .Values.database.readerPasswordKey)) }}
