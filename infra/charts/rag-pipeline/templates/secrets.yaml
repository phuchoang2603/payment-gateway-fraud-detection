{{- define "rag-pipeline.externalSecret" -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .store }}
  target:
    name: {{ .name }}
    {{- with .username }}
    template:
      type: kubernetes.io/basic-auth
      data:
        username: {{ . }}
        password: '{{ "{{ .password }}" }}'
    {{- end }}
  data:
    {{- range $local, $remote := .data }}
    - secretKey: {{ $local }}
      remoteRef:
        key: {{ $remote }}
    {{- end }}
{{- end -}}
{{- $pipeline := .Values.pipelineNamespace }}
{{ include "rag-pipeline.externalSecret" (dict "name" "rag-storage" "namespace" $pipeline "store" .Values.secretStore "data" .Values.storage.keys) }}
---
{{ include "rag-pipeline.externalSecret" (dict "name" "rag-iceberg" "namespace" $pipeline "store" .Values.platformSecretStore "data" (dict "ICEBERG_CLIENT_SECRET" .Values.catalog.clientSecretKey)) }}
---
{{ include "rag-pipeline.externalSecret" (dict "name" "rag-openmetadata" "namespace" $pipeline "store" .Values.secretStore "data" (dict "OPENMETADATA_TOKEN" .Values.openmetadata.tokenKey)) }}
---
{{ include "rag-pipeline.externalSecret" (dict "name" "rag-clickhouse" "namespace" $pipeline "store" .Values.platformSecretStore "data" (dict "CLICKHOUSE_PASSWORD" .Values.openmetadata.clickhouse.passwordKey)) }}
---
{{ include "rag-pipeline.externalSecret" (dict "name" "rag-gateway" "namespace" $pipeline "store" .Values.secretStore "data" (dict "key" .Values.gateway.ingestKey)) }}
---
{{ include "rag-pipeline.externalSecret" (dict "name" "rag-db-writer" "namespace" $pipeline "store" .Values.secretStore "username" "rag_writer" "data" (dict "password" .Values.database.writerPasswordKey)) }}
---
{{- /* CNPG bootstraps the writer from a Secret in its own namespace. */}}
{{ include "rag-pipeline.externalSecret" (dict "name" "rag-db-writer" "namespace" .Release.Namespace "store" .Values.secretStore "username" "rag_writer" "data" (dict "password" .Values.database.writerPasswordKey)) }}
---
{{ include "rag-pipeline.externalSecret" (dict "name" "rag-db-reader" "namespace" .Release.Namespace "store" .Values.secretStore "username" "rag_reader" "data" (dict "password" .Values.database.readerPasswordKey)) }}
