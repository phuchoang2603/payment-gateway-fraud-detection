affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [dev-server1, dev-server2]
resources:
  requests: {cpu: 500m, memory: 2Gi}
  limits: {memory: 2Gi}
