affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [dev-server1, dev-server2]
resources:
  requests: {cpu: 250m, memory: 1280Mi}
  limits: {memory: 3Gi}
