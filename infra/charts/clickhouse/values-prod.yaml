storageClass: gp3
nodeSelector:
  karpenter.sh/capacity-type: on-demand
# Prod runs on two m6a.xlarge On-Demand workers (4 vCPU / 16 GiB each) that already host the other
# databases. Requests are sized to fit beside them, with no CPU limit so queries are not throttled.
# ClickHouse derives max_server_memory_usage from the 4Gi cgroup limit; the 0.85 ratio in the
# instance settings leaves about 3.4Gi for queries, and the mark cache is capped below the limit.
resources:
  requests: {cpu: 500m, memory: 3Gi}
  limits: {memory: 4Gi}
