{{- range $user, $key := .Values.passwordKeys }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickhouse-{{ $user }}
  namespace: {{ $.Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: {{ $.Values.externalSecretStore }}}
  target:
    name: clickhouse-{{ $user }}
  data:
    - secretKey: password
      remoteRef: {key: {{ $key }}}
{{- end }}
