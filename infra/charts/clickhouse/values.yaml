namespace: data
image: clickhouse/clickhouse-server:26.10.2.103
setupImage: python:3.13.9-alpine3.22
storageClass: local-path
storageSize: 30Gi
nodeSelector: {}
resources:
  requests: {cpu: "2", memory: 8Gi}
  limits: {memory: 12Gi}
externalSecretStore: gateway-doppler
passwordStores: {}
# The marts datasource definition for the platform Grafana (discovered by its sidecar). The
# grafana user's password reaches Grafana through its own pod env, provisioned by the platform.
grafanaDatasource:
  enabled: true
passwordKeys:
  admin: CLICKHOUSE_ADMIN_PASSWORD
  langfuse: CLICKHOUSE_LANGFUSE_PASSWORD
  openmetadata: CLICKHOUSE_OPENMETADATA_PASSWORD
  grafana: CLICKHOUSE_GRAFANA_PASSWORD
  marts: CLICKHOUSE_MARTS_PASSWORD
