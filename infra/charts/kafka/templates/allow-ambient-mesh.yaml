apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ambient-mesh
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podSelector:
    matchExpressions:
      - key: istio.io/dataplane-mode
        operator: NotIn
        values: [none]
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 15008
          protocol: TCP
    - from:
        - ipBlock:
            cidr: {{ .Values.monitoring.meshProbeSource }}
  egress:
    - ports:
        - port: 15008
          protocol: TCP
    - to:
        - ipBlock:
            cidr: {{ .Values.monitoring.meshProbeSource }}
