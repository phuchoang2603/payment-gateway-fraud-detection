{{- /*
Every pod in this namespace is enrolled in the Istio ambient mesh, so in-mesh peers (including
the unmeshed CNPG and Strimzi operators) reach workloads over the ztunnel HBONE tunnel on 15008,
and kubelet health probes are rewritten to the ztunnel link-local source. Cilium enforces
NetworkPolicy below Istio, so any per-workload policy that selects a meshed pod is deny-by-default
for that traffic before ztunnel's mTLS/authorization runs. On egress this cuts the other way: a
workload with any egress policy can only reach a meshed peer over HBONE 15008, never the peer's
real application port, since ztunnel dials 15008 and Cilium drops anything the policy omits. This
single additive policy admits the mesh transport for the whole namespace in both directions once;
per-workload policies then only describe their own application-level rules. Keep it on an early
sync-wave so it exists before the workloads it admits.
*/ -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ambient-mesh
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 15008
          protocol: TCP
    - from:
        - ipBlock:
            cidr: {{ .Values.monitoring.meshProbeSource }}
  egress:
    - ports:
        - port: 15008
          protocol: TCP
    - to:
        - ipBlock:
            cidr: {{ .Values.monitoring.meshProbeSource }}
