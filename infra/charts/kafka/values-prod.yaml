kafka:
  storage:
    storageClass: cloud-standard
    size: 256Gi
  jvmOptions:
    -Xms: 2g
    -Xmx: 2g
  resources:
    requests:
      cpu: 500m
      memory: 4Gi
    limits:
      memory: 4Gi

entities:
  fraudFeatures:
    topics:
      - name: fraud.feature-updates.v2.live-v20
        partitions: 3
        retention: 1209600000
      - name: fraud.feature-rejects.v1.live-v20
        partitions: 3
        retention: 604800000
