kafka:
  storage:
    storageClass: cloud-standard
    # The seeded input of all 23 history units (about 37 GB) and their feature journals stay until unit cleanup.
    # The journals outgrew 64Gi about 9 hours into the replay and the broker stopped.
    size: 256Gi
  # Stream-history units all write to this one broker. Its cpu-pool node has about 0.7 CPU and 2.6 GiB
  # unreserved, so the request stays within that and the limit lets it burst for a replay.
  jvmOptions:
    -Xms: 2g
    -Xmx: 2g
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: '2'
      memory: 4Gi

entities:
  fraudFeatures:
    topics:
      - name: fraud.feature-updates.v2.live-v20
        valueSchema: features/v2/features.proto
        partitions: 3
        retention: 1209600000
      - name: fraud.feature-rejects.v1.live-v20
        partitions: 3
        retention: 604800000
