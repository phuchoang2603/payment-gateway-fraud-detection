kafka:
  storage:
    storageClass: gp3
    # A seeded stream-history month (about 85M v19 events) and its journal stay until unit cleanup.
    size: 64Gi
  # Stream-history units all write to this one broker. Its aws-workers node has about 0.7 CPU and 2.6 GiB
  # unreserved, so the request stays within that and the limit lets it burst for a replay.
  jvmOptions:
    -Xms: 2g
    -Xmx: 2g
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: '2'
      memory: 4Gi

entities:
  fraudFeatures:
    topics:
      - name: fraud.feature-updates.v2.live-v19
        valueSchema: features/v2/features.proto
        partitions: 3
        retention: 1209600000
      - name: fraud.feature-rejects.v1.live-v19
        partitions: 3
        retention: 604800000
