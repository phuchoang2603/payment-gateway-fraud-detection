global:
  imageTags:
    ghcr.io/phuchoang2603/payment-gateway-fraud-detection: dev
    ghcr.io/phuchoang2603/payment-gateway-fraud-detection/data-platform-metadata: dev
enabled: false
namespace: data
image:
  repository: ghcr.io/phuchoang2603/payment-gateway-fraud-detection/data-platform-metadata
openmetadata:
  url: http://openmetadata.data.svc.cluster.local:8585/api
  externalSecret:
    name: openmetadata
    store: gateway-doppler
    data:
      OPENMETADATA_TOKEN: OPENMETADATA_TOKEN
schedule: 0 3 * * *
activeDeadlineSeconds: 1800
connectors:
  starrocks:
    externalSecret:
      name: metadata-starrocks
      store: doppler
      data:
        STARROCKS_PASSWORD: STARROCKS_OPENMETADATA_PASSWORD
    kind: database
    discover: true
    source:
      type: starrocks
      serviceName: starrocks
      serviceConnection:
        config:
          type: StarRocks
          username: openmetadata
          password: ${STARROCKS_PASSWORD}
          hostPort: kube-starrocks-fe-service.data.svc.cluster.local:9030
          databaseName: lakehouse
          connectionArguments:
            init_command: SET CATALOG lakehouse
      sourceConfig:
        config:
          type: DatabaseMetadata
          schemaFilterPattern:
            includes:
            - ^bronze$
            - ^silver$
            - ^gold$
          markDeletedTables: false
          includeStoredProcedures: false
          overrideMetadata: false
  kafka:
    kind: messaging
    discover: true
    source:
      type: kafka
      serviceName: payment-gateway-kafka
      serviceConnection:
        config:
          type: Kafka
          bootstrapServers: payment-gateway-kafka-kafka-bootstrap.payment-gateway.svc.cluster.local:9092
          securityProtocol: PLAINTEXT
          schemaRegistryURL: http://schema-registry.payment-gateway.svc.cluster.local:8081
          consumerConfig:
            enable.auto.commit: false
      sourceConfig:
        config:
          type: MessagingMetadata
          topicFilterPattern:
            includes:
            - ^payments\.events\.v1$
            - ^fraud\.labels\.v1$
            - ^payments\.events\.v1\.faulty$
          generateSampleData: false
          markDeletedTopics: false
          overrideMetadata: false
  argo:
    kind: pipeline
    discover: false
    source:
      serviceName: argo
      serviceConnection:
        config:
          type: CustomPipeline
  object-storage:
    externalSecret:
      name: metadata-object-storage
      store: gateway-doppler
      data:
        AWS_ACCESS_KEY_ID: OBJECT_GATEWAY_ACCESS_KEY_ID
        AWS_SECRET_ACCESS_KEY: OBJECT_GATEWAY_SECRET_ACCESS_KEY
    kind: storage
    discover: false
    source:
      type: s3
      serviceName: platform-object-storage
      serviceConnection:
        config:
          type: S3
          awsConfig:
            awsAccessKeyId: ${AWS_ACCESS_KEY_ID}
            awsSecretAccessKey: ${AWS_SECRET_ACCESS_KEY}
            awsRegion: us-east-1
            endPointURL: https://minio.home.phuchoang.sbs
          bucketNames:
          - platform-dev
