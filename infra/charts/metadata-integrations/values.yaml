enabled: false
namespace: fraud-data-prod
image: ""
openmetadata:
  url: http://openmetadata.openmetadata.svc.cluster.local:8585/api
  externalSecret:
    name: openmetadata
    store: fraud-doppler
    data:
      OPENMETADATA_TOKEN: OPENMETADATA_TOKEN
schedule: "0 3 * * *"
activeDeadlineSeconds: 1800
connectors:
  starrocks:
    externalSecret:
      name: metadata-starrocks
      store: doppler
      data:
        STARROCKS_PASSWORD: STARROCKS_OPENMETADATA_PASSWORD
    kind: database
    discover: true
    source:
      type: starrocks
      serviceName: starrocks
      serviceConnection:
        config:
          type: StarRocks
          username: openmetadata
          password: ${STARROCKS_PASSWORD}
          hostPort: kube-starrocks-fe-service.starrocks.svc.cluster.local:9030
          databaseName: lakehouse
          connectionArguments:
            init_command: SET CATALOG lakehouse
      sourceConfig:
        config:
          type: DatabaseMetadata
          schemaFilterPattern:
            includes: ["^bronze$", "^silver$", "^gold$"]
          markDeletedTables: false
          includeStoredProcedures: false
          overrideMetadata: false
  kafka:
    kind: messaging
    discover: true
    source:
      type: kafka
      serviceName: payment-gateway-kafka
      serviceConnection:
        config:
          type: Kafka
          bootstrapServers: payment-gateway-kafka-kafka-bootstrap.payment-gateway.svc.cluster.local:9092
          securityProtocol: PLAINTEXT
          schemaRegistryURL: http://schema-registry.payment-gateway.svc.cluster.local:8081
          consumerConfig:
            enable.auto.commit: false
      sourceConfig:
        config:
          type: MessagingMetadata
          topicFilterPattern:
            includes: ["^payments\\.events\\.v1$", "^fraud\\.labels\\.v1$", "^payments\\.events\\.v1\\.faulty$"]
          generateSampleData: false
          markDeletedTopics: false
          overrideMetadata: false
  rustfs:
    externalSecret:
      name: metadata-rustfs
      store: doppler
      data:
        AWS_ACCESS_KEY_ID: STARROCKS_RUSTFS_ACCESS_KEY
        AWS_SECRET_ACCESS_KEY: STARROCKS_RUSTFS_SECRET_KEY
    kind: storage
    discover: false
    source:
      type: s3
      serviceName: rustfs
      serviceConnection:
        config:
          type: S3
          awsConfig:
            awsAccessKeyId: ${AWS_ACCESS_KEY_ID}
            awsSecretAccessKey: ${AWS_SECRET_ACCESS_KEY}
            awsRegion: us-east-1
            endPointURL: https://minio.home.phuchoang.sbs
          bucketNames: [fraud-lakehouse-prod]
  argo:
    kind: pipeline
    discover: false
    source:
      serviceName: argo
      serviceConnection:
        config:
          type: CustomPipeline
