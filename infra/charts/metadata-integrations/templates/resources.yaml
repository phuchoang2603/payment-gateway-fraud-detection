{{- if .Values.enabled }}
{{- $registrationSecrets := list }}
{{- $externalSecrets := list .Values.openmetadata.externalSecret }}
{{- $connectors := dict }}
{{- range $name, $connector := .Values.connectors }}
{{- $_ := set $connectors $name (omit $connector "externalSecret") }}
{{- with $connector.externalSecret }}
{{- $registrationSecrets = append $registrationSecrets .name }}
{{- $externalSecrets = append $externalSecrets . }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: metadata-connectors
  namespace: {{ .Values.namespace }}
data:
  connectors.json: {{ $connectors | toJson | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: metadata-client
  namespace: {{ .Values.namespace }}
data:
  OPENMETADATA_URL: {{ .Values.openmetadata.url | quote }}
  METADATA_CONNECTORS_FILE: /etc/metadata/connectors.json
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: metadata-integrations
  namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: metadata-integrations
  namespace: {{ .Values.namespace }}
rules:
  - apiGroups: [argoproj.io]
    resources: [workflowtaskresults]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: metadata-integrations
  namespace: {{ .Values.namespace }}
subjects:
  - kind: ServiceAccount
    name: metadata-integrations
    namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: metadata-integrations
{{- range $externalSecrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .store }}
  target:
    name: {{ .name }}
  data:
    {{- range $local, $remote := .data }}
    - secretKey: {{ $local }}
      remoteRef:
        key: {{ $remote }}
    {{- end }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: metadata-register-{{ printf "%s%s%s%s" (toJson .Values.connectors) (include "metadata-integrations.image" (dict "image" .Values.image "global" $.Values.global)) (toJson .Values.openmetadata.externalSecret) .Values.openmetadata.url | sha256sum | trunc 12 }}
  namespace: {{ .Values.namespace }}
spec:
  backoffLimit: 2
  activeDeadlineSeconds: {{ .Values.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metadata-integrations
    spec:
      serviceAccountName: metadata-integrations
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: register
          image: {{ include "metadata-integrations.image" (dict "image" .Values.image "global" $.Values.global) | quote }}
          command: [python, -m, openmetadata_jobs.integrations]
          {{- include "metadata-integrations.runtime" (dict "Values" .Values "secretRefs" $registrationSecrets "stage" "register") | nindent 10 }}
      volumes:
        - name: connectors
          configMap:
            name: metadata-connectors
{{- end }}
