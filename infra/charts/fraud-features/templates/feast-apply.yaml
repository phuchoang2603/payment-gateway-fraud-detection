{{- if .Values.feast.enabled }}
{{- range $secret := list (dict "name" .Values.storage.secretName "store" .Values.storage.store "data" (dict "AWS_ACCESS_KEY_ID" "OBJECT_GATEWAY_ACCESS_KEY_ID" "AWS_SECRET_ACCESS_KEY" "OBJECT_GATEWAY_SECRET_ACCESS_KEY")) (dict "name" .Values.catalog.secretName "store" .Values.catalog.store "data" (dict "ICEBERG_CLIENT_SECRET" "ICEBERG_CLIENT_SECRET")) }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secret.name }}
  namespace: {{ $.Release.Namespace }}
spec:
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $secret.store }}
  target:
    name: {{ $secret.name }}
  data:
    {{- range $local, $remote := $secret.data }}
    - secretKey: {{ $local }}
      remoteRef:
        key: {{ $remote }}
    {{- end }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: feast-apply
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: data-pipelines
        feast-client: "true"
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: apply
          image: {{ include "fraud-features.image" (dict "image" .Values.images.spark "global" .Values.global) | quote }}
          command: [/opt/data-pipeline/feast/.venv/bin/python, -m, fraud_feast.apply]
          env:
            {{- include "fraud-features.feastEnv" . | nindent 12 }}
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {memory: 2Gi}
{{- end }}
