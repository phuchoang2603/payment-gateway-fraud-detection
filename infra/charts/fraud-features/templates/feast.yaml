{{- if .Values.feast.enabled }}
{{- range $mode, $name := dict "online" "feature-writer-online" "offline" "feature-writer-offline" "serve" "feast-server" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        feast-client: "true"
        kafka-client: feast-writer
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $name }}
          image: {{ include "fraud-features.image" (dict "image" $.Values.images.feast "global" $.Values.global) | quote }}
          imagePullPolicy: {{ $.Values.images.feast.pullPolicy }}
          {{- if ne $mode "serve" }}
          command: [python, -m, fraud_feast.stream_writer]
          args: [--store, {{ $mode }}]
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            {{- include "fraud-features.feastEnv" $ | nindent 12 }}
          {{- if ne $mode "serve" }}
            - name: FEATURE_KAFKA_BROKERS
              value: {{ $.Values.kafkaBrokers | quote }}
            - name: FEATURE_UPDATE_TOPIC
              value: {{ $.Values.topic | quote }}
            - name: FEATURE_EPOCH
              value: {{ $.Values.epoch | quote }}
          {{- end }}
          {{- if eq $mode "serve" }}
          ports:
            - name: http
              containerPort: 6566
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 30
            periodSeconds: 10
          {{- end }}
          volumeMounts:
            - name: runtime
              mountPath: /tmp
          resources:
            {{- toYaml $.Values.feast.resources | nindent 12 }}
      volumes:
        - name: runtime
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  policyTypes: [Ingress, Egress]
  {{- if eq $mode "serve" }}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: payment-gateway
          podSelector:
            matchLabels:
              app.kubernetes.io/name: fraud-service
      ports:
        - port: 6566
          protocol: TCP
  {{- else }}
  ingress: []
  {{- end }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: {{ $.Values.redis.name }}
      ports:
        - port: 6379
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: polaris
      ports:
        - {port: 8181, protocol: TCP}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - {port: 443, protocol: TCP}
    {{- if ne $mode "serve" }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: payment-gateway
          podSelector:
            matchLabels:
              strimzi.io/cluster: payment-gateway-kafka
      ports:
        - port: 9092
          protocol: TCP
    {{- end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: feast-server
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: feast-server
  ports:
    - name: http
      port: 6566
      targetPort: http
{{- end }}
