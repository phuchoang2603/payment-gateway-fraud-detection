global:
  imageTags:
    ghcr.io/phuchoang2603/payment-gateway-fraud-detection: dev
    ghcr.io/phuchoang2603/payment-gateway-fraud-detection/feast: dev
    ghcr.io/phuchoang2603/payment-gateway-fraud-detection/streaming: dev
images:
  feast:
    repository: ghcr.io/phuchoang2603/payment-gateway-fraud-detection/feast
    pullPolicy: IfNotPresent
  streaming:
    repository: ghcr.io/phuchoang2603/payment-gateway-fraud-detection/streaming
    pullPolicy: IfNotPresent
externalSecrets:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gateway-doppler
epoch: live-v18
definitionHash: 958f9b0fd7e50ba33a22526271ff2e62eafcf827c9f9e0bce1c35c4a016f85a3
topic: fraud.feature-updates.v1.live-v18
kafkaBrokers: payment-gateway-kafka-kafka-bootstrap.payment-gateway.svc.cluster.local:9092
feast:
  enabled: true
  writerGroup: fraud-feast-writer-live-v18
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: '1'
      memory: 1Gi
redis:
  name: payment-gateway-feast-redis
  image:
    repository: quay.io/opstree/redis
    tag: v7.2.16
    pullPolicy: IfNotPresent
  appendonly: 'yes'
  storageSize: 2Gi
  maxmemory: 512mb
  resources:
    requests:
      cpu: 100m
      memory: 768Mi
    limits:
      cpu: 500m
      memory: 1536Mi
  password:
    secretName: payment-gateway-feast-redis
    secretKey: password
    remoteKey: GATEWAY_FEAST_REDIS_PASSWORD
  clients:
  - feast-writer
  - feast-server
streaming:
  enabled: true
  sourceTopic: payments.events.v1
  sourcePartitions: 3
  maxEntityEntries: 50000
  storageRoot: s3://platform-dev/runs/payment-gateway/flink
  storageSecretName: gateway-flink-storage
  jobManager:
    resources:
      requests:
        cpu: '1'
        memory: 1536Mi
      limits:
        memory: 1536Mi
  taskManager:
    resources:
      requests:
        cpu: '1'
        memory: 2Gi
      limits:
        memory: 2Gi
  storageEndpoint: https://minio.home.phuchoang.sbs
  pathStyle: true
  region: us-east-1
  storageStore: gateway-doppler
