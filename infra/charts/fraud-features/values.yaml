images:
  feast:
    repository: ghcr.io/phuchoang2603/payment-gateway-fraud-detection/feast
    tag: latest
    digest: ""
    revision: ""
    pullPolicy: IfNotPresent
  streaming:
    repository: ghcr.io/phuchoang2603/payment-gateway-fraud-detection/streaming
    tag: latest
    digest: ""
    revision: ""
    pullPolicy: IfNotPresent

externalSecrets:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fraud-doppler

epoch: live-v1
definitionHash: 8ca9a423f452f8ed7a8d1e8aa082dadb72590498cfd1e8da48f94f6c06b0e50d
topic: fraud.feature-updates.v1.live-v1
kafkaBrokers: payment-gateway-kafka-kafka-bootstrap.payment-gateway.svc.cluster.local:9092

feast:
  enabled: true
  writerGroup: fraud-feast-writer-live-v1
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {cpu: '1', memory: 1Gi}

redis:
  name: payment-gateway-feast-redis
  image:
    repository: quay.io/opstree/redis
    tag: v7.2.16
    pullPolicy: IfNotPresent
  appendonly: 'yes'
  storageSize: 2Gi
  maxmemory: 512mb
  resources:
    requests: {cpu: 100m, memory: 768Mi}
    limits: {cpu: 500m, memory: 1536Mi}
  password:
    secretName: payment-gateway-feast-redis
    secretKey: password
    remoteKey: GATEWAY_FEAST_REDIS_PASSWORD
  clients: [feast-writer, feast-server]

streaming:
  enabled: true
  sourceTopic: payments.events.v1
  sourcePartitions: 3
  maxEntityEntries: 50000
  storageHostname: minio.home.phuchoang.sbs
  storageRoot: s3://fraud-flink-prod
  jobManager:
    resources:
      requests: {cpu: '1', memory: 1536Mi}
      limits: {memory: 1536Mi}
  taskManager:
    resources:
      requests: {cpu: '1', memory: 3Gi}
      limits: {memory: 3Gi}
