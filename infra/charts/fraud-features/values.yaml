global:
  imageTags:
    ghcr.io/phuchoang2603/payment-gateway-fraud-detection: dev
    ghcr.io/phuchoang2603/payment-gateway-fraud-detection/feast: dev
    ghcr.io/phuchoang2603/payment-gateway-fraud-detection/streaming: dev
    ghcr.io/phuchoang2603/payment-gateway-fraud-detection/data-platform-spark: dev
images:
  feast:
    repository: ghcr.io/phuchoang2603/payment-gateway-fraud-detection/feast
    pullPolicy: IfNotPresent
  streaming:
    repository: ghcr.io/phuchoang2603/payment-gateway-fraud-detection/streaming
    pullPolicy: IfNotPresent
  spark:
    repository: ghcr.io/phuchoang2603/payment-gateway-fraud-detection/data-platform-spark
    pullPolicy: IfNotPresent
externalSecrets:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gateway-doppler
epoch: live-v18
topic: fraud.feature-updates.v2.live-v18
kafkaBrokers: payment-gateway-kafka-kafka-bootstrap.payment-gateway.svc.cluster.local:9092
feast:
  enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: '1'
      memory: 1Gi
  registry: s3://platform-dev/feast/payment-gateway/registry.pb
  epochs: history-v18,live-v18
redis:
  name: payment-gateway-feast-redis
  image:
    repository: quay.io/opstree/redis
    tag: v7.2.16
    pullPolicy: IfNotPresent
  appendonly: 'yes'
  storageSize: 2Gi
  maxmemory: 512mb
  resources:
    requests:
      cpu: 100m
      memory: 768Mi
    limits:
      cpu: 500m
      memory: 1536Mi
  password:
    secretName: payment-gateway-feast-redis
    secretKey: password
    remoteKey: GATEWAY_FEAST_REDIS_PASSWORD
  clients:
  - feature-writer
  - feast-server
  - data-pipelines
streaming:
  enabled: true
  sourceTopic: payments.events.v1
  sourcePartitions: 3
  maxEntityEntries: 50000
  storageRoot: s3://platform-dev/runs/payment-gateway/flink
  storageSecretName: gateway-flink-storage
  jobManager:
    resources:
      requests:
        cpu: '1'
        memory: 1536Mi
      limits:
        memory: 1536Mi
  taskManager:
    resources:
      requests:
        cpu: '1'
        memory: 2Gi
      limits:
        memory: 2Gi
  storageEndpoint: https://minio.home.phuchoang.sbs
  pathStyle: true
  region: us-east-1
  storageStore: gateway-doppler
storage:
  secretName: feast-storage
  store: gateway-doppler
  endpoint: https://minio.home.phuchoang.sbs
  pathStyle: 'true'
  region: us-east-1
catalog:
  uri: http://iceberg-catalog.data.svc.cluster.local:8181/api/catalog
  warehouse: lakehouse
  clientId: platform
  oauth2Uri: http://iceberg-catalog.data.svc.cluster.local:8181/api/catalog/v1/oauth/tokens
  secretName: feast-iceberg
  store: doppler
