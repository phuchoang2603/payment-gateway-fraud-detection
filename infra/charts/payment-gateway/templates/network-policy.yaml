{{- range $name, $svc := include "payment-gateway.services" . | fromYaml }}
{{- if $svc.networkPolicy.enabled }}
{{- $callers := $svc.mesh.callers }}
{{- range $svc.mesh.rules }}
{{- $callers = concat $callers .callers }}
{{- end }}
{{- $from := deepCopy $svc.networkPolicy.ingressFrom }}
{{- if not $from }}
{{- range $callers | uniq }}
{{- $from = append $from (dict "podSelector" (dict "matchLabels" (dict "app.kubernetes.io/name" .))) }}
{{- end }}
{{- end }}
{{- range $svc.mesh.callerNamespaces }}
{{- $from = append $from (dict "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" .))) }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "payment-gateway.selector" $name | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    {{- if $svc.mesh.enabled }}
    - ports:
        - port: 15008
          protocol: TCP
    - from:
        - ipBlock:
            cidr: 169.254.7.127/32
    {{- end }}
    {{- if $from }}
    - from:
        {{- toYaml $from | nindent 8 }}
      ports:
        {{- range $svc.ports }}
        - port: {{ .containerPort }}
          protocol: TCP
        {{- end }}
    {{- else if not $svc.mesh.enabled }}
    []
    {{- end }}
{{- end }}
{{- end }}
