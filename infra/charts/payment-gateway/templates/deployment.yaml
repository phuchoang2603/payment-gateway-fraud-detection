{{- range $name, $svc := include "payment-gateway.services" . | fromYaml }}
{{- $port := first $svc.ports }}
{{- $image := include "payment-gateway.image" (dict "root" $ "name" $name "service" $svc) }}
{{- $mounts := list }}
{{- range $svc.externalSecrets }}
{{- if .mountPath }}
{{- $mounts = append $mounts . }}
{{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  labels:
    {{- include "payment-gateway.selector" $name | nindent 4 }}
spec:
  replicas: {{ $svc.replicaCount }}
  selector:
    matchLabels:
      {{- include "payment-gateway.selector" $name | nindent 6 }}
  template:
    metadata:
      annotations:
        resource.opentelemetry.io/service.name: {{ $name | quote }}
      labels:
        {{- include "payment-gateway.selector" $name | nindent 8 }}
        {{- if $svc.mesh.enabled }}
        istio.io/dataplane-mode: ambient
        {{- end }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ $svc.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- if $svc.database }}
      initContainers:
        - name: migrate
          image: {{ $image | quote }}
          imagePullPolicy: {{ $svc.image.pullPolicy }}
          args: [migrate]
          securityContext:
            {{- include "payment-gateway.container-security" . | nindent 12 }}
          env:
            {{- include "payment-gateway.database-env" (dict "database" $svc.database "migrate" true) | nindent 12 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ $image | quote }}
          imagePullPolicy: {{ $svc.image.pullPolicy }}
          securityContext:
            {{- include "payment-gateway.container-security" . | nindent 12 }}
          ports:
            {{- range $svc.ports }}
            - name: {{ .name }}
              containerPort: {{ .containerPort }}
              protocol: TCP
            {{- end }}
          env:
            - name: OTEL_SERVICE_NAME
              value: {{ $name | quote }}
            - name: TRACING_ENABLED
              value: {{ $svc.telemetry.tracingEnabled | quote }}
            - name: METRICS_ENABLED
              value: {{ $svc.telemetry.metricsEnabled | quote }}
            - name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
              value: {{ $svc.telemetry.metricsEndpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: {{ $svc.telemetry.tracesEndpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
              value: cumulative
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.cluster.name=prod-talos,deployment.environment=prod
            - name: OTEL_TRACES_SAMPLER_ARG
              value: {{ $svc.telemetry.samplingRatio | quote }}
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: {{ $svc.telemetry.metricExportInterval | quote }}
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: SERVICE_REVISION
              value: {{ $.Values.imageTag | quote }}
            {{- if $svc.database }}
            {{- include "payment-gateway.database-env" (dict "database" $svc.database "migrate" false) | nindent 12 }}
            {{- end }}
            {{- range $mounts }}
            {{- $mountPath := .mountPath }}
            {{- range .data }}
            {{- if .env }}
            - name: {{ .env }}
              value: {{ printf "%s/%s" $mountPath .secretKey | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with $svc.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $mounts }}
          volumeMounts:
            {{- range . }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
              readOnly: true
            {{- end }}
          {{- end }}
          {{- range $probe, $path := dict "liveness" "/health" "readiness" "/ready" }}
          {{ $probe }}Probe:
            {{- if eq $port.name "http" }}
            httpGet:
              path: {{ $path }}
              port: {{ $port.containerPort }}
            {{- else }}
            grpc:
              port: {{ $port.containerPort }}
              service: {{ $probe }}
            {{- end }}
            {{- toYaml (index $svc.probes $probe) | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
      {{- with $mounts }}
      volumes:
        {{- range . }}
        - name: {{ .name }}
          secret:
            secretName: {{ .name }}
        {{- end }}
      {{- end }}
{{- end }}
