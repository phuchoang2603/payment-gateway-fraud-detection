apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.database.name }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: {{ .Values.database.name }}
  policyTypes:
    - Ingress
  ingress:
    # The database pods are in the Istio ambient mesh, so in-mesh peers (including the CNPG
    # operator's instance-manager calls) arrive over the ztunnel HBONE tunnel on 15008, and the
    # kubelet health probes on 8000 are rewritten to the ztunnel link-local source. Neither matches
    # the peer selectors below, so admit both explicitly or the instance never reports a system ID
    # and the cluster never becomes ready.
    - ports:
        - port: 15008
          protocol: TCP
    - from:
        - ipBlock:
            cidr: {{ .Values.database.meshProbeSource }}
      ports:
        - port: 8000
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ .Values.database.name }}
      ports:
        - port: 5432
          protocol: TCP
        - port: 8000
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: operators
      ports:
        - port: 5432
          protocol: TCP
        - port: 8000
          protocol: TCP
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [payments, fraud-service, notifier, vault-simulator, processor-simulator]
      ports:
        - port: 5432
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              strimzi.io/kind: KafkaConnect
              strimzi.io/cluster: payment-gateway-connect
      ports:
        - port: 5432
          protocol: TCP
