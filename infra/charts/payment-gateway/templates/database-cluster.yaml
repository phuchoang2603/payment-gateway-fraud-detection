apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.database.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  instances: {{ .Values.database.instances }}
  imageName: {{ .Values.database.imageName }}
  enableSuperuserAccess: false
  storage:
    size: {{ .Values.database.storage.size }}
    storageClass: {{ .Values.database.storage.storageClass }}
  resources:
    {{- toYaml .Values.database.resources | nindent 4 }}
  postgresql:
    parameters:
      wal_level: logical
      max_replication_slots: "16"
      max_wal_senders: "16"
    pg_hba:
      {{- range $name, $database := .Values.database.databases }}
      - host {{ $name }} {{ join "," (concat (list $name) (keys ($database.roles | default dict) | sortAlpha)) }} all scram-sha-256
      {{- end }}
      - host replication payments_cdc all scram-sha-256
      - host all all all reject
  bootstrap:
    initdb:
      database: payments
      owner: payments
      secret:
        name: {{ .Values.database.name }}-payments
  managed:
    roles:
      {{- range include "payment-gateway.database-roles" . | fromYamlArray }}
      {{- if ne .name "payments" }}
      - name: {{ .name }}
        ensure: present
        login: true
        replication: {{ default false .replication }}
        passwordSecret:
          name: {{ $.Values.database.name }}-{{ .name | replace "_" "-" }}
      {{- end }}
      {{- end }}
{{- range $name, $database := .Values.database.databases }}
{{- if ne $name "payments" }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: {{ $.Values.database.name }}-{{ $name }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  cluster:
    name: {{ $.Values.database.name }}
  name: {{ $name }}
  owner: {{ $name }}
  databaseReclaimPolicy: retain
{{- end }}
{{- end }}
