{{- if .Values.metadataReader.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: metadata-reader-grants
  namespace: {{ .Release.Namespace }}
data:
  grants.sql: |
{{ .Files.Get "files/metadata-reader-grants.sql" | indent 4 }}
{{- range $name, $database := .Values.database.databases }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: metadata-reader-{{ $name }}-{{ printf "%s%s" (toJson $.Values.database) ($.Files.Get "files/metadata-reader-grants.sql") | sha256sum | trunc 8 }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metadata-reader-setup
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: grants
          image: {{ $.Values.database.imageName }}
          command: [psql]
          args: ["-v", "ON_ERROR_STOP=1", "-f", /etc/metadata/grants.sql]
          env:
            - name: PGHOST
              value: {{ $.Values.database.name }}-rw
            - {name: PGPORT, value: "5432"}
            - {name: PGSSLMODE, value: require}
            - {name: PGDATABASE, value: {{ $name }}}
            - {name: PGUSER, value: {{ $name }}}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.database.name }}-{{ $name }}
                  key: password
          volumeMounts:
            - {name: sql, mountPath: /etc/metadata, readOnly: true}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 128Mi}
      volumes:
        - name: sql
          configMap:
            name: metadata-reader-grants
{{- end }}
{{- end }}
