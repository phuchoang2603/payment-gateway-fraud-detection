{{- range include "payment-gateway.database-roles" . | fromYamlArray }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $.Values.database.name }}-{{ .name | replace "_" "-" }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ $.Values.externalSecrets.secretStoreRef.kind }}
    name: {{ $.Values.externalSecrets.secretStoreRef.name }}
  target:
    name: {{ $.Values.database.name }}-{{ .name | replace "_" "-" }}
    creationPolicy: Owner
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
      type: kubernetes.io/basic-auth
      engineVersion: v2
      data:
        username: {{ .name | quote }}
        password: "{{`{{ .password }}`}}"
  data:
    - secretKey: password
      remoteRef:
        key: GATEWAY_DB_{{ .name | upper }}_PASSWORD
{{- end }}
{{- range $name, $service := include "payment-gateway.services" . | fromYaml }}
{{- with $service.database }}
{{- $database := index $.Values.database.databases . }}
{{- $runtimeRole := default . $database.runtimeRole }}
{{- $roles := uniq (list . $runtimeRole) }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ . }}-database
  namespace: {{ $.Release.Namespace }}
spec:
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    {{- toYaml $.Values.externalSecrets.secretStoreRef | nindent 4 }}
  target:
    name: {{ . }}-database
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        database-url: {{ printf "postgres://%s:{{ .%s | urlquery }}@%s-rw.%s.svc.cluster.local:5432/%s?sslmode=require" $runtimeRole $runtimeRole $.Values.database.name $.Release.Namespace . | quote }}
        migrate-database-url: {{ printf "postgres://%s:{{ .%s | urlquery }}@%s-rw.%s.svc.cluster.local:5432/%s?sslmode=require" . . $.Values.database.name $.Release.Namespace . | quote }}
  data:
    {{- range $roles }}
    - secretKey: {{ . }}
      remoteRef:
        key: GATEWAY_DB_{{ . | upper }}_PASSWORD
    {{- end }}
{{- end }}
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: payments-cdc
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
  target:
    name: payments-cdc
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: payments_cdc
        password: "{{`{{ .password }}`}}"
  data:
    - secretKey: password
      remoteRef:
        key: GATEWAY_DB_PAYMENTS_CDC_PASSWORD
