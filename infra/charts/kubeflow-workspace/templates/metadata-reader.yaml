{{- if .Values.metadataReader.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: model-registry-metadata-reader
  namespace: fraud-ml-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.secretStoreName }}
  target:
    name: model-registry-metadata-reader
  data:
    - secretKey: password
      remoteRef:
        key: KUBEFLOW_REGISTRY_METADATA_PASSWORD
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: model-registry-reader-setup
  namespace: fraud-ml-prod
data:
  setup.sql: |
{{ .Files.Get "files/metadata-reader.sql" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: model-registry-reader-{{ .Files.Get "files/metadata-reader.sql" | sha256sum | trunc 8 }}
  namespace: fraud-ml-prod
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 3
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: grants
          image: postgres:16-alpine
          command: [psql]
          args: ["-v", "ON_ERROR_STOP=1", "-f", /etc/metadata/setup.sql]
          env:
            - {name: PGHOST, value: model-registry-db}
            - {name: PGDATABASE, value: metadb}
            - name: PGUSER
              valueFrom:
                secretKeyRef: {name: model-registry-db-secrets, key: POSTGRES_USER}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: model-registry-db-secrets, key: POSTGRES_PASSWORD}
            - name: READER_PASSWORD
              valueFrom:
                secretKeyRef: {name: model-registry-metadata-reader, key: password}
          volumeMounts:
            - {name: sql, mountPath: /etc/metadata, readOnly: true}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 128Mi}
      volumes:
        - name: sql
          configMap: {name: model-registry-reader-setup}
{{- end }}
