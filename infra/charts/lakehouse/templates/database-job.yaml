apiVersion: v1
kind: ConfigMap
metadata:
  name: lakehouse-database-script
data:
  setup.sh: |
    set -eu
    client() {
      clickhouse-client --host "$CLICKHOUSE_HOST" --port "$CLICKHOUSE_PORT" --user "$CLICKHOUSE_ADMIN_USER" "$@"
    }
    statement() {
      if ! error=$(printf '%s;\n' "$1" | client --multiquery 2>&1 >/dev/null); then
        echo "ClickHouse statement failed: $(printf '%s' "$error" | grep -o 'Code: [0-9]*' | head -n 1)" >&2
        return 1
      fi
    }
    query() {
      client --format TSVRaw --query "$1"
    }
    until client --query "SELECT 1" >/dev/null 2>&1; do
      echo "waiting for ClickHouse" >&2
      sleep 10
    done
    definition="CREATE DATABASE $LAKEHOUSE_DATABASE ENGINE = DataLakeCatalog('$LAKEHOUSE_REST_URI') SETTINGS catalog_type = 'rest', catalog_credential = '$LAKEHOUSE_CLIENT_ID:$ICEBERG_CLIENT_SECRET', auth_scope = '$LAKEHOUSE_SCOPE', oauth_server_uri = '$LAKEHOUSE_OAUTH_URI', warehouse = '$LAKEHOUSE_WAREHOUSE', storage_endpoint = '$STORAGE_ENDPOINT', region = '$STORAGE_REGION', aws_access_key_id = '$AWS_ACCESS_KEY_ID', aws_secret_access_key = '$AWS_SECRET_ACCESS_KEY', vended_credentials = false"
    marker="definition-sha256:$(printf '%s' "$definition" | sha256sum | cut -d' ' -f1)"
    current=$(query "SELECT comment FROM system.databases WHERE name = '$LAKEHOUSE_DATABASE'")
    if [ "$current" = "$marker" ]; then
      echo "lakehouse database definition is current"
      exit 0
    fi
    statement "DROP DATABASE IF EXISTS $LAKEHOUSE_DATABASE SYNC"
    statement "$definition COMMENT '$marker'"
    echo "lakehouse database created"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: lakehouse-database
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 20
  activeDeadlineSeconds: 1200
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: apply
          image: {{ .Values.clickhouse.image }}
          command: [bash, /script/setup.sh]
          env:
            - {name: CLICKHOUSE_HOST, value: {{ .Values.clickhouse.host | quote }}}
            - {name: CLICKHOUSE_PORT, value: {{ .Values.clickhouse.nativePort | quote }}}
            - {name: CLICKHOUSE_ADMIN_USER, value: {{ .Values.clickhouse.adminUser | quote }}}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef: {name: lakehouse-admin, key: ADMIN_PASSWORD}
            - {name: LAKEHOUSE_DATABASE, value: {{ .Values.lakehouse.database | quote }}}
            - {name: LAKEHOUSE_REST_URI, value: {{ .Values.lakehouse.restCatalogUri | quote }}}
            - {name: LAKEHOUSE_WAREHOUSE, value: {{ .Values.lakehouse.warehouse | quote }}}
            - {name: LAKEHOUSE_CLIENT_ID, value: {{ .Values.lakehouse.clientId | quote }}}
            - {name: LAKEHOUSE_SCOPE, value: {{ .Values.lakehouse.scope | quote }}}
            - {name: LAKEHOUSE_OAUTH_URI, value: {{ .Values.lakehouse.oauthServerUri | quote }}}
            - {name: STORAGE_ENDPOINT, value: {{ printf "%s/%s" .Values.catalog.endpoint .Values.catalog.bucket | quote }}}
            - {name: STORAGE_REGION, value: {{ .Values.catalog.region | quote }}}
            - name: ICEBERG_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: iceberg-bootstrap, key: client-secret}
          envFrom:
            - secretRef:
                name: iceberg-storage
          volumeMounts:
            - {name: script, mountPath: /script}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
      volumes:
        - name: script
          configMap:
            name: lakehouse-database-script
