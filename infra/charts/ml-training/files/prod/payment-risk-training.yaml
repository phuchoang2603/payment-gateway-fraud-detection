pipelineInfo:
  description: Build the payment_risk_v1 training set, train on one GPU, gate, register
    and roll out.
  name: payment-risk-training
root:
  dag:
    tasks:
      condition-1:
        componentRef:
          name: comp-condition-1
        dependentTasks:
        - plan-windows
        inputs:
          parameters:
            pipelinechannel--gate_margin:
              componentInputParameter: gate_margin
            pipelinechannel--plan-windows-cutoff:
              taskOutputParameter:
                outputParameterKey: cutoff
                producerTask: plan-windows
            pipelinechannel--plan-windows-run:
              taskOutputParameter:
                outputParameterKey: run
                producerTask: plan-windows
            pipelinechannel--plan-windows-test:
              taskOutputParameter:
                outputParameterKey: test
                producerTask: plan-windows
            pipelinechannel--plan-windows-train:
              taskOutputParameter:
                outputParameterKey: train
                producerTask: plan-windows
            pipelinechannel--plan-windows-validation:
              taskOutputParameter:
                outputParameterKey: validation
                producerTask: plan-windows
            pipelinechannel--role:
              componentInputParameter: role
            pipelinechannel--training_set_snapshot:
              componentInputParameter: training_set_snapshot
            pipelinechannel--trigger:
              componentInputParameter: trigger
            pipelinechannel--tune_trials:
              componentInputParameter: tune_trials
        taskInfo:
          name: new-data
        triggerPolicy:
          condition: inputs.parameter_values['pipelinechannel--plan-windows-run']
            == 'true'
      plan-windows:
        cachingOptions: {}
        componentRef:
          name: comp-plan-windows
        inputs:
          parameters:
            create_time:
              runtimeValue:
                constant: '{{$.pipeline_job_create_time_utc}}'
            fixed_cutoff:
              componentInputParameter: cutoff
            fixed_test:
              componentInputParameter: test
            fixed_train:
              componentInputParameter: train
            fixed_validation:
              componentInputParameter: validation
            force:
              componentInputParameter: force
            lag_days:
              componentInputParameter: lag_days
            run_id:
              runtimeValue:
                constant: '{{$.pipeline_job_uuid}}'
            test_days:
              componentInputParameter: test_days
            train_days:
              componentInputParameter: train_days
            validation_days:
              componentInputParameter: validation_days
        retryPolicy:
          backoffDuration: 30s
          backoffFactor: 2.0
          backoffMaxDuration: 3600s
          maxRetryCount: 2
        taskInfo:
          name: plan-windows
  inputDefinitions:
    parameters:
      cutoff:
        defaultValue: ''
        isOptional: true
        parameterType: STRING
      force:
        defaultValue: false
        isOptional: true
        parameterType: BOOLEAN
      gate_margin:
        defaultValue: 0.005
        isOptional: true
        parameterType: NUMBER_DOUBLE
      lag_days:
        defaultValue: 1.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      role:
        defaultValue: champion
        isOptional: true
        parameterType: STRING
      test:
        defaultValue: ''
        isOptional: true
        parameterType: STRING
      test_days:
        defaultValue: 14.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      train:
        defaultValue: ''
        isOptional: true
        parameterType: STRING
      train_days:
        defaultValue: 56.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      training_set_snapshot:
        defaultValue: ''
        isOptional: true
        parameterType: STRING
      trigger:
        defaultValue: ''
        isOptional: true
        parameterType: STRING
      tune_trials:
        defaultValue: 0.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      validation:
        defaultValue: ''
        isOptional: true
        parameterType: STRING
      validation_days:
        defaultValue: 14.0
        isOptional: true
        parameterType: NUMBER_INTEGER
