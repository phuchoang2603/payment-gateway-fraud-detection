# PIPELINE DEFINITION
# Name: payment-risk-training
# Description: Build the payment_risk_v1 training set, train on one GPU, gate, register and roll out.
# Inputs:
#    cutoff: str [Default: '']
#    force: bool [Default: False]
#    gate_margin: float [Default: 0.005]
#    lag_days: int [Default: 1.0]
#    role: str [Default: 'champion']
#    test: str [Default: '']
#    test_days: int [Default: 14.0]
#    train: str [Default: '']
#    train_days: int [Default: 56.0]
#    training_set_snapshot: str [Default: '']
#    trigger: str [Default: '']
#    tune_trials: int [Default: 0.0]
#    validation: str [Default: '']
#    validation_days: int [Default: 14.0]
components:
  comp-assemble-examples:
    executorLabel: exec-assemble-examples
    inputDefinitions:
      parameters:
        cutoff:
          parameterType: STRING
        existing_snapshot:
          parameterType: STRING
        run_id:
          parameterType: STRING
        test:
          parameterType: STRING
        train:
          parameterType: STRING
        validation:
          parameterType: STRING
    outputDefinitions:
      parameters:
        snapshot:
          parameterType: STRING
  comp-check-examples:
    executorLabel: exec-check-examples
    inputDefinitions:
      parameters:
        run_id:
          parameterType: STRING
        snapshot:
          parameterType: STRING
    outputDefinitions:
      parameters:
        report:
          parameterType: STRING
  comp-condition-1:
    dag:
      tasks:
        assemble-examples:
          cachingOptions: {}
          componentRef:
            name: comp-assemble-examples
          dependentTasks:
          - for-loop-2
          inputs:
            parameters:
              cutoff:
                componentInputParameter: pipelinechannel--plan-windows-cutoff
              existing_snapshot:
                componentInputParameter: pipelinechannel--training_set_snapshot
              run_id:
                runtimeValue:
                  constant: '{{$.pipeline_job_uuid}}'
              test:
                componentInputParameter: pipelinechannel--plan-windows-test
              train:
                componentInputParameter: pipelinechannel--plan-windows-train
              validation:
                componentInputParameter: pipelinechannel--plan-windows-validation
          retryPolicy:
            backoffDuration: 30s
            backoffFactor: 2.0
            backoffMaxDuration: 3600s
            maxRetryCount: 2
          taskInfo:
            name: assemble-examples
        check-examples:
          cachingOptions: {}
          componentRef:
            name: comp-check-examples
          dependentTasks:
          - assemble-examples
          inputs:
            parameters:
              run_id:
                runtimeValue:
                  constant: '{{$.pipeline_job_uuid}}'
              snapshot:
                taskOutputParameter:
                  outputParameterKey: snapshot
                  producerTask: assemble-examples
          retryPolicy:
            backoffDuration: 30s
            backoffFactor: 2.0
            backoffMaxDuration: 3600s
            maxRetryCount: 2
          taskInfo:
            name: check-examples
        condition-3:
          componentRef:
            name: comp-condition-3
          dependentTasks:
          - assemble-examples
          - fit-on-gpu
          - gate
          - tune-params
          inputs:
            parameters:
              pipelinechannel--assemble-examples-snapshot:
                taskOutputParameter:
                  outputParameterKey: snapshot
                  producerTask: assemble-examples
              pipelinechannel--fit-on-gpu-fit:
                taskOutputParameter:
                  outputParameterKey: fit
                  producerTask: fit-on-gpu
              pipelinechannel--fit-on-gpu-model_uri:
                taskOutputParameter:
                  outputParameterKey: model_uri
                  producerTask: fit-on-gpu
              pipelinechannel--gate-passed:
                taskOutputParameter:
                  outputParameterKey: passed
                  producerTask: gate
              pipelinechannel--gate-report:
                taskOutputParameter:
                  outputParameterKey: report
                  producerTask: gate
              pipelinechannel--plan-windows-run:
                componentInputParameter: pipelinechannel--plan-windows-run
              pipelinechannel--role:
                componentInputParameter: pipelinechannel--role
              pipelinechannel--trigger:
                componentInputParameter: pipelinechannel--trigger
              pipelinechannel--tune-params-experiment:
                taskOutputParameter:
                  outputParameterKey: experiment
                  producerTask: tune-params
              pipelinechannel--tune-params-params:
                taskOutputParameter:
                  outputParameterKey: params
                  producerTask: tune-params
          taskInfo:
            name: passed
          triggerPolicy:
            condition: inputs.parameter_values['pipelinechannel--gate-passed'] ==
              'true'
        fit-on-gpu:
          cachingOptions: {}
          componentRef:
            name: comp-fit-on-gpu
          dependentTasks:
          - assemble-examples
          - tune-params
          inputs:
            parameters:
              params:
                taskOutputParameter:
                  outputParameterKey: params
                  producerTask: tune-params
              run_id:
                runtimeValue:
                  constant: '{{$.pipeline_job_uuid}}'
              snapshot:
                taskOutputParameter:
                  outputParameterKey: snapshot
                  producerTask: assemble-examples
              test:
                componentInputParameter: pipelinechannel--plan-windows-test
              train:
                componentInputParameter: pipelinechannel--plan-windows-train
              validation:
                componentInputParameter: pipelinechannel--plan-windows-validation
          taskInfo:
            name: fit-on-gpu
        for-loop-2:
          componentRef:
            name: comp-for-loop-2
          dependentTasks:
          - plan-examples
          inputs:
            parameters:
              pipelinechannel--plan-examples-chunks:
                taskOutputParameter:
                  outputParameterKey: chunks
                  producerTask: plan-examples
              pipelinechannel--plan-windows-cutoff:
                componentInputParameter: pipelinechannel--plan-windows-cutoff
              pipelinechannel--plan-windows-run:
                componentInputParameter: pipelinechannel--plan-windows-run
          iteratorPolicy:
            parallelismLimit: 4
          parameterIterator:
            itemInput: pipelinechannel--plan-examples-chunks-loop-item
            items:
              inputParameter: pipelinechannel--plan-examples-chunks
          taskInfo:
            name: for-loop-2
        gate:
          cachingOptions: {}
          componentRef:
            name: comp-gate
          dependentTasks:
          - assemble-examples
          - fit-on-gpu
          inputs:
            parameters:
              margin:
                componentInputParameter: pipelinechannel--gate_margin
              model_uri:
                taskOutputParameter:
                  outputParameterKey: model_uri
                  producerTask: fit-on-gpu
              run_id:
                runtimeValue:
                  constant: '{{$.pipeline_job_uuid}}'
              snapshot:
                taskOutputParameter:
                  outputParameterKey: snapshot
                  producerTask: assemble-examples
              test:
                componentInputParameter: pipelinechannel--plan-windows-test
              train:
                componentInputParameter: pipelinechannel--plan-windows-train
              validation:
                componentInputParameter: pipelinechannel--plan-windows-validation
          retryPolicy:
            backoffDuration: 30s
            backoffFactor: 2.0
            backoffMaxDuration: 3600s
            maxRetryCount: 2
          taskInfo:
            name: gate
        plan-examples:
          cachingOptions: {}
          componentRef:
            name: comp-plan-examples
          inputs:
            parameters:
              chunk_days:
                runtimeValue:
                  constant: 4.0
              existing_snapshot:
                componentInputParameter: pipelinechannel--training_set_snapshot
              run_id:
                runtimeValue:
                  constant: '{{$.pipeline_job_uuid}}'
              test:
                componentInputParameter: pipelinechannel--plan-windows-test
              train:
                componentInputParameter: pipelinechannel--plan-windows-train
              validation:
                componentInputParameter: pipelinechannel--plan-windows-validation
          retryPolicy:
            backoffDuration: 30s
            backoffFactor: 2.0
            backoffMaxDuration: 3600s
            maxRetryCount: 2
          taskInfo:
            name: plan-examples
        publish-metrics:
          cachingOptions: {}
          componentRef:
            name: comp-publish-metrics
          dependentTasks:
          - gate
          inputs:
            parameters:
              summary:
                taskOutputParameter:
                  outputParameterKey: summary
                  producerTask: gate
          taskInfo:
            name: publish-metrics
        split-windows:
          cachingOptions: {}
          componentRef:
            name: comp-split-windows
          dependentTasks:
          - assemble-examples
          - check-examples
          inputs:
            parameters:
              run_id:
                runtimeValue:
                  constant: '{{$.pipeline_job_uuid}}'
              snapshot:
                taskOutputParameter:
                  outputParameterKey: snapshot
                  producerTask: assemble-examples
              test:
                componentInputParameter: pipelinechannel--plan-windows-test
              train:
                componentInputParameter: pipelinechannel--plan-windows-train
              validation:
                componentInputParameter: pipelinechannel--plan-windows-validation
          retryPolicy:
            backoffDuration: 30s
            backoffFactor: 2.0
            backoffMaxDuration: 3600s
            maxRetryCount: 2
          taskInfo:
            name: split-windows
        tune-params:
          cachingOptions: {}
          componentRef:
            name: comp-tune-params
          dependentTasks:
          - assemble-examples
          - split-windows
          inputs:
            parameters:
              run_id:
                runtimeValue:
                  constant: '{{$.pipeline_job_uuid}}'
              snapshot:
                taskOutputParameter:
                  outputParameterKey: snapshot
                  producerTask: assemble-examples
              test:
                componentInputParameter: pipelinechannel--plan-windows-test
              train:
                componentInputParameter: pipelinechannel--plan-windows-train
              trials:
                componentInputParameter: pipelinechannel--tune_trials
              validation:
                componentInputParameter: pipelinechannel--plan-windows-validation
          taskInfo:
            name: tune-params
    inputDefinitions:
      parameters:
        pipelinechannel--gate_margin:
          parameterType: NUMBER_DOUBLE
        pipelinechannel--plan-windows-cutoff:
          parameterType: STRING
        pipelinechannel--plan-windows-run:
          parameterType: STRING
        pipelinechannel--plan-windows-test:
          parameterType: STRING
        pipelinechannel--plan-windows-train:
          parameterType: STRING
        pipelinechannel--plan-windows-validation:
          parameterType: STRING
        pipelinechannel--role:
          parameterType: STRING
        pipelinechannel--training_set_snapshot:
          parameterType: STRING
        pipelinechannel--trigger:
          parameterType: STRING
        pipelinechannel--tune_trials:
          parameterType: NUMBER_INTEGER
  comp-condition-3:
    dag:
      tasks:
        record-version:
          cachingOptions: {}
          componentRef:
            name: comp-record-version
          inputs:
            parameters:
              experiment:
                componentInputParameter: pipelinechannel--tune-params-experiment
              fit:
                componentInputParameter: pipelinechannel--fit-on-gpu-fit
              model_uri:
                componentInputParameter: pipelinechannel--fit-on-gpu-model_uri
              params:
                componentInputParameter: pipelinechannel--tune-params-params
              report:
                componentInputParameter: pipelinechannel--gate-report
              run_id:
                runtimeValue:
                  constant: '{{$.pipeline_job_uuid}}'
              snapshot:
                componentInputParameter: pipelinechannel--assemble-examples-snapshot
              trigger:
                componentInputParameter: pipelinechannel--trigger
          taskInfo:
            name: record-version
        roll-out:
          cachingOptions: {}
          componentRef:
            name: comp-roll-out
          dependentTasks:
          - record-version
          inputs:
            parameters:
              role:
                componentInputParameter: pipelinechannel--role
              run_id:
                runtimeValue:
                  constant: '{{$.pipeline_job_uuid}}'
              version:
                taskOutputParameter:
                  outputParameterKey: version
                  producerTask: record-version
          taskInfo:
            name: roll-out
    inputDefinitions:
      parameters:
        pipelinechannel--assemble-examples-snapshot:
          parameterType: STRING
        pipelinechannel--fit-on-gpu-fit:
          parameterType: STRING
        pipelinechannel--fit-on-gpu-model_uri:
          parameterType: STRING
        pipelinechannel--gate-passed:
          parameterType: STRING
        pipelinechannel--gate-report:
          parameterType: STRING
        pipelinechannel--plan-windows-run:
          parameterType: STRING
        pipelinechannel--role:
          parameterType: STRING
        pipelinechannel--trigger:
          parameterType: STRING
        pipelinechannel--tune-params-experiment:
          parameterType: STRING
        pipelinechannel--tune-params-params:
          parameterType: STRING
  comp-fit-on-gpu:
    executorLabel: exec-fit-on-gpu
    inputDefinitions:
      parameters:
        params:
          parameterType: STRING
        run_id:
          parameterType: STRING
        snapshot:
          parameterType: STRING
        test:
          parameterType: STRING
        train:
          parameterType: STRING
        validation:
          parameterType: STRING
    outputDefinitions:
      parameters:
        fit:
          parameterType: STRING
        model_uri:
          parameterType: STRING
  comp-for-loop-2:
    dag:
      tasks:
        stage-examples:
          cachingOptions: {}
          componentRef:
            name: comp-stage-examples
          inputs:
            parameters:
              chunk:
                componentInputParameter: pipelinechannel--plan-examples-chunks-loop-item
              cutoff:
                componentInputParameter: pipelinechannel--plan-windows-cutoff
          retryPolicy:
            backoffDuration: 30s
            backoffFactor: 2.0
            backoffMaxDuration: 3600s
            maxRetryCount: 2
          taskInfo:
            name: stage-examples
    inputDefinitions:
      parameters:
        pipelinechannel--plan-examples-chunks:
          parameterType: LIST
        pipelinechannel--plan-examples-chunks-loop-item:
          parameterType: STRING
        pipelinechannel--plan-windows-cutoff:
          parameterType: STRING
        pipelinechannel--plan-windows-run:
          parameterType: STRING
  comp-gate:
    executorLabel: exec-gate
    inputDefinitions:
      parameters:
        margin:
          parameterType: NUMBER_DOUBLE
        model_uri:
          parameterType: STRING
        run_id:
          parameterType: STRING
        snapshot:
          parameterType: STRING
        test:
          parameterType: STRING
        train:
          parameterType: STRING
        validation:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        pr_curve:
          artifactType:
            schemaTitle: system.HTML
            schemaVersion: 0.0.1
      parameters:
        passed:
          parameterType: STRING
        report:
          parameterType: STRING
        summary:
          parameterType: STRING
  comp-plan-examples:
    executorLabel: exec-plan-examples
    inputDefinitions:
      parameters:
        chunk_days:
          parameterType: NUMBER_INTEGER
        existing_snapshot:
          parameterType: STRING
        run_id:
          parameterType: STRING
        test:
          parameterType: STRING
        train:
          parameterType: STRING
        validation:
          parameterType: STRING
    outputDefinitions:
      parameters:
        chunks:
          parameterType: LIST
  comp-plan-windows:
    executorLabel: exec-plan-windows
    inputDefinitions:
      parameters:
        create_time:
          parameterType: STRING
        fixed_cutoff:
          parameterType: STRING
        fixed_test:
          parameterType: STRING
        fixed_train:
          parameterType: STRING
        fixed_validation:
          parameterType: STRING
        force:
          parameterType: BOOLEAN
        lag_days:
          parameterType: NUMBER_INTEGER
        run_id:
          parameterType: STRING
        test_days:
          parameterType: NUMBER_INTEGER
        train_days:
          parameterType: NUMBER_INTEGER
        validation_days:
          parameterType: NUMBER_INTEGER
    outputDefinitions:
      parameters:
        cutoff:
          parameterType: STRING
        run:
          parameterType: STRING
        test:
          parameterType: STRING
        train:
          parameterType: STRING
        validation:
          parameterType: STRING
  comp-publish-metrics:
    executorLabel: exec-publish-metrics
    inputDefinitions:
      parameters:
        summary:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
  comp-record-version:
    executorLabel: exec-record-version
    inputDefinitions:
      parameters:
        experiment:
          parameterType: STRING
        fit:
          parameterType: STRING
        model_uri:
          parameterType: STRING
        params:
          parameterType: STRING
        report:
          parameterType: STRING
        run_id:
          parameterType: STRING
        snapshot:
          parameterType: STRING
        trigger:
          parameterType: STRING
    outputDefinitions:
      parameters:
        version:
          parameterType: STRING
  comp-roll-out:
    executorLabel: exec-roll-out
    inputDefinitions:
      parameters:
        role:
          parameterType: STRING
        run_id:
          parameterType: STRING
        version:
          parameterType: STRING
    outputDefinitions:
      parameters:
        deployed:
          parameterType: STRING
  comp-split-windows:
    executorLabel: exec-split-windows
    inputDefinitions:
      parameters:
        run_id:
          parameterType: STRING
        snapshot:
          parameterType: STRING
        test:
          parameterType: STRING
        train:
          parameterType: STRING
        validation:
          parameterType: STRING
    outputDefinitions:
      parameters:
        report:
          parameterType: STRING
  comp-stage-examples:
    executorLabel: exec-stage-examples
    inputDefinitions:
      parameters:
        chunk:
          parameterType: STRING
        cutoff:
          parameterType: STRING
    outputDefinitions:
      parameters:
        rows:
          parameterType: STRING
  comp-tune-params:
    executorLabel: exec-tune-params
    inputDefinitions:
      parameters:
        run_id:
          parameterType: STRING
        snapshot:
          parameterType: STRING
        test:
          parameterType: STRING
        train:
          parameterType: STRING
        trials:
          parameterType: NUMBER_INTEGER
        validation:
          parameterType: STRING
    outputDefinitions:
      parameters:
        experiment:
          parameterType: STRING
        params:
          parameterType: STRING
deploymentSpec:
  executors:
    exec-assemble-examples:
      container:
        args:
        - assemble_examples
        - --run-id
        - '{{$.inputs.parameters[''run_id'']}}'
        - --train
        - '{{$.inputs.parameters[''train'']}}'
        - --validation
        - '{{$.inputs.parameters[''validation'']}}'
        - --test
        - '{{$.inputs.parameters[''test'']}}'
        - --cutoff
        - '{{$.inputs.parameters[''cutoff'']}}'
        - --existing-snapshot
        - '{{$.inputs.parameters[''existing_snapshot'']}}'
        - --out
        - snapshot
        - '{{$.outputs.parameters[''snapshot''].output_file}}'
        command:
        - python
        - -m
        - risk_model.steps
        env:
        - name: SPARK_MASTER
          value: local[3]
        - name: PYSPARK_SUBMIT_ARGS
          value: --driver-memory 6g pyspark-shell
        - name: SPARK_LOCAL_DIR
          value: /tmp/spark
        image: ghcr.io/phuchoang2603/payment-gateway-fraud-detection/ml:chart
        resources:
          cpuRequest: 3.0
          memoryLimit: 10.0
          memoryRequest: 10.0
          resourceCpuRequest: '3'
          resourceMemoryLimit: 10G
          resourceMemoryRequest: 10G
    exec-check-examples:
      container:
        args:
        - check_examples
        - --run-id
        - '{{$.inputs.parameters[''run_id'']}}'
        - --snapshot
        - '{{$.inputs.parameters[''snapshot'']}}'
        - --out
        - report
        - '{{$.outputs.parameters[''report''].output_file}}'
        command:
        - python
        - -m
        - risk_model.steps
        image: ghcr.io/phuchoang2603/payment-gateway-fraud-detection/ml:chart
        resources:
          cpuRequest: 1.0
          memoryLimit: 12.0
          memoryRequest: 12.0
          resourceCpuRequest: '1'
          resourceMemoryLimit: 12G
          resourceMemoryRequest: 12G
    exec-fit-on-gpu:
      container:
        args:
        - fit_on_gpu
        - --run-id
        - '{{$.inputs.parameters[''run_id'']}}'
        - --snapshot
        - '{{$.inputs.parameters[''snapshot'']}}'
        - --train
        - '{{$.inputs.parameters[''train'']}}'
        - --validation
        - '{{$.inputs.parameters[''validation'']}}'
        - --test
        - '{{$.inputs.parameters[''test'']}}'
        - --params
        - '{{$.inputs.parameters[''params'']}}'
        - --out
        - model_uri
        - '{{$.outputs.parameters[''model_uri''].output_file}}'
        - --out
        - fit
        - '{{$.outputs.parameters[''fit''].output_file}}'
        command:
        - python
        - -m
        - risk_model.steps
        image: ghcr.io/phuchoang2603/payment-gateway-fraud-detection/ml:chart
        resources:
          cpuRequest: 0.25
          memoryLimit: 1.0
          memoryRequest: 1.0
          resourceCpuRequest: 250m
          resourceMemoryLimit: 1G
          resourceMemoryRequest: 1G
    exec-gate:
      container:
        args:
        - gate
        - --run-id
        - '{{$.inputs.parameters[''run_id'']}}'
        - --snapshot
        - '{{$.inputs.parameters[''snapshot'']}}'
        - --train
        - '{{$.inputs.parameters[''train'']}}'
        - --validation
        - '{{$.inputs.parameters[''validation'']}}'
        - --test
        - '{{$.inputs.parameters[''test'']}}'
        - --model-uri
        - '{{$.inputs.parameters[''model_uri'']}}'
        - --margin
        - '{{$.inputs.parameters[''margin'']}}'
        - --out
        - passed
        - '{{$.outputs.parameters[''passed''].output_file}}'
        - --out
        - report
        - '{{$.outputs.parameters[''report''].output_file}}'
        - --out
        - summary
        - '{{$.outputs.parameters[''summary''].output_file}}'
        - --out
        - pr_curve
        - '{{$.outputs.artifacts[''pr_curve''].path}}'
        command:
        - python
        - -m
        - risk_model.steps
        image: ghcr.io/phuchoang2603/payment-gateway-fraud-detection/ml:chart
        resources:
          cpuRequest: 1.0
          memoryLimit: 12.0
          memoryRequest: 12.0
          resourceCpuRequest: '1'
          resourceMemoryLimit: 12G
          resourceMemoryRequest: 12G
    exec-plan-examples:
      container:
        args:
        - plan_examples
        - --run-id
        - '{{$.inputs.parameters[''run_id'']}}'
        - --train
        - '{{$.inputs.parameters[''train'']}}'
        - --validation
        - '{{$.inputs.parameters[''validation'']}}'
        - --test
        - '{{$.inputs.parameters[''test'']}}'
        - --existing-snapshot
        - '{{$.inputs.parameters[''existing_snapshot'']}}'
        - --chunk-days
        - '{{$.inputs.parameters[''chunk_days'']}}'
        - --out
        - chunks
        - '{{$.outputs.parameters[''chunks''].output_file}}'
        command:
        - python
        - -m
        - risk_model.steps
        env:
        - name: SPARK_MASTER
          value: local[3]
        - name: PYSPARK_SUBMIT_ARGS
          value: --driver-memory 4g pyspark-shell
        - name: SPARK_LOCAL_DIR
          value: /tmp/spark
        image: ghcr.io/phuchoang2603/payment-gateway-fraud-detection/ml:chart
        resources:
          cpuRequest: 3.0
          memoryLimit: 8.0
          memoryRequest: 8.0
          resourceCpuRequest: '3'
          resourceMemoryLimit: 8G
          resourceMemoryRequest: 8G
    exec-plan-windows:
      container:
        args:
        - plan_windows
        - --run-id
        - '{{$.inputs.parameters[''run_id'']}}'
        - --create-time
        - '{{$.inputs.parameters[''create_time'']}}'
        - --train-days
        - '{{$.inputs.parameters[''train_days'']}}'
        - --validation-days
        - '{{$.inputs.parameters[''validation_days'']}}'
        - --test-days
        - '{{$.inputs.parameters[''test_days'']}}'
        - --lag-days
        - '{{$.inputs.parameters[''lag_days'']}}'
        - --force
        - '{{$.inputs.parameters[''force'']}}'
        - --fixed-train
        - '{{$.inputs.parameters[''fixed_train'']}}'
        - --fixed-validation
        - '{{$.inputs.parameters[''fixed_validation'']}}'
        - --fixed-test
        - '{{$.inputs.parameters[''fixed_test'']}}'
        - --fixed-cutoff
        - '{{$.inputs.parameters[''fixed_cutoff'']}}'
        - --out
        - train
        - '{{$.outputs.parameters[''train''].output_file}}'
        - --out
        - validation
        - '{{$.outputs.parameters[''validation''].output_file}}'
        - --out
        - test
        - '{{$.outputs.parameters[''test''].output_file}}'
        - --out
        - cutoff
        - '{{$.outputs.parameters[''cutoff''].output_file}}'
        - --out
        - run
        - '{{$.outputs.parameters[''run''].output_file}}'
        command:
        - python
        - -m
        - risk_model.steps
        image: ghcr.io/phuchoang2603/payment-gateway-fraud-detection/ml:chart
        resources:
          cpuRequest: 1.0
          memoryLimit: 12.0
          memoryRequest: 12.0
          resourceCpuRequest: '1'
          resourceMemoryLimit: 12G
          resourceMemoryRequest: 12G
    exec-publish-metrics:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - publish_metrics
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.18.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
