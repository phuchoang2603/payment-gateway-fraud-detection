          \    \"\"\"Logs the gate's metrics for the model, the baseline and production\
          \ as KFP metrics.\"\"\"\n    import json\n\n    data = json.loads(summary)\n\
          \    for prefix, name in ((\"test\", \"model\"), (\"baseline\", \"baseline\"\
          ), (\"production\", \"production\")):\n        for metric, value in data[\"\
          metrics\"].get(name, {}).items():\n            metrics.log_metric(f\"{prefix}_{metric}\"\
          , value)\n    metrics.log_metric(\"gate_passed\", 1 if data[\"passed\"]\
          \ else 0)\n\n"
        image: python:3.12-slim
        resources:
          cpuRequest: 0.25
          memoryLimit: 1.0
