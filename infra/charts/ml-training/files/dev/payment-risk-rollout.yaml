# PIPELINE DEFINITION
# Name: payment-risk-rollout
# Description: Serve a registered payment-risk version that passed its gate, or return to an earlier one.
# Inputs:
#    role: str [Default: 'champion']
#    version: str
components:
  comp-roll-out:
    executorLabel: exec-roll-out
    inputDefinitions:
      parameters:
        role:
          parameterType: STRING
        run_id:
          parameterType: STRING
        version:
          parameterType: STRING
    outputDefinitions:
      parameters:
        deployed:
          parameterType: STRING
deploymentSpec:
  executors:
    exec-roll-out:
      container:
        args:
        - roll_out
        - --run-id
        - '{{$.inputs.parameters[''run_id'']}}'
        - --version
        - '{{$.inputs.parameters[''version'']}}'
        - --role
        - '{{$.inputs.parameters[''role'']}}'
        - --out
        - deployed
        - '{{$.outputs.parameters[''deployed''].output_file}}'
        command:
        - python
        - -m
        - risk_model.steps
        image: ghcr.io/phuchoang2603/payment-gateway-fraud-detection/ml:chart
        resources:
          cpuRequest: 0.25
          memoryLimit: 1.0
          memoryRequest: 1.0
          resourceCpuRequest: 250m
          resourceMemoryLimit: 1G
          resourceMemoryRequest: 1G
pipelineInfo:
  description: Serve a registered payment-risk version that passed its gate, or return
    to an earlier one.
  name: payment-risk-rollout
root:
  dag:
    tasks:
      roll-out:
        cachingOptions: {}
        componentRef:
          name: comp-roll-out
        inputs:
          parameters:
            role:
              componentInputParameter: role
            run_id:
              runtimeValue:
                constant: '{{$.pipeline_job_uuid}}'
            version:
              componentInputParameter: version
        taskInfo:
          name: roll-out
  inputDefinitions:
    parameters:
      role:
        defaultValue: champion
        isOptional: true
        parameterType: STRING
      version:
        parameterType: STRING
schemaVersion: 2.1.0
sdkVersion: kfp-2.18.0
---
platforms:
  kubernetes:
    deploymentSpec:
      executors:
        exec-roll-out:
          configMapAsEnv:
          - configMapName: ml-training-config
            configMapNameParameter:
              runtimeValue:
                constant: ml-training-config
            keyToEnv:
            - configMapKey: AWS_REGION
              envVar: AWS_REGION
            - configMapKey: S3_ENDPOINT
              envVar: S3_ENDPOINT
            - configMapKey: S3_PATH_STYLE
              envVar: S3_PATH_STYLE
            - configMapKey: ICEBERG_REST_URI
              envVar: ICEBERG_REST_URI
            - configMapKey: ICEBERG_WAREHOUSE
              envVar: ICEBERG_WAREHOUSE
            - configMapKey: ICEBERG_CLIENT_ID
              envVar: ICEBERG_CLIENT_ID
            - configMapKey: ICEBERG_OAUTH2_URI
              envVar: ICEBERG_OAUTH2_URI
            - configMapKey: FEAST_REGISTRY
              envVar: FEAST_REGISTRY
            - configMapKey: FEAST_STREAM_EPOCHS
              envVar: FEAST_STREAM_EPOCHS
            - configMapKey: FEAST_S3_ENDPOINT_URL
              envVar: FEAST_S3_ENDPOINT_URL
            - configMapKey: MODEL_REGISTRY_URL
              envVar: MODEL_REGISTRY_URL
            - configMapKey: RUN_ROOT
              envVar: RUN_ROOT
            - configMapKey: ML_IMAGE
              envVar: ML_IMAGE
            - configMapKey: ML_NAMESPACE
              envVar: ML_NAMESPACE
            - configMapKey: SERVING_PREDICTOR
              envVar: SERVING_PREDICTOR
            - configMapKey: SERVING_WAYPOINT
              envVar: SERVING_WAYPOINT
            - configMapKey: EXPERIMENT_ROUTE
              envVar: EXPERIMENT_ROUTE
            - configMapKey: EXPERIMENT_MAX_PERCENT
              envVar: EXPERIMENT_MAX_PERCENT
            - configMapKey: EXPERIMENT_STEPS
              envVar: EXPERIMENT_STEPS
            - configMapKey: EXPERIMENT_WINDOW
              envVar: EXPERIMENT_WINDOW
            optional: false
          nodeAffinity:
          - matchExpressions:
            - key: nvidia.com/gpu.present
              operator: DoesNotExist
