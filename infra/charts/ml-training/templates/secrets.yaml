{{- if .Values.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ml-training-storage
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.storage.store }}
  target:
    name: ml-training-storage
    template:
      metadata:
        annotations:
          serving.kserve.io/s3-endpoint: {{ .Values.config.S3_ENDPOINT | trimPrefix "https://" | trimPrefix "http://" | quote }}
          serving.kserve.io/s3-region: {{ .Values.config.AWS_REGION | quote }}
          serving.kserve.io/s3-usehttps: {{ ternary "1" "0" (hasPrefix "https://" .Values.config.S3_ENDPOINT) | quote }}
          serving.kserve.io/s3-usevirtualbucket: "false"
  data:
    {{- range $local, $remote := .Values.storage.data }}
    - secretKey: {{ $local }}
      remoteRef:
        key: {{ $remote }}
    {{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ml-training-iceberg
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.iceberg.store }}
  target:
    name: ml-training-iceberg
  data:
    {{- range $local, $remote := .Values.iceberg.data }}
    - secretKey: {{ $local }}
      remoteRef:
        key: {{ $remote }}
    {{- end }}
{{- end }}
