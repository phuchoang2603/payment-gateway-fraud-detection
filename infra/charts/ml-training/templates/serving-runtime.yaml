{{- if .Values.enabled }}
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: payment-risk-triton
  namespace: {{ .Values.namespace }}
spec:
  supportedModelFormats:
    - name: payment-risk
      autoSelect: true
  protocolVersions: [v2]
  resourceClaims:
    - name: gpu
      resourceClaimName: {{ .Values.gpu.claim }}
  containers:
    - name: kserve-container
      image: {{ .Values.triton.image | quote }}
      args:
        - tritonserver
        - --model-store=/mnt/models
        - --model-control-mode=none
        - --strict-readiness=true
        - --http-port=8080
        - --allow-grpc=false
        - --allow-metrics=true
        - --allow-gpu-metrics=false
        - --metrics-port=8002
      env:
        - name: HOME
          value: /tmp
      ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 8002
          name: metrics
          protocol: TCP
      readinessProbe:
        httpGet:
          path: /v2/health/ready
          port: 8080
        periodSeconds: 5
      resources:
        claims:
          - name: gpu
        {{- toYaml .Values.serving.resources | nindent 8 }}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
{{- end }}
