{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: ml-training-config
  namespace: {{ .Values.namespace }}
data:
  {{- range $name, $value := .Values.config }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
  FEAST_S3_ENDPOINT_URL: {{ .Values.config.S3_ENDPOINT | quote }}
  ML_IMAGE: {{ include "ml-training.image" . | quote }}
  ML_NAMESPACE: {{ .Values.namespace | quote }}
  SERVING_PREDICTOR: {{ .Values.serving.predictor | toJson | quote }}
  {{- if .Values.experiment.enabled }}
  SERVING_WAYPOINT: {{ .Values.experiment.waypoint | quote }}
  EXPERIMENT_ROUTE: {{ .Values.experiment.route | quote }}
  EXPERIMENT_MAX_PERCENT: {{ .Values.experiment.maxPercent | quote }}
  EXPERIMENT_STEPS: {{ .Values.experiment.steps | quote }}
  EXPERIMENT_WINDOW: {{ .Values.experiment.analysis.window | quote }}
  {{- end }}
{{- end }}
