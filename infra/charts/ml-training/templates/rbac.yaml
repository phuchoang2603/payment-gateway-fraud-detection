{{- if .Values.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fraud-training
  namespace: {{ .Values.namespace }}
secrets:
  - name: ml-training-storage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fraud-training
  namespace: {{ .Values.namespace }}
rules:
  - apiGroups: [argoproj.io]
    resources: [workflowtaskresults]
    verbs: [create, patch]
  - apiGroups: [trainer.kubeflow.org]
    resources: [trainjobs, trainingruntimes]
    verbs: [create, get, list, watch, delete]
  - apiGroups: [kubeflow.org]
    resources: [experiments]
    verbs: [create, get, list, watch, delete]
  - apiGroups: [kubeflow.org]
    resources: [trials]
    verbs: [get, list, watch]
  - apiGroups: [serving.kserve.io]
    resources: [inferenceservices]
    verbs: [create, get, list, watch, patch]
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [mlpipeline-minio-artifact, ml-training-storage, ml-training-iceberg]
    verbs: [get]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [kfp-launcher, kubeflow-trainer-public]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fraud-training
  namespace: {{ .Values.namespace }}
subjects:
  - kind: ServiceAccount
    name: fraud-training
    namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fraud-training
{{- end }}
