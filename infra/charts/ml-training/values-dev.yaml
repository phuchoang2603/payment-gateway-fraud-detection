global:
  imageTags:
    ghcr.io/phuchoang2603/payment-gateway-fraud-detection/ml: dev
    ghcr.io/phuchoang2603/payment-gateway-fraud-detection/drift: dev
environment: dev
notebook:
  enabled: false
  storageClass: local-path
drift:
  policy:
    samples: 200
serving:
  resources:
    requests: {cpu: 100m}
    limits: {memory: 512Mi}
experiment:
  enabled: true
  analysis:
    window: 5m
    interval: 1m
    minimumRequests: 50
