global:
  imageTags:
    ghcr.io/phuchoang2603/payment-gateway-fraud-detection/ml: dev
    ghcr.io/phuchoang2603/payment-gateway-fraud-detection/drift: dev
environment: dev
notebook:
  storageClass: local-path
drift:
  # Dev traffic is small.
  policy:
    samples: 200
serving:
  resources:
    requests: {cpu: 100m, memory: 1Gi}
experiment:
  enabled: true
  analysis:
    window: 5m
    interval: 1m
    minimumRequests: 50
