apiVersion: batch/v1
kind: Job
metadata:
  name: features-loadtest
  namespace: llm
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: llm-benchmark
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: locust
          image: locustio/locust:2.46.7
          command: [sh, -c]
          args:
            - |
              locust -f /loadtest/locustfile.py --headless --host http://risk-serving.llm.svc.cluster.local:8080 \
                --html /tmp/report.html --only-summary
              echo ===LOCUST-HTML===; cat /tmp/report.html; echo; echo ===END===
          env:
            - {name: HOME, value: /tmp}
            - {name: LOCUST_USERS, value: "20"}
            - {name: LOCUST_SPAWN_RATE, value: "5"}
            - {name: LOCUST_RUN_TIME, value: 5m}
            - {name: INTEGRATION_ID, valueFrom: {configMapKeyRef: {name: features-loadtest, key: integration-id}}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 250m}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: loadtest, mountPath: /loadtest}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: loadtest
          configMap:
            name: features-loadtest
        - name: tmp
          emptyDir: {}
