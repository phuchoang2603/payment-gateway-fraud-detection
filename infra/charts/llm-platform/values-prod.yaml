storageClass: cloud-block

models:
  chat:
    resources:
      requests: {cpu: 1500m}
      limits: {memory: 10Gi}
  embedding:
    resources:
      requests: {cpu: 500m}
      limits: {memory: 4Gi}
  decision:
    resources:
      requests: {cpu: 250m}
      limits: {memory: 6Gi}

agents:
  snapshotRoot: s3://talos-proxmox-prod-platform/substrate/llm-agents/

langfuseStores:
  postgres:
    size: 2Gi
    nodeSelector:
      talos.dev/capacity-type: on-demand
  hostname: langfuse.phuchoang.sbs

langfuse:
  langfuse:
    nextauth:
      url: https://langfuse.phuchoang.sbs
  s3:
    bucket: talos-proxmox-prod-platform
    endpoint: https://storage.googleapis.com
    region: auto
    forcePathStyle: true
