
models:
  chat:
    # The dev card is 15.48 GiB, and with the other two servers resident (CUDA contexts included) 11.6 GiB are free
    # when the chat server starts, less than the 0.76 of the base values (11.76 GiB).
    gpuMemoryUtilization: "0.72"
    schedulerResources:
      requests: {cpu: 250m, memory: 128Mi}
      limits: {memory: 512Mi}

risk:
  enabled: true
  rollout:
    enabled: true
    arguments:
      request:
        integration_id: 01234567-89ab-4cde-8fab-0123456789ab
        customer_id: 6eb05dd4-dd3f-5e6f-aef4-be504df23385
        payment_method_fingerprint: 42de8f3717603a3ce116b581552dad900d1b211490ce40e04faaf5e75b815fd2
        amount_minor: 12000
        customer_account_created_at: "2025-01-01T00:00:00Z"
        merchant_account_created_at: "2024-01-01T00:00:00Z"
        shipping_country: US
        ip_country: US
        item_count: 2
        has_device: true

gateway:
  mcpServers:
    risk:
      service: risk-serving
      port: 8080
      path: /mcp
      version: 0.1.0
      title: Payment risk scoring
      description: Read-only online features and what-if scoring with the served fraud model; drivers are not attributions.

agents:
  list:
    - name: evidence-agent
      version: 0.3.0
      title: Evidence agent
      description: Read-only fraud-analyst agent that explains declines, risk decisions and payment behaviour from the knowledge base, citing its passages.
      mcpServers: [knowledge]
      abTest:
        label: variant-b
        share: 0.5
        addendum: Answer in at most five sentences, then list the passages you cited.
    - name: risk-agent
      version: 0.2.0
      mcpServers: [risk]
      title: Risk agent
      description: Read-only agent that assesses the fraud risk of one payment, card or customer from its online features and the fraud model's score, and explains what drives it.
      abTest:
        label: variant-b
        share: 0.5
        addendum: Start with the returned probability and model version, then give up to three drivers with the attribution caveat; if scoring failed, report the error without a risk level.
    - name: coordinator
      version: 0.2.0
      title: Coordinator
      description: Read-only entry agent for fraud analysts that hands each question to the evidence or risk agent.
      entry: true
      agents: [evidence-agent, risk-agent]
      abTest:
        label: variant-b
        share: 0.5
        addendum: Before you transfer, tell the analyst in one sentence which specialist will answer and why.
