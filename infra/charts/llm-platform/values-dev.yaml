models:
  candidate:
    enabled: true
  chat:
    gpuMemoryUtilization: "0.36"
    args:
      - --language-model-only
      - --max-model-len=32768
      - --kv-cache-dtype=fp8
      - --max-num-seqs=8
      - --reasoning-parser=qwen3
      - --default-chat-template-kwargs={"enable_thinking":false}
      - --enable-auto-tool-choice
      - --tool-call-parser=qwen3_coder
    resources:
      requests: {cpu: 500m}
    schedulerResources:
      requests: {cpu: 250m, memory: 128Mi}
      limits: {memory: 512Mi}
risk:
  rollout:
    tool: get_risk_features
