{{- $gateway := .Values.gateway }}
{{- $agents := .Values.agents }}
{{- $controller := $agents.a2a.controller }}
{{- $routes := list }}
{{- range $agent := $agents.list }}
{{- $arms := list (dict "name" $agent.name "weight" (sub 100 (($agent.abTest).weight | default 0))) }}
{{- with $agent.abTest }}
{{- $arms = append $arms (dict "name" .variant "weight" .weight) }}
{{- end }}
{{- range $arm := $arms }}
---
# kagent serves every sandboxed agent's A2A endpoint from its controller. As an A2A backend the gateway rewrites
# the agent card's URLs to the address the caller used.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: a2a-{{ $arm.name }}
spec:
  a2a:
    host: {{ $controller.host }}
    port: {{ $controller.port }}
{{- end }}
---
# /a2a/<agent> for callers outside kagent; kagent's own sandbox path for sub-agent calls that its proxy URL sends
# here through the egress proxy.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: a2a-{{ $agent.name }}
spec:
  parentRefs:
    - name: {{ $gateway.name }}
      sectionName: http
  # A prefix rewrite needs exactly one path match per rule, so each path is its own rule.
  rules:
    {{- range $path := list (printf "/a2a/%s" $agent.name) (printf "/api/a2a-sandboxes/%s/%s" $agents.namespace $agent.name) }}
    - matches:
        - path: {type: PathPrefix, value: {{ $path }}}
      backendRefs:
        {{- range $arm := $arms }}
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: a2a-{{ $arm.name }}
          weight: {{ $arm.weight }}
          filters:
            - type: URLRewrite
              urlRewrite:
                path:
                  type: ReplacePrefixMatch
                  replacePrefixMatch: /api/a2a-sandboxes/{{ $agents.namespace }}/{{ $arm.name }}
        {{- end }}
      timeouts:
        request: 600s
    {{- end }}
{{- $routes = append $routes (printf "a2a-%s" $agent.name) }}
{{- end }}
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: a2a
spec:
  targetRefs:
    {{- range $route := $routes }}
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ $route }}
    {{- end }}
  traffic:
    apiKeyAuthentication:
      mode: Strict
      secretSelector:
        matchLabels:
          {{ $gateway.keyLabel }}: "true"
    rateLimit:
      local:
        - requests: {{ $gateway.limits.requestsPerMinute }}
          burst: {{ $gateway.limits.burst }}
          unit: Minutes
          key: apiKey.client
