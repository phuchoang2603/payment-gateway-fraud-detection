{{- $decision := .Values.decision }}
{{- $image := printf "%s:%s" $decision.image (required (printf "image tag missing for %s" $decision.image) (index .Values.global.imageTags $decision.image)) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $decision.name }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $decision.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $decision.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $decision.name }}
    spec:
      serviceAccountName: {{ $decision.name }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "llm-platform.podSecurity" (dict "uid" $decision.uid) | nindent 8 }}
      containers:
        - name: decision
          image: {{ $image | quote }}
          ports:
            - {name: http, containerPort: 8080}
          env:
            - name: DECISION_MODEL_URL
              value: {{ printf "http://%s-kserve-workload-svc.%s.svc:8000" .Values.models.decision.name .Release.Namespace }}
            - name: SCREEN_THRESHOLD
              value: {{ $decision.screenThreshold | quote }}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          securityContext:
            {{- include "llm-platform.containerSecurity" . | nindent 12 }}
            readOnlyRootFilesystem: true
          resources:
            {{- toYaml $decision.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $decision.name }}
spec:
  selector:
    app.kubernetes.io/name: {{ $decision.name }}
  ports:
    - {name: http, port: 8080, targetPort: http, appProtocol: http}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ $decision.name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $decision.name }}
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - {{ include "llm-platform.principal" (dict "namespace" .Release.Namespace "name" .Values.gateway.name) | quote }}
              - {{ .Values.metricsAgent | quote }}
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: {{ $decision.name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $decision.name }}
  podMetricsEndpoints:
    - port: http
      path: /metrics/
