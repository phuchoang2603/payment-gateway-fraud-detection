# Picked up by the platform Grafana's dashboard sidecar.
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-agents-dashboard
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: {{ .Values.dashboards.folder | quote }}
data:
  llm-agents.json: |
    {{- .Files.Get "files/dashboards/llm-agents.json" | nindent 4 }}
