{{- $gateway := .Values.gateway }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-gateway-keys
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.secretStore }}
  target:
    name: llm-gateway-keys
    template:
      metadata:
        labels:
          {{ $gateway.keyLabel }}: "true"
      data:
        {{- range $client, $remote := $gateway.clients }}
        {{ $client }}: {{ printf "{\"key\":\"{{ .%s }}\",\"metadata\":{\"client\":\"%s\"}}" $client $client | squote }}
        {{- end }}
  data:
    {{- range $client, $remote := $gateway.clients }}
    - secretKey: {{ $client }}
      remoteRef:
        key: {{ $remote }}
    {{- end }}
{{- range $client, $remote := $gateway.clients }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-gateway-{{ $client }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $.Values.secretStore }}
  target:
    name: llm-gateway-{{ $client }}
  data:
    - secretKey: key
      remoteRef:
        key: {{ $remote }}
{{- end }}
