{{- $server := .Values.risk }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: risk-serving-analysis
automountServiceAccountToken: false
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: risk-serving-preview
spec:
  metrics:
    - name: mcp-preview
      count: 1
      failureLimit: 0
      consecutiveErrorLimit: 1
      provider:
        job:
          spec:
            activeDeadlineSeconds: 300
            backoffLimit: 0
            ttlSecondsAfterFinished: 86400
            template:
              spec:
                serviceAccountName: risk-serving-analysis
                automountServiceAccountToken: false
                restartPolicy: Never
                securityContext:
                  {{- include "llm-platform.podSecurity" (dict "uid" 65532) | nindent 18 }}
                containers:
                  - name: mcp-check
                    image: {{ printf "%s:%s" $server.image (index .Values.global.imageTags $server.image) | quote }}
                    command: [python, /app/mcp_analysis.py]
                    env:
                      - name: MCP_URL
                        value: http://risk-serving-preview.{{ .Release.Namespace }}.svc.cluster.local:{{ $server.port }}/mcp
                      - name: MCP_TOOL
                        value: score_payment_risk
                      - name: MCP_ARGUMENTS
                        value: {{ toJson $server.rollout.arguments | quote }}
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities: {drop: [ALL]}
                    resources:
                      requests: {cpu: 10m, memory: 64Mi}
                      limits: {memory: 128Mi}
