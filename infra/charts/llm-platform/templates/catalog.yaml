{{- $catalog_ := .Values.catalog }}
{{- $registry := $catalog_.registry }}
{{- $allAgents := list }}
{{- $ports := dict }}
{{- $defaultAudience := "" }}
{{- range $entry := .Values.agents.entryAgents }}
{{- if eq (include "llm-platform.humanInput" $entry) "true" }}
{{- $defaultAudience = $defaultAudience | default $entry.audience }}
{{- $_ := set $ports $entry.audience $entry.port }}
{{- end }}
{{- $allAgents = append $allAgents (merge (dict "entry" true) (deepCopy $entry)) }}
{{- end }}
{{- range $name, $specialist := .Values.agents.specialists }}
{{- $allAgents = append $allAgents (merge (dict "name" $name) (deepCopy $specialist)) }}
{{- end }}
{{- $catalog := list }}
{{- range $name, $server := .Values.gateway.mcpServers }}
{{- $entry := dict
  "apiVersion" "ar.dev/v1alpha1"
  "kind" "MCPServer"
  "metadata" (dict "name" $name "tag" $server.version)
  "spec" (dict
    "title" $server.title
    "description" (printf "%s Served through the permitted entry agent listener with native caller-token propagation." $server.description)
    "remote" (dict "type" "streamable-http" "url" (printf "http://%s.%s.svc.cluster.local:%v/mcp/%s" $.Values.gateway.name $.Release.Namespace (index $ports ($server.audience | default $defaultAudience)) $name))) }}
{{- $catalog = append $catalog (toYaml $entry) }}
{{- end }}
{{- range $agent := $allAgents }}
{{- $notes := list (printf "%s through the agent gateway; each agent's system prompt and A/B test in Langfuse as <agent>-system-prompt." $.Values.models.chat.name) }}
{{- if not $agent.entry }}
{{- $notes = append $notes "Compiled as a local specialist inside the entry agents that name it; it is not deployed independently." }}
{{- end }}
{{- $servers := $agent.mcpServers | default list }}
{{- if $agent.entry }}
{{- $servers = include "llm-platform.agentServers" (dict "root" $ "agent" $agent) | fromJsonArray }}
{{- end }}
{{- with $agent.agents }}
{{- $notes = append $notes (printf "Hands questions to its sub-agents %s, which run inside it." (join ", " .)) }}
{{- end }}
{{- $entry := dict
  "apiVersion" "ar.dev/v1alpha1"
  "kind" "Agent"
  "metadata" (dict "name" ($agent.name | replace "-" "") "tag" $agent.version)
  "spec" (dict
    "title" $agent.title
    "description" (printf "%s %s" $agent.description (join " " $notes))
    "source" (dict
      "repository" (dict "url" $registry.repository "subfolder" "infra/charts/llm-platform")
      "protocol" "A2A")) }}
{{- with $agent.remoteSkills }}
{{- range $name, $skill := . }}
{{- $_ := set $entry.spec "description" (printf "%s Calls remote skill %s, served by %s through the gateway's internal A2A route." $entry.spec.description $name $skill.agent) }}
{{- end }}
{{- end }}
{{- with uniq $servers }}
{{- $refs := list }}
{{- range $server := . }}
{{- $refs = append $refs (dict "kind" "MCPServer" "name" $server "tag" (index $.Values.gateway.mcpServers $server).version) }}
{{- end }}
{{- $_ := set $entry.spec "mcpServers" $refs }}
{{- end }}
{{- $catalog = append $catalog (toYaml $entry) }}
{{- end }}
{{- $agentList := list }}
{{- range $agent := $allAgents }}
{{- $agentList = append $agentList (pick $agent "name" "version" "abTest") }}
{{- end }}
{{- $data := dict
  "registry.yaml" (join "\n---\n" $catalog)
  "agents.json" (toJson $agentList)
  "publish.py" (.Files.Get "files/catalog.py") }}
{{- range $agent := $allAgents }}
{{- $_ := set $data (printf "prompt-%s.md" $agent.name) ($.Files.Get (printf "files/prompts/%s.md" $agent.name)) }}
{{- end }}
{{- $hash := $data | toJson | sha256sum | trunc 10 }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-catalog
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-catalog-{{ $hash }}
data:
  {{- range $key, $value := $data }}
  {{ $key }}: |
    {{- $value | nindent 4 }}
  {{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: llm-catalog-{{ $hash }}
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: llm-catalog
      automountServiceAccountToken: false
      securityContext:
        {{- include "llm-platform.podSecurity" (dict "uid" 65532) | nindent 8 }}
      containers:
        - name: publish
          image: {{ $catalog_.image }}
          command: [python, /etc/catalog/publish.py]
          env:
            - name: REGISTRY_URL
              value: {{ $registry.url }}
            - name: LANGFUSE_URL
              value: http://langfuse-web.{{ .Release.Namespace }}.svc.cluster.local:3000
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom: {secretKeyRef: {name: langfuse, key: init-public-key}}
            - name: LANGFUSE_SECRET_KEY
              valueFrom: {secretKeyRef: {name: langfuse, key: init-secret-key}}
            - {name: HOME, value: /tmp}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            - {name: PYTHONUNBUFFERED, value: "1"}
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            {{- include "llm-platform.containerSecurity" . | nindent 12 }}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: catalog, mountPath: /etc/catalog}
      volumes:
        - name: catalog
          configMap:
            name: llm-catalog-{{ $hash }}
