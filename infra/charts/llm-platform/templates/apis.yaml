{{- $gateway := .Values.gateway }}
{{- range $name, $api := $gateway.apiRoutes }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-{{ $name }}
spec:
  parentRefs:
    - name: {{ $gateway.name }}
      sectionName: http
  rules:
    # Only the versioned API is exposed; the service's probes, metrics and MCP endpoint stay internal.
    - matches:
        - path: {type: PathPrefix, value: /{{ $name }}/v1}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /v1
      backendRefs:
        - name: {{ $api.service }}
          port: {{ $api.port }}
      timeouts:
        request: 30s
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: api-{{ $name }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: api-{{ $name }}
  traffic:
    apiKeyAuthentication:
      mode: Strict
      secretSelector:
        matchLabels:
          {{ $gateway.keyLabel }}: "true"
    rateLimit:
      local:
        - requests: {{ $gateway.limits.requestsPerMinute }}
          burst: {{ $gateway.limits.burst }}
          unit: Minutes
          key: apiKey.client
{{- end }}
