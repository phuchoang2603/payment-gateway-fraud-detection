{{- $gateway := .Values.gateway }}
{{- range $name, $server := $gateway.mcpServers }}
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: mcp-{{ $name }}
spec:
  mcp:
    targets:
      - name: {{ $name }}
        static:
          host: {{ $server.service }}.{{ $.Release.Namespace }}.svc.cluster.local
          port: {{ $server.port }}
          path: {{ $server.path }}
          protocol: StreamableHTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-{{ $name }}
spec:
  parentRefs:
    - name: {{ $gateway.name }}
      sectionName: http
  rules:
    - matches:
        - path: {type: PathPrefix, value: /mcp/{{ $name }}}
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: mcp-{{ $name }}
      timeouts:
        request: 60s
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: mcp-{{ $name }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: mcp-{{ $name }}
  traffic:
    apiKeyAuthentication:
      mode: Strict
      secretSelector:
        matchLabels:
          {{ $gateway.keyLabel }}: "true"
    rateLimit:
      local:
        - requests: {{ $gateway.limits.requestsPerMinute }}
          burst: {{ $gateway.limits.burst }}
          unit: Minutes
          key: apiKey.client
---
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: {{ $name }}
spec:
  description: {{ $server.description | quote }}
  url: http://{{ $gateway.name }}.{{ $.Release.Namespace }}.svc.cluster.local/mcp/{{ $name }}
  protocol: STREAMABLE_HTTP
  headersFrom:
    - name: Authorization
      valueFrom:
        type: Secret
        name: llm-gateway-agents
        key: authorization
{{- end }}
