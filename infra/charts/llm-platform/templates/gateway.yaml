{{- $gateway := .Values.gateway }}
{{- $chat := .Values.models.chat }}
{{- $candidate := .Values.models.candidate }}
{{- $embedding := .Values.models.embedding }}
{{- $decision := .Values.models.decision }}
{{- $screening := $gateway.screening }}
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayParameters
metadata:
  name: {{ $gateway.name }}
spec:
  service:
    spec:
      type: ClusterIP
  deployment:
    spec:
      template:
        spec:
          securityContext:
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $gateway.name }}
spec:
  gatewayClassName: {{ $gateway.className }}
  infrastructure:
    parametersRef:
      group: agentgateway.dev
      kind: AgentgatewayParameters
      name: {{ $gateway.name }}
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
    {{- range .Values.agents.entryAgents }}
    - name: {{ .name }}
      port: {{ .port }}
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
    - name: public
      port: {{ $gateway.public.port }}
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: {{ $chat.name }}
spec:
  ai:
    provider:
      custom:
        model: {{ $chat.name }}
        backendRef:
          group: inference.networking.k8s.io
          kind: InferencePool
          name: {{ $chat.name }}-inference-pool
        formats:
          - type: Completions
            path: /v1/chat/completions
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: {{ $embedding.name }}
spec:
  ai:
    provider:
      custom:
        model: {{ $embedding.name }}
        backendRef:
          kind: Service
          name: {{ $embedding.name }}-kserve-workload-svc
          port: 8000
        formats:
          - type: Embeddings
            path: /v1/embeddings
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: {{ $decision.name }}
spec:
  ai:
    provider:
      custom:
        model: {{ $decision.name }}
        backendRef:
          kind: Service
          name: {{ $decision.name }}-kserve-workload-svc
          port: 8000
        formats:
          - type: SystemOne
            path: /v1/systemone
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: decision
spec:
  parentRefs:
    - name: {{ $gateway.name }}
      sectionName: http
  rules:
    - name: screen
      matches:
        - path: {type: Exact, value: /v1/systemone}
          headers:
            - {name: x-llm-screen, value: request}
      backendRefs:
        - name: {{ $decision.name }}-kserve-workload-svc
          port: 8000
      timeouts:
        request: 10s
    - name: systemone
      matches:
        - path: {type: Exact, value: /v1/systemone}
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: {{ $decision.name }}
      timeouts:
        request: 30s
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: screen
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: decision
      sectionName: screen
  traffic:
    rateLimit:
      local:
        - requests: {{ $screening.requestsPerMinute }}
          unit: Minutes
    transformation:
      request:
        body: >-
          json(request.body).body.messages.filter(m, m.role == "user" && !m.content.startsWith("For context:"))
          .with(users, toJson({
          "model": {{ $decision.name | toJson }},
          "state": {"prompt": size(users) == 0 ? "" : users[size(users) - 1].content},
          "questions": {"screen": {{ $screening.question | toJson }}}}))
      response:
        body: >-
          json(response.body).answers.screen.probabilities.with(p, toJson(
          p.action >= {{ $screening.threshold | float64 }} || p.jailbreak >= {{ $screening.threshold | float64 }}
          ? {"action": {"body": {{ $screening.refusal | toJson }}, "status_code": 403,
          "reason": p.action >= p.jailbreak ? "action" : "jailbreak"}}
          : {"action": {"reason": "ok"}}))
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: decision
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: decision
      sectionName: systemone
  traffic:
    apiKeyAuthentication:
      mode: Strict
      secretSelector:
        matchLabels:
          {{ $gateway.keyLabel }}: "true"
    rateLimit:
      local:
        - requests: {{ $gateway.limits.requestsPerMinute }}
          burst: {{ $gateway.limits.burst }}
          unit: Minutes
          key: apiKey.client
  backend:
    ai:
      routes:
        /v1/systemone: SystemOne
{{- /* The LLM route screens the latest user message. An agent that only other agents call (humanInput: false) sends
its model calls with its caller's token to its own listener, on a route without the screen. */}}
{{- $routes := list (dict "name" "llm" "listener" "http" "screened" true) }}
{{- range $agent := .Values.agents.entryAgents }}
{{- if ne (include "llm-platform.humanInput" $agent) "true" }}
{{- $routes = append $routes (dict "name" (printf "llm-%s" $agent.name) "listener" $agent.name "screened" false "overrides" $agent.modelOverrides "clients" (keys $agent.profiles | sortAlpha)) }}
{{- end }}
{{- end }}
{{- range $route := $routes }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $route.name }}
spec:
  parentRefs:
    - name: {{ $gateway.name }}
      sectionName: {{ $route.listener }}
  rules:
    - matches:
        - path: {type: PathPrefix, value: /v1/embeddings}
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: {{ $embedding.name }}
      timeouts:
        request: 60s
    - matches:
        - path: {type: PathPrefix, value: /v1}
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: {{ $chat.name }}
          {{- if $candidate.enabled }}
          weight: {{ sub 100 ($candidate.weight | int) }}
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: {{ $candidate.name }}
          weight: {{ $candidate.weight }}
          {{- end }}
      timeouts:
        request: 300s
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: {{ $route.name }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ $route.name }}
  traffic:
    {{- if $route.screened }}
    apiKeyAuthentication:
      mode: Strict
      secretSelector:
        matchLabels:
          {{ $gateway.keyLabel }}: "true"
    rateLimit:
      local:
        - requests: {{ $gateway.limits.requestsPerMinute }}
          burst: {{ $gateway.limits.burst }}
          unit: Minutes
          key: apiKey.client
        - tokens: {{ $gateway.limits.tokensPerMinute }}
          unit: Minutes
          key: apiKey.client
    {{- else }}
    jwtAuthentication:
      mode: Strict
      providers:
        - issuer: {{ $.Values.agents.a2a.signing.issuer }}
          audiences: [kagent]
          jwks:
            inline: {{ $.Values.agents.a2a.signing.jwks | quote }}
    authorization:
      action: Require
      policy:
        matchExpressions:
          - {{ printf "has(jwt.client) && jwt.client in %s" (toJson $route.clients) | quote }}
    rateLimit:
      local:
        - requests: {{ $gateway.limits.requestsPerMinute }}
          burst: {{ $gateway.limits.burst }}
          unit: Minutes
          key: 'has(jwt.user_id) ? jwt.user_id : jwt.sub'
        - tokens: {{ $gateway.limits.tokensPerMinute }}
          unit: Minutes
          key: 'has(jwt.user_id) ? jwt.user_id : jwt.sub'
    {{- end }}
  backend:
    ai:
      routes:
        /v1/chat/completions: Completions
        /v1/embeddings: Embeddings
        /v1/models: Models
      {{- with $route.overrides }}
      overrides:
        {{- range $field, $value := . }}
        - field: {{ $field }}
          value: {{ $value | toJson }}
        {{- end }}
      {{- end }}
      promptGuard:
        request:
          - regex:
              action: Mask
              builtins: [CreditCard, Email]
              matches:
                {{- toYaml $gateway.piiPatterns | nindent 16 }}
          {{- if $route.screened }}
          # Runs after masking, so the decision model never sees the masked values. The webhook calls the gateway's
          # /v1/systemone route with the screen header.
          - webhook:
              action: Reject
              failureMode: {{ $gateway.screening.failureMode }}
              backendRef:
                kind: Service
                name: {{ $gateway.name }}
                port: 80
              headers:
                ":path": '"/v1/systemone"'
                x-llm-screen: '"request"'
          {{- end }}
        response:
          - regex:
              action: Mask
              builtins: [CreditCard, Email]
              matches:
                {{- toYaml $gateway.piiPatterns | nindent 16 }}
{{- end }}
