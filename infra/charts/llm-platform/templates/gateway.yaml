{{- $gateway := .Values.gateway }}
{{- $chat := .Values.models.chat }}
{{- $embedding := .Values.models.embedding }}
{{- $decision := .Values.models.decision }}
{{- $screening := $gateway.screening }}
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayParameters
metadata:
  name: {{ $gateway.name }}
spec:
  service:
    spec:
      type: ClusterIP
  # The namespace enforces the restricted Pod Security level; the generated proxy sets everything but seccomp.
  deployment:
    spec:
      template:
        spec:
          securityContext:
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $gateway.name }}
spec:
  gatewayClassName: {{ $gateway.className }}
  infrastructure:
    parametersRef:
      group: agentgateway.dev
      kind: AgentgatewayParameters
      name: {{ $gateway.name }}
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: {{ $chat.name }}
spec:
  ai:
    provider:
      custom:
        model: {{ $chat.name }}
        backendRef:
          group: inference.networking.k8s.io
          kind: InferencePool
          name: {{ $chat.name }}-inference-pool
        formats:
          - type: Completions
            path: /v1/chat/completions
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: {{ $embedding.name }}
spec:
  ai:
    provider:
      custom:
        model: {{ $embedding.name }}
        backendRef:
          kind: Service
          name: {{ $embedding.name }}-kserve-workload-svc
          port: 8000
        formats:
          - type: Embeddings
            path: /v1/embeddings
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: {{ $decision.name }}
spec:
  ai:
    provider:
      custom:
        model: {{ $decision.name }}
        backendRef:
          kind: Service
          name: {{ $decision.name }}-kserve-workload-svc
          port: 8000
        formats:
          - type: SystemOne
            path: /v1/systemone
---
# /v1/systemone stays outside the LLM route's prompt guard, which calls it. The guard's webhook sends the screen header;
# its rule converts the webhook's messages into one question about the latest user turn and the decision model's
# answer into the guard's pass or reject verdict. Other calls pass through unchanged.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: decision
spec:
  parentRefs:
    - name: {{ $gateway.name }}
      sectionName: http
  rules:
    - name: screen
      matches:
        - path: {type: Exact, value: /v1/systemone}
          headers:
            - {name: x-llm-screen, value: request}
      backendRefs:
        - name: {{ $decision.name }}-kserve-workload-svc
          port: 8000
      timeouts:
        request: 10s
    - name: systemone
      matches:
        - path: {type: Exact, value: /v1/systemone}
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: {{ $decision.name }}
      timeouts:
        request: 30s
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: screen
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: decision
      sectionName: screen
  traffic:
    rateLimit:
      local:
        - requests: {{ $screening.requestsPerMinute }}
          unit: Minutes
    # After a hand-off, ADK passes the previous agent's turns to the next one as user messages that start with
    # "For context:"; the screen judges the analyst's latest message, not those.
    transformation:
      request:
        body: >-
          json(request.body).body.messages.filter(m, m.role == "user" && !m.content.startsWith("For context:"))
          .with(users, toJson({
          "model": {{ $decision.name | toJson }},
          "state": {"prompt": size(users) == 0 ? "" : users[size(users) - 1].content},
          "questions": {"screen": {{ $screening.question | toJson }}}}))
      response:
        body: >-
          json(response.body).answers.screen.probabilities.with(p, toJson(
          p.action >= {{ $screening.threshold | float64 }} || p.jailbreak >= {{ $screening.threshold | float64 }}
          ? {"action": {"body": {{ $screening.refusal | toJson }}, "status_code": 403,
          "reason": p.action >= p.jailbreak ? "action" : "jailbreak"}}
          : {"action": {"reason": "ok"}}))
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: decision
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: decision
      sectionName: systemone
  traffic:
    apiKeyAuthentication:
      mode: Strict
      secretSelector:
        matchLabels:
          {{ $gateway.keyLabel }}: "true"
    rateLimit:
      local:
        - requests: {{ $gateway.limits.requestsPerMinute }}
          burst: {{ $gateway.limits.burst }}
          unit: Minutes
          key: apiKey.client
  backend:
    ai:
      routes:
        /v1/systemone: SystemOne
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm
spec:
  parentRefs:
    - name: {{ $gateway.name }}
      sectionName: http
  rules:
    - matches:
        - path: {type: PathPrefix, value: /v1/embeddings}
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: {{ $embedding.name }}
      timeouts:
        request: 60s
    - matches:
        - path: {type: PathPrefix, value: /v1}
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: {{ $chat.name }}
      timeouts:
        request: 300s
---
# agentgateway applies one policy per target, so authentication, limits and guards for the route live together.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: llm
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: llm
  traffic:
    apiKeyAuthentication:
      mode: Strict
      secretSelector:
        matchLabels:
          {{ $gateway.keyLabel }}: "true"
    rateLimit:
      local:
        - requests: {{ $gateway.limits.requestsPerMinute }}
          burst: {{ $gateway.limits.burst }}
          unit: Minutes
          key: apiKey.client
        - tokens: {{ $gateway.limits.tokensPerMinute }}
          unit: Minutes
          key: apiKey.client
  backend:
    ai:
      # Without this map every request is parsed as a chat completion, which rejects embedding requests.
      routes:
        /v1/chat/completions: Completions
        /v1/embeddings: Embeddings
        /v1/models: Models
      promptGuard:
        request:
          - regex:
              action: Mask
              builtins: [CreditCard, Email]
              matches:
                {{- toYaml $gateway.piiPatterns | nindent 16 }}
          # Runs after masking, so the decision model never sees the masked values. The webhook calls the gateway's
          # /v1/systemone route with the screen header.
          - webhook:
              action: Reject
              failureMode: {{ $gateway.screening.failureMode }}
              backendRef:
                kind: Service
                name: {{ $gateway.name }}
                port: 80
              headers:
                ":path": '"/v1/systemone"'
                x-llm-screen: '"request"'
        response:
          - regex:
              action: Mask
              builtins: [CreditCard, Email]
              matches:
                {{- toYaml $gateway.piiPatterns | nindent 16 }}
