{{- $chat := .Values.models.chat }}
{{- $embedding := .Values.models.embedding }}
{{- $store := .Values.modelStore }}
{{- $uploads := concat (list (pick $chat "repo" "revision") (pick $embedding "repo" "revision")) .Values.models.extraUploads }}
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: llm-gpu
spec:
  devices:
    requests:
      - name: gpu
        exactly:
          deviceClassName: {{ .Values.gpu.deviceClassName }}
          allocationMode: ExactCount
          count: 1
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llm-compile-cache
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.storage.storageClass }}
  resources:
    requests:
      storage: {{ .Values.storage.compileCache }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: model-upload-{{ toJson (list $uploads $store) | sha256sum | trunc 10 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: model-upload
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        {{- include "llm-platform.podSecurity" (dict "uid" 65532) | nindent 8 }}
      # The dev GPU node is also the control plane; keep the multi-gigabyte transfer off it.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: nvidia.com/gpu.present, operator: DoesNotExist}
                  - {key: node-role.kubernetes.io/control-plane, operator: DoesNotExist}
      containers:
        - name: upload
          image: {{ include "llm-platform.image" (dict "image" .Values.benchmark.image "global" .Values.global) }}
          command: [python3, -c]
          args:
            - |
              import json, os
              import boto3
              from botocore.exceptions import ClientError
              from huggingface_hub import HfApi, hf_hub_download

              api = HfApi()
              s3 = boto3.client("s3")
              bucket, prefix = os.environ["BUCKET"], os.environ["PREFIX"]
              for model in json.loads(os.environ["MODELS"]):
                  repo, revision = model["repo"], model["revision"]
                  for item in api.list_repo_tree(repo, revision=revision, recursive=True):
                      if not hasattr(item, "size"):
                          continue
                      key = f"{prefix}/{repo}/{revision}/{item.path}"
                      try:
                          if s3.head_object(Bucket=bucket, Key=key)["ContentLength"] == item.size:
                              continue
                      except ClientError as error:
                          if error.response["Error"]["Code"] not in ("404", "NoSuchKey"):
                              raise
                      path = hf_hub_download(repo, item.path, revision=revision, cache_dir="/work/hf")
                      s3.upload_file(path, bucket, key)
                      os.remove(os.path.realpath(path))
                      print(f"uploaded s3://{bucket}/{key}", flush=True)
                  print(f"{repo}@{revision} complete", flush=True)
          env:
            - name: MODELS
              value: {{ toJson $uploads | quote }}
            - name: BUCKET
              value: {{ $store.bucket }}
            - name: PREFIX
              value: {{ $store.prefix }}
            - name: HOME
              value: /work
            - name: HF_HUB_DISABLE_TELEMETRY
              value: "1"
            {{- include "llm-platform.modelStoreEnv" $store | nindent 12 }}
          securityContext:
            {{- include "llm-platform.containerSecurity" . | nindent 12 }}
          resources:
            requests: {cpu: 250m, memory: 1Gi, ephemeral-storage: 8Gi}
            limits: {memory: 2Gi, ephemeral-storage: 12Gi}
          volumeMounts:
            - {name: work, mountPath: /work}
      volumes:
        - name: work
          emptyDir: {}
{{- range $role, $model := dict "chat" $chat "embedding" $embedding }}
---
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: {{ $model.name }}
  {{- if $model.stopped }}
  annotations:
    serving.kserve.io/stop: "true"
  {{- end }}
spec:
  model:
    name: {{ $model.name }}
    uri: {{ include "llm-platform.modelURI" (dict "store" $store "model" $model) }}
  storageInitializer:
    enabled: false
  replicas: {{ $model.replicas }}
  {{- if eq $role "chat" }}
  router:
    gateway:
      refs:
        - name: {{ $.Values.gateway.name }}
          namespace: {{ $.Release.Namespace }}
    route:
      http:
        refs:
          - name: llm
    scheduler: {}
  {{- end }}
  template:
    {{- include "llm-platform.gpuPlacement" $ | nindent 4 }}
    securityContext:
      {{- include "llm-platform.podSecurity" $.Values.vllm | nindent 6 }}
    resourceClaims:
      - name: gpu
        resourceClaimName: llm-gpu
    containers:
      - name: main
        image: {{ $.Values.vllm.image }}
        # Replaces the preset's start script, which serves a local /mnt/models; weights stream from object storage.
        command:
          {{- include "llm-platform.vllmServe" (dict "store" $store "model" $model "loaderConfig" $.Values.vllm.loaderConfig) | nindent 10 }}
        args:
          {{- toYaml $model.args | nindent 10 }}
        env:
          {{- include "llm-platform.vllmEnv" $ | nindent 10 }}
          {{- include "llm-platform.modelStoreEnv" $store | nindent 10 }}
        resources:
          {{- toYaml $model.resources | nindent 10 }}
          claims:
            - name: gpu
        securityContext:
          runAsNonRoot: true
          runAsUser: {{ $.Values.vllm.uid }}
          {{- include "llm-platform.containerSecurity" $ | nindent 10 }}
        volumeMounts:
          - name: compile-cache
            mountPath: /home/.cache/vllm
            subPath: {{ $model.name }}
    volumes:
      - name: compile-cache
        persistentVolumeClaim:
          claimName: llm-compile-cache
{{- end }}
