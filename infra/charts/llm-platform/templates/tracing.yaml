{{- if .Values.tracing.enabled }}
# Frontend policies attach to the Gateway; route policies stay one per route.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: tracing
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
  frontend:
    tracing:
      url: {{ .Values.tracing.url }}
      protocol: HTTP
      path: {{ .Values.tracing.path }}
      randomSampling: {{ .Values.tracing.sampling | quote }}
      clientSampling: {{ .Values.tracing.sampling | quote }}
{{- end }}
