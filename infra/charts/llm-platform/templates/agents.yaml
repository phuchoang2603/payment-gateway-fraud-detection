{{- $agents := .Values.agents }}
{{- $ns := $agents.namespace }}
{{- $pool := $agents.workerPool }}
{{- $egress := printf "http://%s.%s.svc.cluster.local" $agents.egress.name .Release.Namespace }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-prompts
  namespace: {{ $ns }}
data:
  {{- range $agent := $agents.list }}
  {{ $agent.name }}.md: |
    {{- $.Files.Get (printf "files/prompts/%s.md" $agent.name) | required (printf "files/prompts/%s.md is missing" $agent.name) | nindent 4 }}
  {{- end }}
{{- if $agents.tracing.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-otlp
  namespace: {{ $ns }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.secretStore }}
  target:
    name: langfuse-otlp
    template:
      data:
        # OTLP exporters URL-decode header values, so the space after Basic is %20.
        headers: '{{ "Authorization=Basic%20{{ printf \"%s:%s\" .public .secret | b64enc }}" }}'
  data:
    - secretKey: public
      remoteRef:
        key: LANGFUSE_INIT_PUBLIC_KEY
    - secretKey: secret
      remoteRef:
        key: LANGFUSE_INIT_SECRET_KEY
{{- end }}
---
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: {{ $agents.modelConfig }}
  namespace: {{ $ns }}
spec:
  provider: OpenAI
  model: {{ .Values.models.chat.name }}
  apiKeySecret: llm-gateway-agents
  apiKeySecretKey: key
  openAI:
    baseUrl: {{ $egress }}/v1
{{- range $name, $server := .Values.gateway.mcpServers }}
---
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
spec:
  description: {{ $server.description | quote }}
  url: {{ $egress }}/mcp/{{ $name }}
  protocol: STREAMABLE_HTTP
  headersFrom:
    - name: Authorization
      valueFrom:
        type: Secret
        name: llm-gateway-agents
        key: authorization
{{- end }}
---
apiVersion: ate.dev/v1alpha1
kind: WorkerPool
metadata:
  name: {{ $pool.name }}
  namespace: {{ $ns }}
spec:
  ateomImage: {{ $pool.image }}
  sandboxClass: {{ $pool.sandboxClass }}
  replicas: {{ $pool.replicas }}
  template:
    resources:
      {{- toYaml $pool.resources | nindent 6 }}
{{- range $agent := $agents.list }}
{{- $tools := list }}
{{- range $server := $agent.mcpServers | default list }}
{{- $spec := required (printf "gateway.mcpServers.%s is not defined" $server) (index $.Values.gateway.mcpServers $server) }}
{{- $tools = append $tools (dict "type" "McpServer" "mcpServer" (dict "apiGroup" "kagent.dev" "kind" "RemoteMCPServer" "name" $server "toolNames" $spec.tools)) }}
{{- end }}
{{- $declarative := dict
  "modelConfig" $agents.modelConfig
  "systemMessageFrom" (dict "type" "ConfigMap" "name" "agent-prompts" "key" (printf "%s.md" $agent.name)) }}
{{- with $tools }}
{{- $_ := set $declarative "tools" . }}
{{- end }}
---
apiVersion: kagent.dev/v1alpha2
kind: SandboxAgent
metadata:
  name: {{ $agent.name }}
  namespace: {{ $ns }}
spec:
  type: Declarative
  description: {{ $agent.description | quote }}
  version: {{ $agent.version | quote }}
  declarative:
    {{- toYaml $declarative | nindent 4 }}
    {{- if $agents.tracing.enabled }}
    deployment:
      # kagent appends its controller's OTEL_* variables after these, so its OTEL_TRACING_ENABLED decides whether
      # the agent exports at all. Traces leave the sandbox through the egress proxy like every other call.
      env:
        - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
          value: {{ $egress }}/api/public/otel/v1/traces
        - name: OTEL_EXPORTER_OTLP_TRACES_PROTOCOL
          value: http/protobuf
        - name: OTEL_EXPORTER_OTLP_TRACES_HEADERS
          valueFrom:
            secretKeyRef:
              name: langfuse-otlp
              key: headers
    {{- end }}
  sandbox:
    network:
      allowedDomains:
        - {{ printf "%s.%s.svc.cluster.local" $agents.egress.name $.Release.Namespace }}
  substrate:
    workerPoolRef:
      apiGroup: ate.dev
      kind: WorkerPool
      name: {{ $pool.name }}
    snapshotsConfig:
      location: {{ printf "%s/%s/" $agents.snapshotRoot $agent.name }}
{{- end }}
---
# Substrate's API server resolves each actor's Secret references when it starts the golden actor.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: substrate-actor-secrets
  namespace: {{ $ns }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
    resourceNames:
      - llm-gateway-agents
      {{- if $agents.tracing.enabled }}
      - langfuse-otlp
      {{- end }}
      {{- range $agent := $agents.list }}
      - {{ $agent.name }}
      {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: substrate-actor-secrets
  namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: substrate-actor-secrets
subjects:
  - kind: ServiceAccount
    namespace: {{ $agents.substrateApiServer.namespace }}
    name: {{ $agents.substrateApiServer.name }}
