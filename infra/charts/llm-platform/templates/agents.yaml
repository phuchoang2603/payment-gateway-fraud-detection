{{- $agents := .Values.agents }}
{{- $ns := $agents.namespace }}
{{- $pool := $agents.workerPool }}
{{- $gatewayUrl := printf "http://%s.%s.svc.cluster.local" .Values.gateway.name .Release.Namespace }}
{{- $langfuseOrigin := printf "http://langfuse-web.%s.svc.cluster.local:3000" .Release.Namespace }}
{{- /* One Agent per agent, plus one per A/B variant: the same template with another model config. */}}
{{- $deployed := list }}
{{- range $agent := $agents.list }}
{{- $deployed = append $deployed (dict "agent" $agent "name" $agent.name "modelConfig" $agents.modelConfig) }}
{{- with $agent.abTest }}
{{- $deployed = append $deployed (dict "agent" $agent "name" .variant "modelConfig" .modelConfig) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-prompts
  namespace: {{ $ns }}
data:
  {{- range $agent := $agents.list }}
  {{ $agent.name }}.md: |
    {{- $.Files.Get (printf "files/prompts/%s.md" $agent.name) | required (printf "files/prompts/%s.md is missing" $agent.name) | nindent 4 }}
  {{- end }}
{{- range $name, $settings := $agents.modelConfigs }}
---
# Substrate's egress gateway replaces the runtime's placeholder Authorization header with this key.
apiVersion: api.kagent.dev/v1alpha3
kind: ModelConfig
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
spec:
  provider: OpenAI
  model: {{ $.Values.models.chat.name }}
  apiKeySecret: llm-gateway-agents
  apiKeySecretKey: key
  openAI:
    baseUrl: {{ $gatewayUrl }}/v1
    {{- with $settings }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- range $name, $server := .Values.gateway.mcpServers }}
---
apiVersion: api.kagent.dev/v1alpha3
kind: RemoteMCPServer
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
spec:
  description: {{ $server.description | quote }}
  url: {{ $gatewayUrl }}/mcp/{{ $name }}
  protocol: STREAMABLE_HTTP
  # Substrate's egress gateway injects this header too; it differs from the model's Authorization header because one
  # origin and header can carry only one credential.
  headersFrom:
    - name: x-api-key
      valueFrom:
        type: Secret
        name: llm-gateway-agents
        key: key
{{- end }}
{{- if $agents.tracing.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-otlp
  namespace: {{ $ns }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.secretStore }}
  target:
    name: langfuse-otlp
    template:
      data:
        basic: '{{ "{{ printf \"%s:%s\" .public .secret | b64enc }}" }}'
  data:
    - secretKey: public
      remoteRef:
        key: LANGFUSE_INIT_PUBLIC_KEY
    - secretKey: secret
      remoteRef:
        key: LANGFUSE_INIT_SECRET_KEY
---
# The trace endpoint is granted from the Harness's OTLP setting; this adds the project's basic-auth credential.
apiVersion: api.kagent.dev/v1alpha3
kind: EgressPolicy
metadata:
  name: langfuse-traces
  namespace: {{ $ns }}
spec:
  destinations:
    - origin: {{ $langfuseOrigin }}
      authentication:
        header: Authorization
        prefix: "Basic "
        secretKeyRef:
          name: langfuse-otlp
          key: basic
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $pool.name }}-worker
  namespace: {{ $ns }}
automountServiceAccountToken: false
---
apiVersion: ate.dev/v1
kind: WorkerPool
metadata:
  name: {{ $pool.name }}
  namespace: {{ $ns }}
  labels:
    kagent.dev/worker-pool-name: {{ $pool.name }}
    kagent.dev/worker-pool-namespace: {{ $ns }}
spec:
  replicas: {{ $pool.autoscaling.minReplicas }}
  workerImage: {{ $pool.image }}
  sandboxClasses:
    - name: {{ $pool.sandboxClass }}
      configRef:
        name: {{ $pool.sandboxConfig }}
  template:
    serviceAccountName: {{ $pool.name }}-worker
    resources:
      {{- toYaml $pool.resources | nindent 6 }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ $pool.name }}
  namespace: {{ $ns }}
spec:
  scaleTargetRef:
    apiVersion: ate.dev/v1
    kind: WorkerPool
    name: {{ $pool.name }}
  minReplicaCount: {{ $pool.autoscaling.minReplicas }}
  maxReplicaCount: {{ $pool.autoscaling.maxReplicas }}
  triggers:
    - type: prometheus
      metadata:
        serverAddress: {{ $pool.autoscaling.prometheus }}
        # Every Substrate API replica reports the whole fleet, so take the max per state before summing.
        query: >-
          sum(max by (ate_worker_state) (ate_workerpool_workers{ate_workerpool_namespace="{{ $ns }}",ate_workerpool_name="{{ $pool.name }}",ate_worker_state=~"partial|at_capacity"}))
        threshold: {{ $pool.autoscaling.busyWorkersPerReplica | quote }}
---
apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: {{ $agents.harness }}
  namespace: {{ $ns }}
spec:
  kagent: {}
  {{- if $agents.tracing.enabled }}
  env:
    - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
      value: {{ $langfuseOrigin }}/api/public/otel/v1/traces
    - name: OTEL_EXPORTER_OTLP_TRACES_PROTOCOL
      value: http/protobuf
    # A placeholder: Substrate's egress gateway replaces it with the langfuse-traces credential.
    - name: OTEL_EXPORTER_OTLP_TRACES_HEADERS
      value: Authorization=placeholder
    # Only traces have a destination; there is no OpenTelemetry Collector.
    - name: OTEL_LOGS_EXPORTER
      value: none
    - name: OTEL_METRICS_EXPORTER
      value: none
  {{- end }}
  substrate:
    workerPoolRef:
      name: {{ $pool.name }}
    snapshotPolicy:
      location: {{ $agents.snapshotRoot }}
{{- range $deploy := $deployed }}
{{- $agent := $deploy.agent }}
{{- $tools := list }}
{{- range $server := $agent.mcpServers | default list }}
{{- $_ := required (printf "gateway.mcpServers.%s is not defined" $server) (index $.Values.gateway.mcpServers $server) }}
{{- /* No tool list: the agent gets every tool the server lists, discovered at runtime. */}}
{{- $tools = append $tools (dict "mcp" (dict "server" (dict "kind" "RemoteMCPServer" "name" $server))) }}
{{- end }}
{{- range $sub := $agent.agents | default list }}
{{- $target := dict }}
{{- range $candidate := $agents.list }}
{{- if eq $candidate.name $sub }}{{ $target = $candidate }}{{ end }}
{{- end }}
{{- $_ := required (printf "agents.list has no %s" $sub) $target.description }}
{{- $tools = append $tools (dict "subAgent" (dict "name" ($sub | replace "-" "_") "description" $target.description "templateRef" (dict "name" $sub))) }}
{{- end }}
{{- $_ := required (printf "agents.modelConfigs.%s is not defined" $deploy.modelConfig) (hasKey $agents.modelConfigs $deploy.modelConfig | ternary "ok" "") }}
{{- $template := dict
  "modelConfig" (dict "name" $deploy.modelConfig)
  "description" $agent.description
  "systemPromptFrom" (dict "name" "agent-prompts" "key" (printf "%s.md" $agent.name)) }}
{{- with $tools }}
{{- $_ := set $template "tools" . }}
{{- end }}
---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: {{ $deploy.name }}
  namespace: {{ $ns }}
spec:
  {{- toYaml $template | nindent 2 }}
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: {{ $deploy.name }}
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/version: {{ $agent.version | quote }}
spec:
  template:
    ref:
      name: {{ $deploy.name }}
  harnessRef:
    name: {{ $agents.harness }}
  {{- if $agents.tracing.enabled }}
  egressPolicyRefs:
    - name: langfuse-traces
  {{- end }}
{{- end }}
