{{- $agents := .Values.agents }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $agents.serviceAccount }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-prompts
data:
  {{- range $agent := $agents.list }}
  {{ $agent.name }}.md: |
    {{- $.Files.Get (printf "files/prompts/%s.md" $agent.name) | required (printf "files/prompts/%s.md is missing" $agent.name) | nindent 4 }}
  {{- end }}
{{- if $agents.tracing.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-otlp
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.secretStore }}
  target:
    name: langfuse-otlp
    template:
      data:
        # OTLP exporters URL-decode header values, so the space after Basic is %20.
        headers: '{{ "Authorization=Basic%20{{ printf \"%s:%s\" .public .secret | b64enc }}" }}'
  data:
    - secretKey: public
      remoteRef:
        key: LANGFUSE_INIT_PUBLIC_KEY
    - secretKey: secret
      remoteRef:
        key: LANGFUSE_INIT_SECRET_KEY
{{- end }}
---
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: {{ $agents.modelConfig }}
spec:
  provider: OpenAI
  model: {{ .Values.models.chat.name }}
  apiKeySecret: llm-gateway-agents
  apiKeySecretKey: key
  openAI:
    baseUrl: http://{{ .Values.gateway.name }}.{{ .Release.Namespace }}.svc.cluster.local/v1
{{- range $agent := $agents.list }}
{{- $tools := list }}
{{- range $server := $agent.mcpServers | default list }}
{{- $spec := required (printf "gateway.mcpServers.%s is not defined" $server) (index $.Values.gateway.mcpServers $server) }}
{{- $tools = append $tools (dict "type" "McpServer" "mcpServer" (dict "apiGroup" "kagent.dev" "kind" "RemoteMCPServer" "name" $server "toolNames" $spec.tools)) }}
{{- end }}
{{- $declarative := dict
  "modelConfig" $agents.modelConfig
  "systemMessageFrom" (dict "type" "ConfigMap" "name" "agent-prompts" "key" (printf "%s.md" $agent.name)) }}
{{- with $tools }}
{{- $_ := set $declarative "tools" . }}
{{- end }}
---
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: {{ $agent.name }}
spec:
  type: Declarative
  description: {{ $agent.description | quote }}
  version: {{ $agent.version | quote }}
  declarative:
    {{- toYaml $declarative | nindent 4 }}
    deployment:
      serviceAccountName: {{ $agents.serviceAccount }}
      {{- if $agents.tracing.enabled }}
      # kagent appends its controller's OTEL_* variables after these, so its OTEL_TRACING_ENABLED decides whether
      # the agent exports at all.
      env:
        - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
          value: http://langfuse-web.{{ $.Release.Namespace }}.svc.cluster.local:3000/api/public/otel/v1/traces
        - name: OTEL_EXPORTER_OTLP_TRACES_PROTOCOL
          value: http/protobuf
        - name: OTEL_EXPORTER_OTLP_TRACES_HEADERS
          valueFrom:
            secretKeyRef:
              name: langfuse-otlp
              key: headers
      {{- end }}
      podSecurityContext:
        {{- include "llm-platform.podSecurity" $agents | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        {{- include "llm-platform.containerSecurity" $ | nindent 8 }}
---
apiVersion: kagent.dev/v1alpha2
kind: SandboxAgent
metadata:
  name: {{ $agent.name }}-sandbox
spec:
  type: Declarative
  description: {{ $agent.description | quote }}
  version: {{ $agent.version | quote }}
  declarative:
    {{- toYaml $declarative | nindent 4 }}
  sandbox:
    network:
      allowedDomains:
        - {{ $.Values.gateway.name }}.{{ $.Release.Namespace }}.svc.cluster.local
  substrate:
    snapshotsConfig:
      location: {{ printf "%s/%s-sandbox/" $agents.sandbox.snapshotRoot $agent.name }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: substrate-sandbox-secrets
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
    resourceNames:
      - llm-gateway-agents
      {{- range $agent := $agents.list }}
      - {{ $agent.name }}-sandbox
      {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: substrate-sandbox-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: substrate-sandbox-secrets
subjects:
  {{- $sa := splitList ":" $agents.sandbox.apiServer }}
  - kind: ServiceAccount
    namespace: {{ index $sa 2 }}
    name: {{ index $sa 3 }}
