{{- $agents := .Values.agents }}
{{- $ns := $agents.namespace }}
{{- $pool := $agents.workerPool }}
{{- $gatewayUrl := printf "http://%s.%s.svc.cluster.local" .Values.gateway.name .Release.Namespace }}
{{- $langfuseOrigin := printf "http://langfuse-web.%s.svc.cluster.local:3000" .Release.Namespace }}
{{- $runtime := $agents.runtime.image }}
{{- $digest := index (.Values.global.imageDigests | default dict) $runtime }}
{{- $runtimeImage := ternary (printf "%s@%s" $runtime $digest) (printf "%s:%s" $runtime (index .Values.global.imageTags $runtime)) (not (empty $digest)) }}
{{- $models := list (dict "name" $agents.modelConfig "baseUrl" (printf "%s/v1" $gatewayUrl)) }}
{{- range $agent := $agents.entryAgents }}
{{- if ne (include "llm-platform.humanInput" $agent) "true" }}
{{- $models = append $models (dict "name" (include "llm-platform.modelConfig" (dict "root" $ "agent" $agent)) "baseUrl" (printf "%s:%d/v1" $gatewayUrl (int $agent.modelPort))) }}
{{- end }}
{{- end }}
{{- range $model := $models }}
# Substrate's egress gateway replaces the runtime's placeholder Authorization header with this key.
apiVersion: api.kagent.dev/v1alpha3
kind: ModelConfig
metadata:
  name: {{ $model.name }}
  namespace: {{ $ns }}
spec:
  provider: OpenAI
  model: {{ $.Values.models.chat.name }}
  apiKeySecret: llm-gateway-agents
  apiKeySecretKey: key
  openAI:
    baseUrl: {{ $model.baseUrl }}
    {{- with $.Values.models.chat.sampling }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
---
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-api
  namespace: {{ $ns }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.secretStore }}
  target:
    name: langfuse-api
    template:
      data:
        basic: '{{ "{{ printf \"%s:%s\" .public .secret | b64enc }}" }}'
  data:
    - secretKey: public
      remoteRef:
        key: LANGFUSE_INIT_PUBLIC_KEY
    - secretKey: secret
      remoteRef:
        key: LANGFUSE_INIT_SECRET_KEY
---
apiVersion: api.kagent.dev/v1alpha3
kind: EgressPolicy
metadata:
  name: langfuse
  namespace: {{ $ns }}
spec:
  destinations:
    - origin: {{ $langfuseOrigin }}
      authentication:
        header: Authorization
        prefix: "Basic "
        secretKeyRef:
          name: langfuse-api
          key: basic
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $pool.name }}-worker
  namespace: {{ $ns }}
automountServiceAccountToken: false
---
apiVersion: ate.dev/v1
kind: WorkerPool
metadata:
  name: {{ $pool.name }}
  namespace: {{ $ns }}
  labels:
    kagent.dev/worker-pool-name: {{ $pool.name }}
    kagent.dev/worker-pool-namespace: {{ $ns }}
spec:
  replicas: {{ $pool.autoscaling.minReplicas }}
  workerImage: {{ $pool.image }}
  sandboxClasses:
    - name: {{ $pool.sandboxClass }}
      configRef:
        name: {{ $pool.sandboxConfig }}
  template:
    serviceAccountName: {{ $pool.name }}-worker
    resources:
      {{- toYaml $pool.resources | nindent 6 }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ $pool.name }}
  namespace: {{ $ns }}
spec:
  scaleTargetRef:
    apiVersion: ate.dev/v1
    kind: WorkerPool
    name: {{ $pool.name }}
  minReplicaCount: {{ $pool.autoscaling.minReplicas }}
  maxReplicaCount: {{ $pool.autoscaling.maxReplicas }}
  triggers:
    - type: prometheus
      metadata:
        serverAddress: {{ $pool.autoscaling.prometheus }}
        query: >-
          sum(max by (ate_worker_state) (ate_workerpool_workers{ate_workerpool_namespace="{{ $ns }}",ate_workerpool_name="{{ $pool.name }}",ate_worker_state=~"partial|at_capacity"}))
        threshold: {{ $pool.autoscaling.busyWorkersPerReplica | quote }}
{{- range $agent := $agents.entryAgents }}
{{- $modelConfig := include "llm-platform.modelConfig" (dict "root" $ "agent" $agent) }}
{{- range $name := include "llm-platform.agentServers" (dict "root" $ "agent" $agent) | fromJsonArray }}
{{- $server := index $.Values.gateway.mcpServers $name }}
---
apiVersion: api.kagent.dev/v1alpha3
kind: RemoteMCPServer
metadata:
  name: {{ $agent.name }}-{{ $name }}
  namespace: {{ $ns }}
  labels:
    kagent.dev/discovery: disabled
spec:
  description: {{ $server.description | quote }}
  url: {{ $gatewayUrl }}:{{ $agent.port }}/mcp/{{ $name }}
  protocol: STREAMABLE_HTTP
  tokenPassthrough: true
{{- end }}
{{- $bindings := list }}
{{- range $name := $agent.mcpServers | default list }}
{{- $resolved := include "llm-platform.mcpServer" (dict "root" $ "name" $name "audience" $agent.audience) }}
{{- /* No tool list: the agent gets every tool the server lists, discovered at runtime. */}}
{{- $bindings = append $bindings (dict "mcp" (dict "server" (dict "kind" "RemoteMCPServer" "name" (printf "%s-%s" $agent.name $resolved)))) }}
{{- end }}
{{- range $name := $agent.agents }}
{{- $specialist := index $agents.specialists $name }}
{{- /* kagent compiles the template into this agent's runtime as an ADK sub-agent named after the binding; the
runtime reads that agent's Langfuse prompt by the same name. */}}
{{- $bindings = append $bindings (dict "subAgent" (dict "name" ($name | replace "-" "_") "description" $specialist.description "templateRef" (dict "name" (printf "%s-%s" $name $agent.name)))) }}
{{- $tools := list }}
{{- range $server := $specialist.mcpServers }}
{{- $resolved := include "llm-platform.mcpServer" (dict "root" $ "name" $server "audience" $agent.audience) }}
{{- $tools = append $tools (dict "mcp" (dict "server" (dict "kind" "RemoteMCPServer" "name" (printf "%s-%s" $agent.name $resolved)))) }}
{{- end }}
---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: {{ $name }}-{{ $agent.name }}
  namespace: {{ $ns }}
spec:
  modelConfig:
    name: {{ $modelConfig }}
  description: {{ $specialist.description | quote }}
  tools:
    {{- toYaml $tools | nindent 4 }}
{{- end }}
---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: {{ $agent.name }}
  namespace: {{ $ns }}
spec:
  modelConfig:
    name: {{ $modelConfig }}
  description: {{ $agent.description | quote }}
  tools:
    {{- toYaml $bindings | nindent 4 }}
---
apiVersion: api.kagent.dev/v1alpha3
kind: EgressPolicy
metadata:
  name: {{ $agent.name }}-gateway
  namespace: {{ $ns }}
spec:
  destinations:
    - origin: {{ $gatewayUrl }}:{{ $agent.port }}
---
apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: {{ $agent.name }}
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  kagent: {}
  workload:
    image: {{ $runtimeImage }}
    command: [/app/agent-runtime]
  env:
    - name: AGENT_POLICY
      value: {{ include "llm-platform.agentPolicy" (dict "root" $ "agent" $agent) | quote }}
    - name: LANGFUSE_HOST
      value: {{ $langfuseOrigin }}
    - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
      value: {{ $langfuseOrigin }}/api/public/otel/v1/traces
    - name: OTEL_EXPORTER_OTLP_TRACES_PROTOCOL
      value: http/protobuf
    - name: OTEL_EXPORTER_OTLP_TRACES_HEADERS
      value: Authorization=placeholder,x-langfuse-ingestion-version=4
    - name: OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT
      value: SPAN_ONLY
    - name: OTEL_LOGS_EXPORTER
      value: none
    - name: OTEL_METRICS_EXPORTER
      value: none
  substrate:
    workerPoolRef:
      name: {{ $pool.name }}
    snapshotPolicy:
      location: {{ $agents.snapshotRoot }}
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: {{ $agent.name }}
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/version: {{ $agent.version | quote }}
spec:
  template:
    ref:
      name: {{ $agent.name }}
  harnessRef:
    name: {{ $agent.name }}
  egressPolicyRefs:
    - name: langfuse
    - name: {{ $agent.name }}-gateway
{{- end }}
