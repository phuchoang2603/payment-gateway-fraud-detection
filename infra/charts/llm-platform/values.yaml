global:
  imageTags:
    ghcr.io/phuchoang2603/payment-gateway-fraud-detection/inference-perf: dev

gpu:
  deviceClassName: gpu.nvidia.com
  nodeSelector: {}
  tolerations: []

storage:
  storageClass: local-path
  modelCache: 40Gi
  compileCache: 5Gi

vllm:
  image: vllm/vllm-openai:v0.32.0
  uid: 1000

models:
  chat:
    name: qwen3-8b
    repo: Qwen/Qwen3-8B-FP8
    revision: 220b46e3b2180893580a4454f21f22d3ebb187d3
    replicas: 1
    stopped: false
    # KServe's start script evals these, so JSON values stay single-quoted inside the string.
    args:
      - --max-model-len=16384
      - --gpu-memory-utilization=0.80
      - --reasoning-parser=qwen3
      - --default-chat-template-kwargs='{"enable_thinking":false}'
      - --enable-auto-tool-choice
      - --tool-call-parser=hermes
    resources:
      requests: {cpu: "1", memory: 8Gi}
      limits: {memory: 12Gi}
  embedding:
    name: qwen3-embedding
    repo: Qwen/Qwen3-Embedding-0.6B
    revision: 97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3
    replicas: 1
    args:
      - --runner=pooling
      - --max-model-len=8192
      - --gpu-memory-utilization=0.12
    resources:
      requests: {cpu: 250m, memory: 2Gi}
      limits: {memory: 4Gi}
  # Downloaded with the served models so the benchmark can compare weights without a new fill.
  extraDownloads:
    - repo: Qwen/Qwen3-8B-AWQ
      revision: 4da05a8edb55c6046cce958586c33b61da07bb79

gateway:
  name: agentgateway
  className: agentgateway
  keyLabel: llm.fraud-detection.dev/gateway-key
  clients:
    agents: LLM_GATEWAY_AGENTS_API_KEY
    benchmark: LLM_GATEWAY_BENCHMARK_API_KEY
  limits:
    requestsPerMinute: 120
    burst: 20
    tokensPerMinute: 60000
  # Card numbers with spaces or dashes that the CreditCard built-in does not match.
  piiPatterns:
    - '\b(?:\d[ -]?){12,18}\d\b'
  # Callers outside ml that may reach the gateway: Substrate workers run sandboxed agent actors.
  externalClients:
    - cluster.local/ns/kagent/sa/default

secretStore: gateway-doppler

agents:
  serviceAccount: llm-agents
  modelConfig: default-model-config
  uid: 65532
  sandbox:
    snapshotRoot: gs://platform-dev/substrate/ml
  list:
    - name: evidence-agent
      version: 0.1.0
      title: Evidence agent
      description: Read-only fraud-analyst agent that explains one payment from recorded evidence. Phase 1 has no tools.
      systemMessage: |
        You are a read-only fraud analyst assistant for a synthetic payment gateway.
        You explain payments and payment attempts to fraud analysts.
        You cannot change risk decisions, retry payments, issue refunds or promote models, and you never
        take part in a live payment decision.
        You do not yet have tools to read payment events, features, labels or model scores. When asked
        about a specific payment or attempt, say that you cannot retrieve its evidence yet and do not
        invent identifiers, amounts, timestamps, scores or outcomes.
        Labels that arrived after a decision were not available to that decision; never present them as
        information the decision had.

registry:
  url: http://agentregistry.agentregistry.svc:12121
  repository: https://github.com/phuchoang2603/payment-gateway-fraud-detection
  curlImage: curlimages/curl:8.17.0

benchmark:
  image:
    repository: ghcr.io/phuchoang2603/payment-gateway-fraud-detection/inference-perf
  # A run renders only when `run` is set: helm template ... --set benchmark.run=<name> | kubectl apply -f -
  run: ""
  # gateway: through agentgateway; direct: the chat server; variant: the standalone variant server below.
  target: direct
  tokenizer: Qwen/Qwen3-8B
  workload:
    groups: 3
    promptsPerGroup: 16
    systemPromptTokens: 1500
    questionTokens: 100
    outputTokens: 150
    stages:
      - {concurrency: 1, requests: 12}
      - {concurrency: 2, requests: 16}
      - {concurrency: 4, requests: 32}
      - {concurrency: 8, requests: 64}
      - {concurrency: 16, requests: 96}
  # Standalone chat server for model-server variants while models.chat.stopped is true.
  variant:
    name: ""
    repo: Qwen/Qwen3-8B-FP8
    args: []
    compileCache: true
  storage:
    secretStore: gateway-doppler
    bucket: platform-dev
    endpoint: https://minio.home.phuchoang.sbs
    prefix: runs/payment-gateway/llm-benchmark
