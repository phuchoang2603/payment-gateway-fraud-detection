enabled: false
namespace: fraud-data-prod
secretStoreName: fraud-doppler
images:
  spark: ""
  metadata: ""
spark:
  executors: 2
  shufflePartitions: 4
config:
  SOURCE_ROOT: s3://synthetic-source/historical/v11
  DATASET_VERSION: v11
  EVIDENCE_ROOT: s3://fraud-lakehouse-prod/dp1-evidence
  ICEBERG_REST_URI: https://minio.home.phuchoang.sbs/iceberg
  ICEBERG_WAREHOUSE: fraud-lakehouse-prod
  ICEBERG_SIGV4_ENABLED: "true"
  ICEBERG_SIGNING_NAME: s3
  S3_ENDPOINT: https://minio.home.phuchoang.sbs
  AWS_REGION: us-east-1
  OPENMETADATA_URL: http://openmetadata.openmetadata.svc.cluster.local:8585/api
secrets:
  lake:
    SOURCE_ACCESS_KEY_ID: DP1_LAKE_RUSTFS_ACCESS_KEY
    SOURCE_SECRET_ACCESS_KEY: DP1_LAKE_RUSTFS_SECRET_KEY
    LAKE_ACCESS_KEY_ID: DP1_LAKE_RUSTFS_ACCESS_KEY
    LAKE_SECRET_ACCESS_KEY: DP1_LAKE_RUSTFS_SECRET_KEY
  metadata:
    OPENMETADATA_TOKEN: DP1_OPENMETADATA_TOKEN
    CATALOG_ACCESS_KEY_ID: DP1_METADATA_RUSTFS_ACCESS_KEY
    CATALOG_SECRET_ACCESS_KEY: DP1_METADATA_RUSTFS_SECRET_KEY
