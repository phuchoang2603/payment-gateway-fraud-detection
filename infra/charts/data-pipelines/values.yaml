enabled: false
namespace: fraud-data-prod
images:
  spark: ""
  openmetadata: ""
workflow:
  activeDeadlineSeconds: 7200
spark:
  activeDeadlineSeconds: 2400
  executors: 2
  shufflePartitions: 1024
native:
  activeDeadlineSeconds: 1800
config:
  SOURCE_ROOT: s3://synthetic-source/historical/v11
  DATASET_VERSION: v11
  EVIDENCE_ROOT: s3://fraud-lakehouse-prod/dp1-evidence/starrocks-v1
  ICEBERG_REST_URI: https://minio.home.phuchoang.sbs/iceberg
  ICEBERG_WAREHOUSE: fraud-lakehouse-prod
  ICEBERG_SIGV4_ENABLED: "true"
  ICEBERG_SIGNING_NAME: s3
  S3_ENDPOINT: https://minio.home.phuchoang.sbs
  AWS_REGION: us-east-1
  OPENMETADATA_URL: http://openmetadata.openmetadata.svc.cluster.local:8585/api
externalSecrets:
  - name: lakehouse-rustfs
    store: fraud-doppler
    data:
      AWS_ACCESS_KEY_ID: LAKEHOUSE_RUSTFS_ACCESS_KEY
      AWS_SECRET_ACCESS_KEY: LAKEHOUSE_RUSTFS_SECRET_KEY
  - name: openmetadata
    store: fraud-doppler
    data:
      OPENMETADATA_TOKEN: OPENMETADATA_TOKEN
    template:
      OPENMETADATA_TOKEN: "{{ .OPENMETADATA_TOKEN }}"
      authorization: "Bearer {{ .OPENMETADATA_TOKEN }}"
  - name: dp1-starrocks
    store: doppler
    data:
      STARROCKS_PASSWORD: STARROCKS_OPENMETADATA_PASSWORD
