apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: historical-dp1-bronze
  namespace: __NAMESPACE__
spec:
  serviceAccountName: dp1-workflow
  entrypoint: historical
  arguments:
    parameters:
      - {name: source-root, value: __SOURCE_ROOT__}
      - {name: dataset-version, value: __DATASET_VERSION__}
      - {name: openmetadata-url, value: __OPENMETADATA_URL__}
  onExit: finalizer
  activeDeadlineSeconds: __WORKFLOW_DEADLINE__
  synchronization:
    mutexes:
      - name: bronze-payments-writer
  podMetadata:
    labels:
      dp1-product: bronze-payments
  podGC:
    strategy: OnWorkflowSuccess
  templates:
    - name: historical
      steps:
        - - name: recover-previous
            template: recover-previous
        - - name: preflight
            template: python
            arguments:
              parameters:
                - {name: stage, value: preflight}
        - - name: ingest
            template: spark
        - - name: prepare
            template: prepare
        - - name: discover
            template: openmetadata
            arguments:
              parameters:
                - {name: command, value: ingest}
                - {name: config, value: "{{steps.prepare.outputs.parameters.metadata}}"}
        - - name: test-events
            template: openmetadata
            arguments:
              parameters:
                - {name: command, value: test}
                - {name: config, value: "{{steps.prepare.outputs.parameters.payment-events}}"}
          - name: test-labels
            template: openmetadata
            arguments:
              parameters:
                - {name: command, value: test}
                - {name: config, value: "{{steps.prepare.outputs.parameters.fraud-labels}}"}
        - - name: profile
            template: openmetadata
            arguments:
              parameters:
                - {name: command, value: profile}
                - {name: config, value: "{{steps.prepare.outputs.parameters.profiler}}"}
        - - name: govern
            template: govern-and-accept
    - name: govern-and-accept
      steps:
        - - name: events-table
            template: openmetadata-get
            arguments:
              parameters:
                - {name: path, value: "/v1/tables/name/starrocks.lakehouse.bronze.raw_payment_events"}
          - name: labels-table
            template: openmetadata-get
            arguments:
              parameters:
                - {name: path, value: "/v1/tables/name/starrocks.lakehouse.bronze.raw_fraud_labels"}
          - name: pipeline-service
            template: openmetadata-write
            arguments:
              parameters:
                - {name: method, value: PUT}
                - {name: path, value: /v1/services/pipelineServices}
                - {name: body, value: '{"name": "argo", "serviceType": "CustomPipeline"}'}
        - - name: pipeline
            template: openmetadata-write
            arguments:
              parameters:
                - {name: method, value: PUT}
                - {name: path, value: /v1/pipelines}
                - name: body
                  value: '{"name": "historical-dp1-bronze", "displayName": "Historical DP1 bronze", "service": "argo", "description": "Argo workflow {{workflow.name}}"}'
        - - name: requests
            template: python
            arguments:
              parameters:
                - {name: stage, value: governance}
                - name: table-ids
                  value: '{"payment_events": "{{=jsonpath(steps["events-table"].outputs.result, "$.id")}}", "fraud_labels": "{{=jsonpath(steps["labels-table"].outputs.result, "$.id")}}", "pipeline": "{{=jsonpath(steps.pipeline.outputs.result, "$.id")}}"}'
        - - name: write
            template: write-in-order
            arguments:
              parameters:
                - {name: requests, value: "{{steps.requests.outputs.result}}"}
        - - name: accept
            template: python
            arguments:
              parameters:
                - {name: stage, value: accept}
    - name: write-in-order
      inputs:
        parameters:
          - name: requests
      steps:
__GOVERNANCE_WRITES__
    - name: prepare
      container:
        image: __SPARK_IMAGE__
        command: [dp1]
        args: [prepare]
        envFrom:
          - configMapRef: {name: dp1-config}
          - secretRef: {name: lakehouse-rustfs}
        env:
          - {name: SOURCE_ROOT, value: "{{workflow.parameters.source-root}}"}
          - {name: DATASET_VERSION, value: "{{workflow.parameters.dataset-version}}"}
          - {name: WORKFLOW_ID, value: "{{workflow.name}}"}
        resources:
          requests: {cpu: 100m, memory: 512Mi}
          limits: {cpu: "1", memory: 1Gi}
      outputs:
        parameters:
          - name: metadata
            valueFrom: {path: /tmp/out/metadata.json}
          - name: profiler
            valueFrom: {path: /tmp/out/profiler.json}
          - name: payment-events
            valueFrom: {path: /tmp/out/payment_events.json}
          - name: fraud-labels
            valueFrom: {path: /tmp/out/fraud_labels.json}
    - name: spark
      retryStrategy:
        limit: "2"
        retryPolicy: OnFailure
        backoff:
          duration: 15s
          factor: 2
          cap: 2m
      steps:
        - - name: prepare-creators
            template: delete-pods
            arguments:
              parameters:
                - name: selector
                  value: "workflows.argoproj.io/workflow={{workflow.name}},dp1-application-stage=ingest"
        - - name: prepare
            template: cleanup-spark
            arguments:
              parameters:
                - {name: selector, value: "dp1-workflow={{workflow.name}},dp1-stage=ingest"}
        - - name: application
            template: spark-application
            continueOn: {failed: true, error: true}
            arguments:
              parameters:
                - {name: attempt, value: "{{retries}}"}
        - - name: cleanup
            template: cleanup-spark
            arguments:
              parameters:
                - {name: selector, value: "dp1-workflow={{workflow.name}},dp1-stage=ingest"}
        - - name: outcome
            template: spark-outcome
            arguments:
              parameters:
                - {name: status, value: "{{steps.application.status}}"}
    - name: spark-application
      metadata:
        labels:
          dp1-application-stage: "ingest"
      inputs:
        parameters:
          - name: attempt
      activeDeadlineSeconds: __SPARK_DEADLINE__
      retryStrategy:
        limit: "6"
        retryPolicy: OnFailure
        backoff: {duration: 30s, factor: 2, cap: 4m}
      resource:
        action: apply
        setOwnerReference: true
        successCondition: status.currentState.currentStateSummary == ResourceReleased
        failureCondition: status.currentState.currentStateSummary == TerminatedWithoutReleaseResources
        manifest: |
          apiVersion: spark.apache.org/v1
          kind: SparkApplication
          metadata:
            name: dp1-{{workflow.uid}}-ingest-{{inputs.parameters.attempt}}
            namespace: __NAMESPACE__
            labels:
              dp1-product: bronze-payments
              dp1-workflow: "{{workflow.name}}"
              dp1-stage: "ingest"
          spec:
            pyFiles: local:///opt/data-pipeline/bronze-ingestion/.venv/lib/python3.12/site-packages/data_platform/cli.py
            driverArgs: ["ingest"]
            runtimeVersions:
              sparkVersion: "4.1.3"
            sparkConf:
              spark.kubernetes.container.image: __SPARK_IMAGE__
              spark.kubernetes.authenticate.driver.serviceAccountName: dp1-spark
              spark.driver.memory: 2g
              spark.driver.memoryOverhead: 512m
              spark.kubernetes.driver.request.cores: 500m
              spark.kubernetes.driver.limit.cores: "2"
              spark.executor.instances: "__EXECUTORS__"
              spark.executor.cores: "1"
              spark.kubernetes.executor.request.cores: 500m
              spark.executor.memory: 2g
              spark.executor.memoryOverhead: 1g
              spark.driver.extraJavaOptions: -Dlog4j.configurationFile=file:/opt/dp1/log4j2.properties
              spark.executor.extraJavaOptions: -Dlog4j.configurationFile=file:/opt/dp1/log4j2.properties
              spark.kubernetes.executor.deleteOnTermination: "true"
              spark.sql.shuffle.partitions: "__SHUFFLE_PARTITIONS__"
              spark.pyspark.python: /opt/data-pipeline/bronze-ingestion/.venv/bin/python
            applicationTolerations:
              restartConfig:
                restartPolicy: Never
              resourceRetainPolicy: OnFailure
              resourceRetainDurationMillis: 300000
              ttlAfterStopMillis: 3600000
            driverSpec:
              podTemplateSpec:
                metadata:
                  labels:
                    dp1-product: bronze-payments
                    dp1-workflow: "{{workflow.name}}"
                    dp1-stage: "ingest"
                spec:
                  activeDeadlineSeconds: __SPARK_DEADLINE__
                  terminationGracePeriodSeconds: 30
                  containers:
                    - name: spark-kubernetes-driver
                      envFrom:
                        - configMapRef: {name: dp1-config}
                        - secretRef: {name: lakehouse-rustfs}
                      env:
                        - {name: SOURCE_ROOT, value: "{{workflow.parameters.source-root}}"}
                        - {name: DATASET_VERSION, value: "{{workflow.parameters.dataset-version}}"}
                        - {name: SPARK_SHUFFLE_PARTITIONS, value: "__SHUFFLE_PARTITIONS__"}
                        - {name: IMAGE_DIGEST, value: __SPARK_IMAGE__}
                        - {name: WORKFLOW_ID, value: "{{workflow.name}}"}
                        - {name: SPARK_APPLICATION_NAME, value: "dp1-{{workflow.uid}}-ingest-{{inputs.parameters.attempt}}"}
            executorSpec:
              podTemplateSpec:
                metadata:
                  labels:
                    dp1-product: bronze-payments
                    dp1-workflow: "{{workflow.name}}"
                    dp1-stage: "ingest"
                spec:
                  terminationGracePeriodSeconds: 30
                  containers:
                    - name: spark-kubernetes-executor
                      envFrom:
                        - configMapRef: {name: dp1-config}
                        - secretRef: {name: lakehouse-rustfs}
    - name: recover-previous
      steps:
        - - name: workflow-pods
            template: delete-pods
            arguments:
              parameters:
                - name: selector
                  value: "dp1-product=bronze-payments,workflows.argoproj.io/workflow,workflows.argoproj.io/workflow!={{workflow.name}}"
        - - name: spark
            template: cleanup-spark
            arguments:
              parameters:
                - name: selector
                  value: "dp1-product=bronze-payments,dp1-workflow,dp1-workflow!={{workflow.name}}"
    - name: cleanup-spark
      inputs:
        parameters:
          - name: selector
      steps:
        - - name: applications
            template: delete-spark-applications
            arguments:
              parameters:
                - {name: selector, value: "{{inputs.parameters.selector}}"}
        - - name: pods
            template: delete-pods
            arguments:
              parameters:
                - {name: selector, value: "{{inputs.parameters.selector}}"}
    - name: delete-spark-applications
      inputs:
        parameters:
          - name: selector
      activeDeadlineSeconds: 180
      resource:
        action: delete
        flags:
          - sparkapplications.spark.apache.org
          - --namespace=__NAMESPACE__
          - --selector={{inputs.parameters.selector}}
          - --cascade=foreground
          - --wait=true
          - --timeout=120s
    - name: delete-pods
      inputs:
        parameters:
          - name: selector
      activeDeadlineSeconds: 180
      resource:
        action: delete
        flags:
          - pods
          - --namespace=__NAMESPACE__
          - --selector={{inputs.parameters.selector}}
          - --cascade=foreground
          - --wait=true
          - --timeout=120s
    - name: spark-outcome
      inputs:
        parameters:
          - name: status
      container:
        image: __SPARK_IMAGE__
        command: [python, -c]
        args: ["import sys; sys.exit(0 if sys.argv[1] == 'Succeeded' else 1)", "{{inputs.parameters.status}}"]
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: "1", memory: 256Mi}
    - name: python
      inputs:
        parameters:
          - name: stage
          - {name: table-ids, value: "{}"}
      activeDeadlineSeconds: 900
      retryStrategy:
        limit: "2"
        backoff: {duration: 10s, factor: 2, maxDuration: 1m}
      container:
        image: __SPARK_IMAGE__
        command: [dp1]
        args: ["{{inputs.parameters.stage}}"]
        envFrom:
          - configMapRef: {name: dp1-config}
          - secretRef: {name: lakehouse-rustfs}
          - secretRef: {name: openmetadata}
        env:
          - {name: SOURCE_ROOT, value: "{{workflow.parameters.source-root}}"}
          - {name: DATASET_VERSION, value: "{{workflow.parameters.dataset-version}}"}
          - {name: IMAGE_DIGEST, value: __SPARK_IMAGE__}
          - {name: WORKFLOW_ID, value: "{{workflow.name}}"}
          - {name: TABLE_IDS, value: "{{inputs.parameters.table-ids}}"}
        resources:
          requests: {cpu: 100m, memory: 512Mi}
          limits: {cpu: "1", memory: 1Gi}
    - name: openmetadata
      inputs:
        parameters:
          - name: command
          - name: config
      activeDeadlineSeconds: __NATIVE_DEADLINE__
      retryStrategy:
        limit: "1"
        backoff: {duration: 15s, factor: 2}
      container:
        image: __OPENMETADATA_IMAGE__
        command: [bash, -c]
        args:
          - python3 -c 'import os,sys;sys.stdout.write(os.path.expandvars(os.environ["CONFIG"]))' > /tmp/workflow.yaml && metadata "$COMMAND" -c /tmp/workflow.yaml
        envFrom:
          - configMapRef: {name: dp1-config}
          - secretRef: {name: openmetadata}
          - secretRef: {name: dp1-starrocks}
        env:
          - {name: COMMAND, value: "{{inputs.parameters.command}}"}
          - {name: CONFIG, value: "{{inputs.parameters.config}}"}
        resources:
          requests: {cpu: 250m, memory: 1Gi}
          limits: {cpu: "2", memory: 2Gi}
    - name: openmetadata-get
      inputs:
        parameters:
          - name: path
      retryStrategy:
        limit: "3"
        backoff: {duration: 5s, factor: 2, maxDuration: 1m}
      http:
        url: "{{workflow.parameters.openmetadata-url}}{{inputs.parameters.path}}"
        method: GET
        timeoutSeconds: 60
        successCondition: response.statusCode == 200
        headers:
          - name: Authorization
            valueFrom: {secretKeyRef: {name: openmetadata, key: authorization}}
    - name: openmetadata-write
      inputs:
        parameters:
          - name: method
          - name: path
          - name: body
      retryStrategy:
        limit: "3"
        backoff: {duration: 5s, factor: 2, maxDuration: 1m}
      http:
        url: "{{workflow.parameters.openmetadata-url}}{{inputs.parameters.path}}"
        method: "{{inputs.parameters.method}}"
        timeoutSeconds: 60
        successCondition: response.statusCode >= 200 && response.statusCode < 300
        headers:
          - name: Authorization
            valueFrom: {secretKeyRef: {name: openmetadata, key: authorization}}
          - name: Content-Type
            value: "{{=inputs.parameters.method == 'PATCH' ? 'application/json-patch+json' : 'application/json'}}"
        body: "{{inputs.parameters.body}}"
    - name: finalizer
      steps:
        - - name: cleanup
            template: cleanup-spark
            arguments:
              parameters:
                - {name: selector, value: "dp1-workflow={{workflow.name}}"}
