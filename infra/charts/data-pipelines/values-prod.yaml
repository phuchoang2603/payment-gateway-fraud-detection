enabled: true
generator:
  config: historical-full.yaml
  shards: 12
  workers: 3
  retryLimit: 10
  # One shard per aws-cpu-burst spot xlarge (pool limit 12 nodes / 48 vCPU). Dev v18 measured about 115 purchases/s per
  # worker before the world-table change; v19 is about 190M purchases, so 36 workers need several hours.
  activeDeadlineSeconds: 64800
  nodeSelector:
    karpenter.sh/nodepool: aws-cpu-burst
    karpenter.sh/capacity-type: spot
  resources:
    requests:
      cpu: "3"
      memory: 8Gi
      ephemeral-storage: 10Gi
    limits:
      cpu: "3500m"
      memory: 12Gi
      ephemeral-storage: 20Gi
config:
  S3_ENDPOINT: https://s3.us-east-1.amazonaws.com
  S3_PATH_STYLE: 'false'
# Workflow step pods stay off spot nodes: a reclaimed resource-step pod makes Argo submit a second SparkApplication.
workflowNodeSelector:
  karpenter.sh/nodepool: aws-workers
spark:
  # Spark pods share the generator's spot burst pool. Its 12-node limit means a Spark run and a generator run cannot both
  # hold their full node counts, so run them one after the other.
  nodeSelector:
    karpenter.sh/nodepool: aws-cpu-burst
    karpenter.sh/capacity-type: spot
  # A spot reclaim of the driver's node restarts the whole application, so drivers run on the on-demand baseline
  # pool, which has about 5.8 GiB and 1 vCPU free on one node.
  driverNodeSelector:
    karpenter.sh/nodepool: aws-workers
  retry:
    limit: 10
    policy: Always
  # aws-cpu-burst allows only large and xlarge (12 nodes, 48 vCPU, 192 GiB). An xlarge leaves 3270m / 13217Mi for pods
  # after Talos reservations and DaemonSets, so a 4-core executor does not fit: 11 executors of 3 cores, one per xlarge,
  # each 9g + 3g (5 GiB executors on 8 GiB c-family nodes were OOM-killed in the Iceberg write; DP2's Python workers
  # hold the broadcast duplicate keys in overhead memory), spreading shuffle over 24Gi of ephemeral storage, the
  # practical limit of the 40Gi root volume. The driver runs on the on-demand pool at 4g + 1.5g: it collects DP2's
  # duplicated-ID keys as a sorted array rather than a broadcast hash relation. Twelve 16 GiB nodes are the memory
  # limit, so 32 GiB r-family spot nodes leave executors pending. Shuffle partitions stay at 1024 rather than 3-4x the
  # 33 cores: v19 shuffles reach hundreds of GB, and AQE coalesces small partitions up to the 128 MB advisory size.
  profiles:
    large:
      shufflePartitions: 1024
      # DP2's Python processes hold the broadcast duplicate keys (about 160 MB each), and that memory counts against
      # memoryOverhead, not the JVM heap; 1g and 2g overheads were OOM-killed.
      driver:
        requestCores: 500m
        memory: 4g
        memoryOverhead: 1536m
        maxResultSize: 2g
      executor:
        memory: 9g
        memoryOverhead: 3g
bronze:
  enabled: true
  datasetVersion: v19
  historicalRoot: s3://platform-prod-142737101504-us-east-1/datasets/payment-gateway/historical/v19
  reportRoot: s3://platform-prod-142737101504-us-east-1/runs/payment-gateway/dp1
  historicalProfile: large
  activeDeadlineSeconds: 14400
silver:
  enabled: true
  profile: large
  # v19 has about 20M duplicated IDs (about 160 MB as a sorted int64 array), so duplicates are flagged map-side and the
  # events keep their Bronze layout instead of shuffling by event_id.
  dedupBroadcastBytes: 1073741824
  reportRoot: s3://platform-prod-142737101504-us-east-1/runs/payment-gateway/dp2
  activeDeadlineSeconds: 14400
analytics:
  enabled: true
  profile: large
  reportRoot: s3://platform-prod-142737101504-us-east-1/runs/payment-gateway/analytics
maintenance:
  enabled: true
  profile: large
  reportRoot: s3://platform-prod-142737101504-us-east-1/runs/payment-gateway/maintenance
sparkEventLogDir: s3a://platform-prod-142737101504-us-east-1/runs/payment-gateway/spark-events/
catalog:
  connectors:
    object-storage:
      source:
        serviceConnection:
          config:
            awsConfig:
              endPointURL: https://s3.us-east-1.amazonaws.com
            bucketNames:
              - platform-prod-142737101504-us-east-1
checks:
  # The v19 Bronze event suite took about 1490 s against the 1500 s default; Silver has more rules on similar volume.
  nativeTimeoutSeconds: 4800
