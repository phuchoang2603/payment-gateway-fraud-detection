enabled: true
generator:
  config: historical-full.yaml
  shards: 12
  workers: 3
  retryLimit: 10
  # One shard per aws-cpu-burst spot xlarge (pool limit 12 nodes / 48 vCPU). Dev v18 measured about 115 purchases/s per
  # worker before the world-table change; v19 is about 190M purchases, so 36 workers need several hours.
  activeDeadlineSeconds: 64800
  nodeSelector:
    karpenter.sh/nodepool: aws-cpu-burst
    karpenter.sh/capacity-type: spot
  resources:
    requests:
      cpu: "3"
      memory: 8Gi
      ephemeral-storage: 10Gi
    limits:
      cpu: "3500m"
      memory: 12Gi
      ephemeral-storage: 20Gi
config:
  S3_ENDPOINT: https://s3.us-east-1.amazonaws.com
  S3_PATH_STYLE: 'false'
spark:
  # Spark pods share the generator's spot burst pool. Its 12-node limit means a Spark run and a generator run cannot both
  # hold their full node counts, so run them one after the other.
  nodeSelector:
    karpenter.sh/nodepool: aws-cpu-burst
    karpenter.sh/capacity-type: spot
  retry:
    limit: 10
    policy: Always
  # aws-cpu-burst allows only large and xlarge (12 nodes, 48 vCPU, 192 GiB). An xlarge leaves 3270m for pods after
  # Talos reservations and DaemonSets, so a 4-core executor does not fit: 11 executors of 3 cores, one per xlarge, and
  # the 1-core 4g + 1g driver on a large. Shuffle disk binds first: the v19 Bronze write shuffles about 217 GB into
  # 24Gi of ephemeral storage per executor (the practical limit of the 40Gi root volume), which fits only with all 11
  # executors. Executors request 10g + 2g of the 13217Mi free on a 16 GiB xlarge: 5 GiB executors, which fit the 8 GiB
  # c-family, were OOM-killed in the Iceberg write. 32 GiB r-family spot nodes can exhaust the 192 GiB limit before 12
  # nodes. The batch session sets spark.sql.shuffle.partitions from SPARK_SHUFFLE_PARTITIONS (default 1024), which
  # overrides this value.
  profiles:
    large:
      shufflePartitions: 1024
      executor:
        memory: 10g
bronze:
  enabled: true
  datasetVersion: v19
  historicalRoot: s3://platform-prod-142737101504-us-east-1/datasets/payment-gateway/historical/v19
  reportRoot: s3://platform-prod-142737101504-us-east-1/runs/payment-gateway/dp1
  historicalProfile: large
silver:
  enabled: true
  profile: large
  reportRoot: s3://platform-prod-142737101504-us-east-1/runs/payment-gateway/dp2
analytics:
  enabled: true
  profile: large
  reportRoot: s3://platform-prod-142737101504-us-east-1/runs/payment-gateway/analytics
maintenance:
  enabled: true
  profile: large
  reportRoot: s3://platform-prod-142737101504-us-east-1/runs/payment-gateway/maintenance
sparkEventLogDir: s3a://platform-prod-142737101504-us-east-1/runs/payment-gateway/spark-events/
catalog:
  connectors:
    object-storage:
      source:
        serviceConnection:
          config:
            awsConfig:
              endPointURL: https://s3.us-east-1.amazonaws.com
            bucketNames:
              - platform-prod-142737101504-us-east-1
