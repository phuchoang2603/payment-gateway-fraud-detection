enabled: true
generator:
  config: historical-full.yaml
  shards: 12
  workers: 3
  retryLimit: 10
  activeDeadlineSeconds: 64800
  nodeSelector:
    karpenter.sh/nodepool: aws-cpu-burst
    karpenter.sh/capacity-type: spot
  resources:
    requests:
      cpu: '3'
      memory: 8Gi
      ephemeral-storage: 10Gi
    limits:
      cpu: 3500m
      memory: 12Gi
      ephemeral-storage: 20Gi
config:
  S3_ENDPOINT: https://s3.us-east-1.amazonaws.com
  S3_PATH_STYLE: 'false'
workflowNodeSelector:
  karpenter.sh/nodepool: aws-workers
spark:
  nodeSelector:
    karpenter.sh/nodepool: aws-cpu-burst
    karpenter.sh/capacity-type: spot
  driverNodeSelector:
    karpenter.sh/nodepool: aws-workers
  retry:
    limit: 10
    policy: Always
  profiles:
    large:
      shufflePartitions: 1024
      driver:
        requestCores: 500m
        memory: 4g
        memoryOverhead: 1536m
        maxResultSize: 2g
      executor:
        memory: 9g
        memoryOverhead: 3g
    gold:
      executors: 11
      shufflePartitions: 1024
      advisoryPartitionSize: 128m
      driver:
        cores: 1
        requestCores: 500m
        memory: 2g
        memoryOverhead: 1536m
        ephemeralStorage: 8Gi
      executor:
        cores: 3
        memory: 9g
        memoryOverhead: 3g
        ephemeralStorage: 24Gi
bronze:
  enabled: true
  datasetVersion: v19
  historicalRoot: s3://platform-prod-142737101504-us-east-1/datasets/payment-gateway/historical/v19
  reportRoot: s3://platform-prod-142737101504-us-east-1/runs/payment-gateway/dp1
  historicalProfile: large
  activeDeadlineSeconds: 14400
analytics:
  enabled: true
  profile: large
  reportRoot: s3://platform-prod-142737101504-us-east-1/runs/payment-gateway/analytics
maintenance:
  enabled: true
  profile: large
  reportRoot: s3://platform-prod-142737101504-us-east-1/runs/payment-gateway/maintenance
pipeline:
  enabled: true
  profile: gold
  reportRoot: s3://platform-prod-142737101504-us-east-1/runs/payment-gateway/pipeline
warehouseBenchmark:
  enabled: true
  reportRoot: s3://platform-prod-142737101504-us-east-1/runs/payment-gateway/warehouse-benchmark
dashboards:
  enabled: true
sparkEventLogDir: s3a://platform-prod-142737101504-us-east-1/runs/payment-gateway/spark-events/
catalog:
  connectors:
    object-storage:
      source:
        serviceConnection:
          config:
            awsConfig:
              endPointURL: https://s3.us-east-1.amazonaws.com
            bucketNames:
            - platform-prod-142737101504-us-east-1
    flink:
      source:
        serviceConnection:
          config:
            hostPort: http://fraud-streaming-live-v19-rest.data.svc.cluster.local:8081
checks:
  nativeTimeoutSeconds: 4800
featureStore:
  enabled: true
  registry: s3://platform-prod-142737101504-us-east-1/feast/payment-gateway/registry.pb
  reportRoot: s3://platform-prod-142737101504-us-east-1/runs/payment-gateway/feast
  epochs: history-v19,live-v19
  epoch: live-v19
  historyEpoch: history-v19
  checkpointRoot: s3://platform-prod-142737101504-us-east-1/runs/payment-gateway/flink/history
  replicationFactor: 3
  historyStart: "2026-07-29"
  historyEnd: "2026-10-29"
