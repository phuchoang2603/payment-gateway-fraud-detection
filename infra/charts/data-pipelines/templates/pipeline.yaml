{{- if .Values.pipeline.enabled }}
{{- $sizing := index .Values.spark.profiles .Values.pipeline.profile }}
{{- $report := printf "%s/%s/gold.json" .Values.pipeline.reportRoot "{{workflow.name}}" }}
{{- $range := list (dict "name" "DP_START" "value" "{{inputs.parameters.start}}") (dict "name" "DP_END" "value" "{{inputs.parameters.end}}") (dict "name" "DP_LOOKBACK_DAYS" "value" (toString .Values.pipeline.lookbackDays)) (dict "name" "RUN_ID" "value" "{{workflow.name}}") (dict "name" "RUN_REPORT_ROOT" "value" .Values.pipeline.reportRoot) (dict "name" "DP_CODE_VERSION" "value" (include "data-pipelines.codeVersion" .)) }}
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: dp-pipeline
  namespace: {{ .Values.namespace }}
spec:
  serviceAccountName: data-pipelines
  {{- include "data-pipelines.workflowPlacement" $ | nindent 2 }}
  entrypoint: run
  onExit: publish
  arguments:
    parameters:
      - name: start
        value: ""
      - name: end
        value: ""
  activeDeadlineSeconds: {{ .Values.pipeline.activeDeadlineSeconds }}
  podMetadata:
    annotations:
      cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    labels:
      {{- include "data-pipelines.kafkaClientLabels" $ | nindent 6 }}
  templates:
    - name: run
      steps:
        - - name: pipeline
            template: pipeline
            arguments:
              parameters:
                - name: start
                  value: "{{ "{{workflow.parameters.start}}" }}"
                - name: end
                  value: "{{ "{{workflow.parameters.end}}" }}"
    # Silver, Gold and the marts for one range of UTC days, on one write-audit-publish branch. The mutex sits on this
    # template so the daily run and every backfill month serialize, wherever they reference it.
    - name: pipeline
      synchronization:
        mutexes:
          - name: dp-writer
      inputs:
        parameters:
          - name: start
          - name: end
      dag:
        tasks:
          # A stage is skipped when every table it writes already holds, at the head of main, this range's output from
          # the same inputs by the same code (openmetadata.plan, batch.gold.marts plan): a re-run resumes where it failed.
          - name: plan-silver
            template: plan-silver
            arguments:
              parameters:
                - name: start
                  value: "{{ "{{inputs.parameters.start}}" }}"
                - name: end
                  value: "{{ "{{inputs.parameters.end}}" }}"
          - name: silver
            template: silver
            depends: plan-silver
            when: "{{ "{{tasks.plan-silver.outputs.parameters.decision}}" }} == run"
            arguments:
              parameters:
                - name: start
                  value: "{{ "{{inputs.parameters.start}}" }}"
                - name: end
                  value: "{{ "{{inputs.parameters.end}}" }}"
          # Write-audit-publish per layer: Silver is audited and published before Gold and the marts read it.
          - name: check-silver
            template: check-silver
            depends: silver
            when: "{{ "{{tasks.plan-silver.outputs.parameters.decision}}" }} == run"
          - name: publish-silver
            template: publish-silver
            depends: check-silver
            when: "{{ "{{tasks.plan-silver.outputs.parameters.decision}}" }} == run"
          # Gold and the marts both read published Silver and nothing of each other, so they run side by side: the Gold
          # Spark job overlaps the ClickHouse mart build. The mart build, the two checks and the mart profile share the
          # dp-clickhouse mutex, so the small ClickHouse server runs one of them at a time. A failure in one branch
          # leaves the other's output publishable, and the run fails.
          - name: plan-gold
            template: plan-gold
            depends: publish-silver
            arguments:
              parameters:
                - name: start
                  value: "{{ "{{inputs.parameters.start}}" }}"
                - name: end
                  value: "{{ "{{inputs.parameters.end}}" }}"
          - name: gold
            template: gold
            depends: plan-gold
            when: "{{ "{{tasks.plan-gold.outputs.parameters.decision}}" }} == run"
            arguments:
              parameters:
                - name: start
                  value: "{{ "{{inputs.parameters.start}}" }}"
                - name: end
                  value: "{{ "{{inputs.parameters.end}}" }}"
          - name: check-gold
            template: check-gold
            depends: gold
            when: "{{ "{{tasks.plan-gold.outputs.parameters.decision}}" }} == run"
          - name: publish-gold
            template: publish-gold
            depends: check-gold
            when: "{{ "{{tasks.plan-gold.outputs.parameters.decision}}" }} == run"
          - name: plan-marts
            template: plan-marts
            depends: plan-gold
            arguments:
              parameters:
                - name: start
                  value: "{{ "{{inputs.parameters.start}}" }}"
                - name: end
                  value: "{{ "{{inputs.parameters.end}}" }}"
                - name: silver-snapshots
                  value: "{{ "{{tasks.plan-gold.outputs.parameters.silver-snapshots}}" }}"
          - name: marts
            template: marts
            depends: plan-marts
            when: "{{ "{{tasks.plan-marts.outputs.parameters.decision}}" }} == run"
            arguments:
              parameters:
                - name: start
                  value: "{{ "{{inputs.parameters.start}}" }}"
                - name: end
                  value: "{{ "{{inputs.parameters.end}}" }}"
                - name: silver-snapshots
                  value: "{{ "{{tasks.plan-gold.outputs.parameters.silver-snapshots}}" }}"
          - name: check-marts
            template: check-marts
            depends: marts
            when: "{{ "{{tasks.plan-marts.outputs.parameters.decision}}" }} == run"
          - name: publish-marts
            template: publish-marts
            depends: check-marts
            when: "{{ "{{tasks.plan-marts.outputs.parameters.decision}}" }} == run"
          - name: profile
            template: profile
            depends: publish-marts
            when: "{{ "{{tasks.plan-marts.outputs.parameters.decision}}" }} == run"
    - name: silver
      inputs:
        parameters:
          - name: start
          - name: end
      {{- include "data-pipelines.spark.retry" $ | nindent 6 }}
      resource:
        action: create
        setOwnerReference: true
        successCondition: status.currentState.currentStateSummary == ResourceReleased
        failureCondition: status.currentState.currentStateSummary == TerminatedWithoutReleaseResources
        manifest: |
          {{- include "data-pipelines.spark-application" (dict "root" $ "wap" true "main" "silver/curate" "product" "silver-payments" "stage" "silver" "sizing" $sizing "extraEnv" $range) | nindent 10 }}
    - name: gold
      inputs:
        parameters:
          - name: start
          - name: end
      {{- include "data-pipelines.spark.retry" $ | nindent 6 }}
      resource:
        action: create
        setOwnerReference: true
        successCondition: status.currentState.currentStateSummary == ResourceReleased
        failureCondition: status.currentState.currentStateSummary == TerminatedWithoutReleaseResources
        manifest: |
          {{- include "data-pipelines.spark-application" (dict "root" $ "wap" true "main" "gold/features" "product" "gold-features" "stage" "gold" "sizing" $sizing "extraEnv" $range) | nindent 10 }}
{{- include "data-pipelines.plan" (dict "root" $ "name" "plan-silver" "layer" "silver") | nindent 4 }}
{{- include "data-pipelines.plan" (dict "root" $ "name" "plan-gold" "layer" "gold") | nindent 4 }}
{{- include "data-pipelines.marts-step" (dict "root" $ "name" "plan-marts" "command" (list "python" "-m" "batch.gold.marts" "plan") "reportRoot" .Values.pipeline.reportRoot "ranged" true "decision" true) | nindent 4 }}
{{- include "data-pipelines.marts-step" (dict "root" $ "name" "marts" "command" (list "python" "-m" "batch.gold.marts" "build") "reportRoot" .Values.pipeline.reportRoot "ranged" true "mutex" "dp-clickhouse") | nindent 4 }}
{{- include "data-pipelines.checks" (dict "root" $ "name" "check-silver" "product" "silver-payments") | nindent 4 }}
{{- include "data-pipelines.checks" (dict "root" $ "name" "check-gold" "product" "gold-features" "mutex" "dp-clickhouse") | nindent 4 }}
{{- include "data-pipelines.checks" (dict "root" $ "name" "check-marts" "product" "payment-marts" "mutex" "dp-clickhouse") | nindent 4 }}
{{- include "data-pipelines.publish-tables" (dict "root" $ "name" "publish-silver" "product" "silver-payments") | nindent 4 }}
{{- include "data-pipelines.publish-tables" (dict "root" $ "name" "publish-gold" "product" "gold-features") | nindent 4 }}
{{- include "data-pipelines.marts-step" (dict "root" $ "name" "publish-marts" "command" (list "python" "-m" "batch.gold.marts" "publish") "reportRoot" .Values.pipeline.reportRoot) | nindent 4 }}
{{- include "data-pipelines.profile" (dict "root" $ "mutex" "dp-clickhouse") | nindent 4 }}
{{- include "data-pipelines.publish" (dict "root" $ "pipelines" "dp2-silver,dp3-features,dp3-marts" "dataset" .Values.bronze.datasetVersion "report" $report) | nindent 4 }}
---
# Daily: Kafka into Bronze, then yesterday and the lookback days through Silver, Gold and the marts.
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: dp-daily
  namespace: {{ .Values.namespace }}
spec:
  schedules:
    - {{ .Values.pipeline.schedule | quote }}
  suspend: {{ .Values.pipeline.suspend }}
  concurrencyPolicy: Forbid
  workflowSpec:
    serviceAccountName: data-pipelines
    {{- include "data-pipelines.workflowPlacement" $ | nindent 4 }}
    entrypoint: daily
    onExit: publish
    arguments:
      parameters:
        - name: source
          value: kafka
        - name: dataset-version
          value: {{ .Values.bronze.datasetVersion | quote }}
    podMetadata:
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
      labels:
        {{- include "data-pipelines.kafkaClientLabels" $ | nindent 8 }}
    templates:
      - name: daily
        steps:
          - - name: bronze
              templateRef:
                name: dp1-bronze
                template: bronze
          - - name: pipeline
              templateRef:
                name: dp-pipeline
                template: pipeline
              arguments:
                parameters:
                  - name: start
                    value: ""
                  - name: end
                    value: ""
{{- include "data-pipelines.publish" (dict "root" $ "pipelines" "dp1-bronze-kafka,dp2-silver,dp3-features,dp3-marts" "dataset" .Values.bronze.datasetVersion "report" $report) | nindent 6 }}
---
# Backfill: the same pipeline month by month, in date order, one month at a time. dim_customer continues each month
# from the versions the month before published, so order matters; a failure stops the rest, and a new backfill from
# the failed month resumes.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: dp-backfill
  namespace: {{ .Values.namespace }}
spec:
  serviceAccountName: data-pipelines
  {{- include "data-pipelines.workflowPlacement" $ | nindent 2 }}
  entrypoint: backfill
  onExit: publish
  arguments:
    parameters:
      - name: start
      - name: end
  podMetadata:
    annotations:
      cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    labels:
      {{- include "data-pipelines.kafkaClientLabels" $ | nindent 6 }}
  templates:
    - name: backfill
      steps:
        - - name: months
            template: months
        - - name: month
            templateRef:
              name: dp-pipeline
              template: pipeline
            arguments:
              parameters:
                - name: start
                  value: "{{ "{{item.start}}" }}"
                - name: end
                  value: "{{ "{{item.end}}" }}"
            withParam: "{{ "{{steps.months.outputs.result}}" }}"
      # One month at a time, and none after a failed one: each month continues from the one before.
      parallelism: 1
      failFast: true
    - name: months
      script:
        image: {{ include "data-pipelines.image" (dict "image" .Values.images.spark "global" .Values.global) | quote }}
        command: [python3]
        source: |
          import json
          from datetime import date, timedelta

          start, end = date.fromisoformat("{{ "{{workflow.parameters.start}}" }}"), date.fromisoformat("{{ "{{workflow.parameters.end}}" }}")
          months = []
          while start <= end:
              after = date(start.year + start.month // 12, start.month % 12 + 1, 1)
              months.append({"start": str(start), "end": str(min(after - timedelta(days=1), end))})
              start = after
          print(json.dumps(months))
{{- include "data-pipelines.publish" (dict "root" $ "pipelines" "dp2-silver,dp3-features,dp3-marts" "dataset" .Values.bronze.datasetVersion "report" $report) | nindent 4 }}
{{- end }}
