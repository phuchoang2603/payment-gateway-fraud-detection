{{- if .Values.featureStore.enabled }}
{{- $report := printf "%s/materialize/{{workflow.name}}.json" .Values.featureStore.reportRoot }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.featureStore.redisSecret }}
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gateway-doppler
  target:
    name: {{ .Values.featureStore.redisSecret }}
  data:
    - secretKey: password
      remoteRef:
        key: GATEWAY_FEAST_REDIS_PASSWORD
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: feast-materialize
  namespace: {{ .Values.namespace }}
spec:
  serviceAccountName: data-pipelines
  {{- include "data-pipelines.workflowPlacement" $ | nindent 2 }}
  entrypoint: run
  onExit: publish
  arguments:
    parameters:
      - {name: start, value: ""}
      - {name: end, value: ""}
  podMetadata:
    labels:
      app.kubernetes.io/name: data-pipelines
  templates:
    - name: run
      synchronization:
        mutexes:
          - name: dp-writer
      steps:
        - - {name: materialize, template: materialize}
        - - {name: check, template: check}
        - - {name: consume-state, template: consume-state}
    - name: materialize
      resource:
        action: create
        setOwnerReference: true
        successCondition: status.currentState.currentStateSummary == ResourceReleased
        failureCondition: status.currentState.currentStateSummary == TerminatedWithoutReleaseResources
        manifest: |
          {{- include "data-pipelines.spark-application" (dict "root" $ "main" "" "mainFile" "local:///opt/data-pipeline/feast/.venv/lib/python3.12/site-packages/fraud_feast/materialize.py" "python" "/opt/data-pipeline/feast/.venv/bin/python" "feast" true "product" "feature-store" "stage" "materialize" "sizing" (index .Values.spark.profiles .Values.featureStore.profile) "extraEnv" (list (dict "name" "RUN_REPORT" "value" $report) (dict "name" "START_DAY" "value" "{{workflow.parameters.start}}") (dict "name" "END_DAY" "value" "{{workflow.parameters.end}}"))) | nindent 10 }}
    {{- range $name, $args := dict "check" (list) "consume-state" (list "--publish") }}
    - name: {{ $name }}
      container:
        image: {{ include "data-pipelines.image" (dict "image" $.Values.images.feast "global" $.Values.global) | quote }}
        command: [python, -m, fraud_feast.check_online]
        args: {{ $args | toJson }}
        env:
          - name: RUN_REPORT
            value: {{ $report | quote }}
          {{- include "data-pipelines.env" $ | nindent 10 }}
          {{- include "data-pipelines.feastEnv" $ | nindent 10 }}
    {{- end }}
    {{- include "data-pipelines.publish" (dict "root" $ "pipelines" "feast-materialize" "dataset" .Values.bronze.datasetVersion "report" $report) | nindent 4 }}
---
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: feast-materialize-daily
  namespace: {{ .Values.namespace }}
spec:
  schedules: [{{ .Values.featureStore.schedule | quote }}]
  timezone: UTC
  suspend: true
  concurrencyPolicy: Forbid
  workflowSpec:
    workflowTemplateRef:
      name: feast-materialize
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: feast-push-replay
  namespace: {{ .Values.namespace }}
spec:
  serviceAccountName: data-pipelines
  {{- include "data-pipelines.workflowPlacement" $ | nindent 2 }}
  entrypoint: replay
  onExit: publish
  arguments:
    parameters:
      - {name: to, value: offline, enum: [online, offline]}
      - {name: from}
      - {name: until}
  podMetadata:
    labels:
      app.kubernetes.io/name: data-pipelines
  templates:
    - name: replay
      synchronization:
        mutexes:
          - name: {{ "feast-push-{{workflow.parameters.to}}" | quote }}
      container:
        image: {{ include "data-pipelines.image" (dict "image" .Values.images.feast "global" .Values.global) | quote }}
        command: [python, -m, fraud_feast.push_job]
        args: [--to, {{ "{{workflow.parameters.to}}" | quote }}, --from, {{ "{{workflow.parameters.from}}" | quote }}, --until, {{ "{{workflow.parameters.until}}" | quote }}]
        env:
          - name: FEATURE_EPOCH
            value: {{ .Values.featureStore.epoch | quote }}
          - name: FEATURE_UPDATE_TOPIC
            value: {{ printf "fraud.feature-updates.v2.%s" .Values.featureStore.epoch | quote }}
          - name: RUN_ID
            value: {{ "{{workflow.name}}" | quote }}
          - name: RUN_REPORT
            value: {{ printf "%s/replay/{{workflow.name}}.json" .Values.featureStore.reportRoot | quote }}
          {{- include "data-pipelines.env" . | nindent 10 }}
          {{- include "data-pipelines.feastEnv" . | nindent 10 }}
    {{- include "data-pipelines.publish" (dict "root" $ "pipelines" "feast-push-{{workflow.parameters.to}}" "dataset" .Values.bronze.datasetVersion "report" (printf "%s/replay/{{workflow.name}}.json" .Values.featureStore.reportRoot)) | nindent 4 }}
{{- end }}
