{{- if .Values.features.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fraud-streaming
  namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fraud-streaming
  namespace: {{ .Values.namespace }}
rules:
  - apiGroups: [apps]
    resources: [deployments]
    # Flink reads its own Deployment for owner references; history units run as <history epoch>-<YYYYMMDD>.
    resourceNames:
      - fraud-streaming-{{ .Values.features.epoch }}
      {{- $day := .Values.features.historyStart | toDate "2006-01-02" }}
      {{- $last := .Values.features.historyEnd | toDate "2006-01-02" }}
      {{- range until 400 }}
      {{- if lt $day.Unix $last.Unix }}
      - fraud-streaming-{{ $.Values.features.historyEpoch }}-{{ $day | date "20060102" }}
      {{- $day = dateModify (printf "+%dh" (mul 24 $.Values.features.historyUnitDays)) $day }}
      {{- end }}
      {{- end }}
    verbs: [get]
  - apiGroups: [""]
    resources: [pods, services, configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fraud-streaming
  namespace: {{ .Values.namespace }}
subjects:
  - kind: ServiceAccount
    name: fraud-streaming
    namespace: {{ .Values.namespace }}
roleRef:
  kind: Role
  name: fraud-streaming
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: fraud-streaming-{{ .Values.features.epoch }}
  namespace: {{ .Values.namespace }}
spec:
  image: {{ include "data-pipelines.image" (dict "image" .Values.images.streaming "global" $.Values.global) | quote }}
  imagePullPolicy: {{ .Values.images.streaming.pullPolicy }}
  flinkVersion: v2_2
  serviceAccount: fraud-streaming
  flinkConfiguration:
    taskmanager.numberOfTaskSlots: '1'
    taskmanager.rpc.port: '6122'
    taskmanager.data.port: '6121'
    blob.server.port: '6124'
    metrics.internal.query-service.port: '6125'
    python.executable: /app/.venv/bin/python
    python.client.executable: /app/.venv/bin/python
    execution.checkpointing.interval: 10s
    execution.checkpointing.storage: filesystem
    execution.checkpointing.dir: {{ printf "%s/checkpoints/%s" .Values.features.streaming.storageRoot .Values.features.epoch | quote }}
    execution.checkpointing.savepoint-dir: {{ printf "%s/savepoints/%s" .Values.features.streaming.storageRoot .Values.features.epoch | quote }}
    execution.checkpointing.timeout: 2min
    execution.checkpointing.num-retained: '3'
    execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
    high-availability.type: kubernetes
    high-availability.kubernetes.leader-election.lease-duration: 60s
    high-availability.kubernetes.leader-election.renew-deadline: 45s
    high-availability.storageDir: {{ printf "%s/checkpoints/ha/%s" .Values.features.streaming.storageRoot .Values.features.epoch | quote }}
    s3.endpoint: {{ .Values.config.S3_ENDPOINT | quote }}
    s3.path.style.access: {{ .Values.config.S3_PATH_STYLE | toString | quote }}
    s3.region: {{ .Values.config.AWS_REGION | quote }}
    restart-strategy.type: exponential-delay
    resourcemanager.taskmanager-registration.timeout: 10min
    slot.request.timeout: 15min
  jobManager:
    resources:
      {{- toYaml .Values.features.streaming.jobManager.resources | nindent 6 }}
  taskManager:
    resources:
      {{- toYaml .Values.features.streaming.taskManager.resources | nindent 6 }}
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: fraud-streaming
        istio.io/dataplane-mode: none
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 9999
        runAsGroup: 9999
        fsGroup: 9999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: flink-main-container
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storage.externalSecret.name }}
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storage.externalSecret.name }}
                  key: AWS_SECRET_ACCESS_KEY
            - name: KAFKA_BROKERS
              value: {{ .Values.bronze.kafka.bootstrapServers | quote }}
            - name: FEATURE_EPOCH
              value: {{ .Values.features.epoch | quote }}
            - name: FEATURE_TOPIC
              value: {{ (printf "fraud.feature-updates.v2.%s" $.Values.features.epoch) | quote }}
            - name: SOURCE_TOPIC
              value: {{ .Values.features.streaming.sourceTopic | quote }}
            - name: SOURCE_PARTITIONS
              value: {{ .Values.features.streaming.sourcePartitions | quote }}
            - name: MAX_ENTITY_ENTRIES
              value: {{ .Values.features.streaming.maxEntityEntries | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
  job:
    jarURI: local:///opt/flink/opt/flink-python-2.2.1.jar
    entryClass: org.apache.flink.client.python.PythonDriver
    args: [-pym, fraud_streaming.job]
    parallelism: 1
    upgradeMode: last-state
    state: running
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: fraud-streaming
  namespace: {{ .Values.namespace }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: fraud-streaming
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: fraud-streaming
      toPorts:
        - ports:
            - {port: '6121', protocol: TCP}
            - {port: '6122', protocol: TCP}
            - {port: '6123', protocol: TCP}
            - {port: '6124', protocol: TCP}
            - {port: '6125', protocol: TCP}
            - {port: '8081', protocol: TCP}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: operators
            app.kubernetes.io/name: flink-kubernetes-operator
      toPorts:
        - ports: [{port: '8081', protocol: TCP}]
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: data
            app.kubernetes.io/name: data-pipelines
      toPorts:
        - ports: [{port: '8081', protocol: TCP}]
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: fraud-streaming
      toPorts:
        - ports:
            - {port: '6121', protocol: TCP}
            - {port: '6122', protocol: TCP}
            - {port: '6123', protocol: TCP}
            - {port: '6124', protocol: TCP}
            - {port: '6125', protocol: TCP}
            - {port: '8081', protocol: TCP}
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: payment-gateway
            strimzi.io/cluster: payment-gateway-kafka
      toPorts:
        - ports: [{port: '9092', protocol: TCP}]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports: [{port: '53', protocol: ANY}]
    - toEntities: [kube-apiserver]
      toPorts:
        - ports: [{port: '443', protocol: TCP}, {port: '6443', protocol: TCP}]
    - toEntities: [world]
      toPorts:
        - ports: [{port: '443', protocol: TCP}]
{{- end }}
