{{- if .Values.bronze.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: dp1-bronze-kafka
  namespace: {{ .Values.namespace }}
spec:
  schedules:
    - {{ .Values.bronze.kafka.schedule | quote }}
  suspend: true
  concurrencyPolicy: Forbid
  workflowSpec:
    serviceAccountName: data-pipelines
    podMetadata:
      annotations:
        karpenter.sh/do-not-disrupt: "true"
    entrypoint: kafka
    onExit: publish
    arguments:
      parameters:
        - name: source
          value: kafka
        - name: dataset-version
          value: {{ .Values.bronze.datasetVersion | quote }}
        - name: mode
          value: incremental
    templates:
      - name: kafka
        steps:
          - - name: bronze
              templateRef:
                name: dp1-bronze
                template: bronze
              arguments:
                parameters:
                  - name: source
                    value: kafka
          - - name: silver
              templateRef:
                name: dp2-silver
                template: silver
              arguments:
                parameters:
                  - name: mode
                    value: incremental
{{- include "data-pipelines.publish" (dict "root" $ "pipelines" "dp1-bronze-kafka,dp2-silver" "dataset" .Values.bronze.datasetVersion) | nindent 6 }}
{{- end }}
