{{- if .Values.features.enabled }}
{{- range $mode, $name := dict "write" "feature-writer" "serve" "feast-server" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        feast-client: "true"
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $name }}
          image: {{ include "data-pipelines.image" (dict "image" $.Values.images.feast "global" $.Values.global) | quote }}
          imagePullPolicy: {{ $.Values.images.feast.pullPolicy }}
          {{- if ne $mode "serve" }}
          command: [python, -m, fraud_feast.stream_writer]
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            {{- include "data-pipelines.lakeEnv" $ | nindent 12 }}
            {{- include "data-pipelines.feastEnv" $ | nindent 12 }}
          {{- if ne $mode "serve" }}
            - name: FEATURE_UPDATE_TOPIC
              value: {{ (printf "fraud.feature-updates.v2.%s" $.Values.features.epoch) | quote }}
            - name: FEATURE_EPOCH
              value: {{ $.Values.features.epoch | quote }}
          {{- end }}
          {{- if eq $mode "serve" }}
          ports:
            - name: http
              containerPort: 6566
          # Loading the registry and the Spark source module takes over a minute on a cold start.
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          {{- end }}
          volumeMounts:
            - name: runtime
              mountPath: /tmp
          resources:
            {{- toYaml $.Values.features.resources | nindent 12 }}
      volumes:
        - name: runtime
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  policyTypes: [Ingress, Egress]
  {{- if eq $mode "serve" }}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: payment-gateway
          podSelector:
            matchLabels:
              app.kubernetes.io/name: fraud-service
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: llm
          podSelector:
            matchLabels:
              app.kubernetes.io/name: risk-serving
      ports:
        - port: 6566
          protocol: TCP
  {{- else }}
  ingress: []
  {{- end }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: {{ $.Values.features.redis.name }}
      ports:
        - port: 6379
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: polaris
      ports:
        - {port: 8181, protocol: TCP}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - {port: 443, protocol: TCP}
    {{- if ne $mode "serve" }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: payment-gateway
          podSelector:
            matchLabels:
              strimzi.io/cluster: payment-gateway-kafka
      ports:
        - port: 9092
          protocol: TCP
    {{- end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: feast-server
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: feast-server
  ports:
    - name: http
      port: 6566
      targetPort: http
{{- end }}
