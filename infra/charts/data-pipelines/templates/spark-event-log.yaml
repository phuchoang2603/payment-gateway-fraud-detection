{{- with .Values.sparkEventLogDir }}
apiVersion: batch/v1
kind: Job
metadata:
  name: spark-event-log-dir
  namespace: {{ $.Values.namespace }}
  annotations:
    # Sync, before any Spark application: its event logger fails on a prefix that holds no object.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: data-pipelines
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: init
          image: {{ include "data-pipelines.image" (dict "image" $.Values.images.spark "global" $.Values.global) | quote }}
          command:
            - /opt/data-pipeline/batch/.venv/bin/python
            - -c
            - |
              import os
              import boto3
              from botocore.config import Config

              bucket, _, prefix = os.environ["EVENT_LOG_DIR"].removeprefix("s3a://").partition("/")
              style = "path" if os.environ["S3_PATH_STYLE"] == "true" else "virtual"
              boto3.client(
                  "s3",
                  endpoint_url=os.environ["S3_ENDPOINT"],
                  config=Config(s3={"addressing_style": style}),
              ).put_object(Bucket=bucket, Key=prefix.rstrip("/") + "/.keep", Body=b"")
          env:
            - name: EVENT_LOG_DIR
              value: {{ . | quote }}
            {{- include "data-pipelines.storageEnv" $ | nindent 12 }}
            {{- include "data-pipelines.checksumEnv" $ | nindent 12 }}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
{{- end }}
