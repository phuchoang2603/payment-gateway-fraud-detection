{{- if .Values.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: historical-generator
  namespace: {{ .Values.namespace }}
---
apiVersion: v1
kind: Secret
metadata:
  name: historical-generator.service-account-token
  namespace: {{ .Values.namespace }}
  annotations:
    kubernetes.io/service-account.name: historical-generator
type: kubernetes.io/service-account-token
---
{{- with .Values.storage.externalSecret }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .store }}
  target:
    name: {{ .name }}
    {{- with .template }}
    template:
      engineVersion: v2
      data:
        {{- range $key, $value := . }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
    {{- end }}
  data:
  {{- range $local, $remote := .data }}
    - secretKey: {{ $local }}
      remoteRef:
        key: {{ $remote }}
  {{- end }}
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: historical-generator
  namespace: {{ .Values.namespace }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, delete, deletecollection]
  - apiGroups: [argoproj.io]
    resources: [workflows/finalizers]
    verbs: [update]
  - apiGroups: [argoproj.io]
    resources: [workflowtaskresults]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: historical-generator
  namespace: {{ .Values.namespace }}
subjects:
  - kind: ServiceAccount
    name: historical-generator
    namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: historical-generator
{{- end }}
