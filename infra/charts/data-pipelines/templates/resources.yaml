{{- if .Values.enabled }}
{{- range $name, $image := .Values.images }}
{{- if not (regexMatch "@sha256:[a-f0-9]{64}$" $image) }}
{{- fail (printf "images.%s must use an immutable sha256 digest" $name) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  annotations:
    helm.sh/resource-policy: keep
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dp1-config
  namespace: {{ .Values.namespace }}
data:
  LANDING_MAX_BATCHES: {{ .Values.recurring.maxBatches | quote }}
  {{- toYaml .Values.config | nindent 2 }}
---
{{- range $name := list "spark" "workflow" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dp1-{{ $name }}
  namespace: {{ $.Values.namespace }}
---
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: dp1-workflow.service-account-token
  namespace: {{ .Values.namespace }}
  annotations:
    kubernetes.io/service-account.name: dp1-workflow
type: kubernetes.io/service-account-token
---
{{- range .Values.externalSecrets }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .store }}
  target:
    name: {{ .name }}
    {{- with .template }}
    template:
      engineVersion: v2
      data:
        {{- range $key, $value := . }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
    {{- end }}
  data:
  {{- range $local, $remote := .data }}
    - secretKey: {{ $local }}
      remoteRef:
        key: {{ $remote }}
  {{- end }}
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dp1-spark
  namespace: {{ .Values.namespace }}
rules:
  - apiGroups: [""]
    resources: [pods, services, configmaps, persistentvolumeclaims]
    verbs: [create, get, list, watch, delete, deletecollection, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dp1-spark
  namespace: {{ .Values.namespace }}
subjects:
  - kind: ServiceAccount
    name: dp1-spark
    namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dp1-spark
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dp1-workflow
  namespace: {{ .Values.namespace }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, delete, deletecollection]
  - apiGroups: [spark.apache.org]
    resources: [sparkapplications]
    verbs: [create, get, list, watch, delete, deletecollection]
  - apiGroups: [argoproj.io]
    resources: [workflows/finalizers]
    verbs: [update]
  - apiGroups: [argoproj.io]
    resources: [workflowtaskresults]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dp1-workflow
  namespace: {{ .Values.namespace }}
subjects:
  - kind: ServiceAccount
    name: dp1-workflow
    namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dp1-workflow
{{- end }}
