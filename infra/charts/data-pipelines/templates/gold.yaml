{{- if .Values.dp3.enabled }}
{{- $sizing := index .Values.spark.profiles .Values.dp3.profile }}
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: dp3-gold
  namespace: {{ .Values.namespace }}
spec:
  serviceAccountName: data-pipelines
  {{- include "data-pipelines.workflowPlacement" $ | nindent 2 }}
  entrypoint: gold
  onExit: publish
  arguments:
    parameters:
      - name: mode
        value: historical
        enum: [historical, incremental]
  activeDeadlineSeconds: {{ .Values.dp3.activeDeadlineSeconds }}
  synchronization:
    mutexes:
      - name: dp3-gold-writer
      - name: dp2-silver-writer
  podMetadata:
    annotations:
      karpenter.sh/do-not-disrupt: "true"
    labels:
      {{- include "data-pipelines.kafkaClientLabels" $ | nindent 6 }}
      dp-product: gold-features
  templates:
    - name: gold
      dag:
        tasks:
          - name: features
            template: features
          - name: marts
            template: marts
            depends: features
          - name: checks
            template: checks
            depends: marts
          - name: publish-tables
            template: publish-tables
            depends: checks
          - name: publish-marts
            template: publish-marts
            depends: publish-tables
          - name: profile
            template: profile
            depends: publish-marts
    - name: features
      {{- include "data-pipelines.spark.retry" $ | nindent 6 }}
      resource:
        action: create
        setOwnerReference: true
        successCondition: status.currentState.currentStateSummary == ResourceReleased
        failureCondition: status.currentState.currentStateSummary == TerminatedWithoutReleaseResources
        manifest: |
          {{- include "data-pipelines.spark-application" (dict "root" $ "stem" "dp3-gold" "wap" true "main" "gold" "product" "gold-features" "stage" "features" "sizing" $sizing "extraEnv" (list (dict "name" "RUN_ID" "value" "{{workflow.name}}") (dict "name" "RUN_REPORT_ROOT" "value" .Values.dp3.reportRoot) (dict "name" "GOLD_MODE" "value" "{{workflow.parameters.mode}}"))) | nindent 10 }}
{{- include "data-pipelines.marts-step" (dict "root" $ "name" "marts" "command" (list "python" "-m" "batch.marts" "build") "reportRoot" .Values.dp3.reportRoot) | nindent 4 }}
{{- include "data-pipelines.checks" (dict "root" $ "product" "gold-features,payment-marts") | nindent 4 }}
{{- include "data-pipelines.publish-tables" (dict "root" $ "product" "gold-features") | nindent 4 }}
{{- include "data-pipelines.marts-step" (dict "root" $ "name" "publish-marts" "command" (list "python" "-m" "batch.marts" "publish") "reportRoot" .Values.dp3.reportRoot) | nindent 4 }}
{{- include "data-pipelines.profile" (dict "root" $) | nindent 4 }}
{{- include "data-pipelines.publish" (dict "root" $ "pipelines" "dp3-features,dp3-marts" "dataset" .Values.bronze.datasetVersion "report" (printf "%s/%s/gold.json" .Values.dp3.reportRoot "{{workflow.name}}")) | nindent 4 }}
---
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: dp3-gold-daily
  namespace: {{ .Values.namespace }}
spec:
  schedules:
    - {{ .Values.dp3.schedule | quote }}
  suspend: true
  concurrencyPolicy: Forbid
  workflowSpec:
    workflowTemplateRef:
      name: dp3-gold
    arguments:
      parameters:
        - name: mode
          value: incremental
{{- end }}
{{- if .Values.warehouseBenchmark.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: warehouse-benchmark
  namespace: {{ .Values.namespace }}
spec:
  serviceAccountName: data-pipelines
  {{- include "data-pipelines.workflowPlacement" $ | nindent 2 }}
  entrypoint: benchmark
  activeDeadlineSeconds: {{ .Values.warehouseBenchmark.activeDeadlineSeconds }}
  synchronization:
    mutexes:
      - name: dp3-gold-writer
  podMetadata:
    labels:
      dp-product: payment-marts
  templates:
{{- include "data-pipelines.marts-step" (dict "root" $ "name" "benchmark" "command" (list "python" "-m" "batch.warehouse_benchmark") "reportRoot" .Values.warehouseBenchmark.reportRoot) | nindent 4 }}
{{- end }}
