{{- if and .Values.enabled .Values.recurring.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: recurring-dp1-bronze
  namespace: {{ .Values.namespace }}
spec:
  schedules: [{{ .Values.recurring.schedule | quote }}]
  timezone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  workflowSpec:
    workflowTemplateRef:
      name: historical-dp1-bronze
    entrypoint: recurring
    arguments:
      parameters:
        - {name: input-mode, value: landing}
        - {name: source-root, value: {{ .Values.recurring.sourceRoot | quote }}}
        - {name: source-epoch, value: {{ .Values.recurring.sourceEpoch | quote }}}
        - {name: profile, value: "false"}
{{- end }}
