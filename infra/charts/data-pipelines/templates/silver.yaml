{{- if .Values.silver.enabled }}
{{- $sizing := index .Values.spark.profiles .Values.silver.profile }}
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: dp2-silver
  namespace: {{ .Values.namespace }}
spec:
  serviceAccountName: data-pipelines
  {{- include "data-pipelines.workflowPlacement" $ | nindent 2 }}
  entrypoint: silver
  onExit: publish
  arguments:
    parameters:
      - name: mode
        value: historical
        enum: [historical, incremental]
  activeDeadlineSeconds: {{ .Values.silver.activeDeadlineSeconds }}
  synchronization:
    mutexes:
      - name: dp2-silver-writer
  podMetadata:
    annotations:
      karpenter.sh/do-not-disrupt: "true"
    labels:
      {{- include "data-pipelines.kafkaClientLabels" $ | nindent 6 }}
      dp-product: silver-payments
  templates:
    - name: silver
      dag:
        tasks:
          - name: spark
            template: spark
          - name: checks
            template: checks
            depends: spark
          - name: publish-tables
            template: publish-tables
            depends: checks
    - name: spark
      {{- include "data-pipelines.spark.retry" $ | nindent 6 }}
      resource:
        action: create
        setOwnerReference: true
        successCondition: status.currentState.currentStateSummary == ResourceReleased
        failureCondition: status.currentState.currentStateSummary == TerminatedWithoutReleaseResources
        manifest: |
          {{- include "data-pipelines.spark-application" (dict "root" $ "stem" "dp2-silver" "wap" true "main" "silver/curate" "product" "silver-payments" "stage" "silver" "sizing" $sizing "extraEnv" (list (dict "name" "RUN_ID" "value" "{{workflow.name}}") (dict "name" "RUN_REPORT_ROOT" "value" .Values.silver.reportRoot) (dict "name" "SILVER_DEDUP_BROADCAST_BYTES" "value" (.Values.silver.dedupBroadcastBytes | int64 | toString)) (dict "name" "SILVER_MODE" "value" "{{workflow.parameters.mode}}") (dict "name" "SILVER_LOOKBACK_DAYS" "value" (.Values.silver.incrementalLookbackDays | int64 | toString)))) | nindent 10 }}
{{- include "data-pipelines.checks" (dict "root" $ "product" "silver-payments") | nindent 4 }}
{{- include "data-pipelines.publish-tables" (dict "root" $ "product" "silver-payments") | nindent 4 }}
{{- include "data-pipelines.publish" (dict "root" $ "pipelines" "dp2-silver" "dataset" .Values.bronze.datasetVersion) | nindent 4 }}
{{- end }}
