{{- if .Values.silver.enabled }}
{{- $sizing := index .Values.spark.profiles .Values.silver.profile }}
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: dp2-silver
  namespace: {{ .Values.namespace }}
spec:
  serviceAccountName: data-pipelines
  entrypoint: silver
  activeDeadlineSeconds: {{ .Values.silver.activeDeadlineSeconds }}
  synchronization:
    mutexes:
      - name: dp2-silver-writer
  podMetadata:
    labels:
      {{- include "data-pipelines.kafkaClientLabels" $ | nindent 6 }}
      dp-product: silver-payments
  templates:
    - name: silver
      dag:
        tasks:
          - name: spark
            template: spark
          - name: checks
            template: checks
            depends: spark
          - name: publish
            template: publish
            depends: "spark.Failed || checks.Succeeded || checks.Failed"
    - name: spark
      {{- include "data-pipelines.spark.retry" $ | nindent 6 }}
      resource:
        action: create
        setOwnerReference: true
        successCondition: status.currentState.currentStateSummary == ResourceReleased
        failureCondition: status.currentState.currentStateSummary == TerminatedWithoutReleaseResources
        manifest: |
          {{- include "data-pipelines.spark-application" (dict "root" $ "stem" "dp2-silver" "main" "silver" "product" "silver-payments" "stage" "silver" "sizing" $sizing "extraEnv" (list (dict "name" "RUN_ID" "value" "{{workflow.name}}") (dict "name" "RUN_REPORT_ROOT" "value" .Values.silver.reportRoot))) | nindent 10 }}
    - name: checks
      retryStrategy:
        limit: 2
        retryPolicy: OnError
      container:
        image: {{ include "data-pipelines.image" (dict "image" .Values.images.openmetadata "global" .Values.global) | quote }}
        command: [python, -m, openmetadata_jobs.checks]
        env:
          - name: CHECK_PRODUCT
            value: silver-payments
{{- include "data-pipelines.env" $ | nindent 10 }}
    - name: publish
      retryStrategy:
        limit: 2
        retryPolicy: OnError
      container:
        image: {{ include "data-pipelines.image" (dict "image" .Values.images.openmetadata "global" .Values.global) | quote }}
        command: [python, -m, openmetadata_jobs.publish]
        env:
{{- include "data-pipelines.env" $ | nindent 10 }}
{{- end }}
