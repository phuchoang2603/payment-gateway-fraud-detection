{{- if .Values.dashboards.enabled }}
{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "dashboard-%s" (base $path | trimSuffix ".json") }}
  namespace: {{ $.Values.namespace }}
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: {{ $.Values.dashboards.folder | quote }}
data:
  {{ base $path }}: |-
    {{- $.Files.Get $path | nindent 4 }}
{{- end }}
{{- end }}
