{{- if .Values.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: generate-historical
  namespace: {{ .Values.namespace }}
spec:
  serviceAccountName: historical-generator
  entrypoint: generate
  arguments:
    parameters:
      - name: shards
        value: {{ .Values.generator.shards | quote }}
      - name: config
        value: {{ .Values.generator.config | quote }}
      - name: output
        value: ""
      - name: duration-days
        value: ""
  synchronization:
    mutexes:
      - name: historical-generator-writer
  templates:
    - name: generate
      dag:
        tasks:
          - name: shard
            template: shard
            arguments:
              parameters:
                - name: index
                  value: {{ "{{item}}" | quote }}
            withSequence:
              count: "{{ "{{workflow.parameters.shards}}" }}"
          - name: publish
            template: publish
            depends: shard
    - name: shard
      inputs:
        parameters:
          - name: index
{{- include "data-pipelines.generator.step" (dict "root" $ "mode" "shard" "shard" true) | nindent 6 }}
    - name: publish
{{- include "data-pipelines.generator.step" (dict "root" $ "mode" "publish" "shard" false) | nindent 6 }}
{{- end }}
