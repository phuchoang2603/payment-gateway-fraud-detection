storage:
  secretStore: gateway-doppler
  accessKey: OBJECT_GATEWAY_ACCESS_KEY_ID
  secretKey: OBJECT_GATEWAY_SECRET_ACCESS_KEY
catalog:
  name: lakehouse
  bucket: platform-dev
  prefix: lakehouse
  endpoint: https://minio.home.phuchoang.sbs
  region: us-east-1
  pathStyle: true
setup:
  image: clickhouse/clickhouse-server:26.10.2.103
  host: clickhouse.data.svc.cluster.local
  port: 8123
  adminUser: admin
  adminPasswordKey: CLICKHOUSE_ADMIN_PASSWORD
  profile: openmetadata
  profileSettings:
    readonly: 2
    allow_database_iceberg: 1
  lakehouse:
    database: lakehouse
    uri: http://iceberg-catalog.data.svc.cluster.local:8181/api/catalog
    warehouse: lakehouse
    oauthUri: http://iceberg-catalog.data.svc.cluster.local:8181/api/catalog/v1/oauth/tokens
    clientId: platform
    scope: PRINCIPAL_ROLE:ALL
  users:
    - name: openmetadata
      passwordKey: CLICKHOUSE_OPENMETADATA_PASSWORD
