{{- $s := .Values.setup }}
{{- $pairs := list }}
{{- range $key, $value := $s.profileSettings }}
{{- $pairs = append $pairs (printf "%s = %v" $key $value) }}
{{- end }}
{{- $settings := join ", " $pairs }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  name: gateway-clickhouse-setup
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: gateway-clickhouse-setup
  data:
    - secretKey: ADMIN_PASSWORD
      remoteRef:
        key: {{ $s.adminPasswordKey }}
  {{- range $u := $s.users }}
    - secretKey: {{ $u.name | upper }}_PASSWORD
      remoteRef:
        key: {{ $u.passwordKey }}
  {{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gateway-clickhouse-runtime
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.storage.secretStore }}
  target:
    name: gateway-clickhouse-runtime
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: {{ .Values.storage.accessKey }}
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: {{ .Values.storage.secretKey }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-clickhouse-setup
data:
  setup.sh: |
    set -euo pipefail
    ch() {
      curl -fsS --user "$CLICKHOUSE_ADMIN_USER:$ADMIN_PASSWORD" --data-binary "$1" "http://$CLICKHOUSE_HOST:$CLICKHOUSE_PORT/" >/dev/null
    }
    until ch "SELECT 1"; do sleep 10; done
    ch "DROP DATABASE IF EXISTS $LAKEHOUSE_DATABASE SYNC"
    ch "CREATE DATABASE $LAKEHOUSE_DATABASE ENGINE = DataLakeCatalog('$LAKEHOUSE_URI', '$LAKEHOUSE_CLIENT_ID', '$ICEBERG_CLIENT_SECRET') SETTINGS catalog_type = 'rest', warehouse = '$LAKEHOUSE_WAREHOUSE', auth_scope = '$LAKEHOUSE_SCOPE', oauth_server_uri = '$LAKEHOUSE_OAUTH_URI', storage_endpoint = '$STORAGE_ENDPOINT', aws_access_key_id = '$AWS_ACCESS_KEY_ID', aws_secret_access_key = '$AWS_SECRET_ACCESS_KEY', region = '$STORAGE_REGION', vended_credentials = false"
    ch "CREATE SETTINGS PROFILE IF NOT EXISTS $OPENMETADATA_PROFILE SETTINGS $PROFILE_SETTINGS"
    ch "ALTER SETTINGS PROFILE $OPENMETADATA_PROFILE SETTINGS $PROFILE_SETTINGS"
    ch "CREATE USER IF NOT EXISTS $OPENMETADATA_USER IDENTIFIED BY '$OPENMETADATA_PASSWORD' SETTINGS PROFILE '$OPENMETADATA_PROFILE'"
    ch "ALTER USER $OPENMETADATA_USER IDENTIFIED BY '$OPENMETADATA_PASSWORD' SETTINGS PROFILE '$OPENMETADATA_PROFILE'"
    ch "GRANT SELECT ON $LAKEHOUSE_DATABASE.* TO $OPENMETADATA_USER"
    ch "GRANT SELECT ON system.tables TO $OPENMETADATA_USER"
    ch "GRANT SELECT ON system.columns TO $OPENMETADATA_USER"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gateway-clickhouse-setup
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 20
  activeDeadlineSeconds: 1200
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: apply
          image: {{ $s.image }}
          command: [bash, /setup/setup.sh]
          env:
            - {name: CLICKHOUSE_HOST, value: {{ $s.host | quote }}}
            - {name: CLICKHOUSE_PORT, value: {{ $s.port | quote }}}
            - {name: CLICKHOUSE_ADMIN_USER, value: {{ $s.adminUser | quote }}}
            - {name: LAKEHOUSE_DATABASE, value: {{ $s.lakehouse.database | quote }}}
            - {name: LAKEHOUSE_URI, value: {{ $s.lakehouse.uri | quote }}}
            - {name: LAKEHOUSE_WAREHOUSE, value: {{ $s.lakehouse.warehouse | quote }}}
            - {name: LAKEHOUSE_CLIENT_ID, value: {{ $s.lakehouse.clientId | quote }}}
            - {name: LAKEHOUSE_SCOPE, value: {{ $s.lakehouse.scope | quote }}}
            - {name: LAKEHOUSE_OAUTH_URI, value: {{ $s.lakehouse.oauthUri | quote }}}
            - {name: STORAGE_ENDPOINT, value: {{ printf "%s/%s" .Values.catalog.endpoint .Values.catalog.bucket | quote }}}
            - {name: STORAGE_REGION, value: {{ .Values.catalog.region | quote }}}
            - {name: OPENMETADATA_USER, value: {{ (index $s.users 0).name | quote }}}
            - {name: OPENMETADATA_PROFILE, value: {{ $s.profile | quote }}}
            - name: PROFILE_SETTINGS
              value: {{ $settings | quote }}
          envFrom:
            - secretRef:
                name: gateway-clickhouse-setup
            - secretRef:
                name: gateway-clickhouse-runtime
            - secretRef:
                name: gateway-catalog-client
          volumeMounts:
            - {name: setup, mountPath: /setup}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
      volumes:
        - name: setup
          configMap:
            name: gateway-clickhouse-setup
