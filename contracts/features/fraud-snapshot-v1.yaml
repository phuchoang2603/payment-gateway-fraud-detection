{
  "id": "fraud-snapshot-v1",
  "version": 1,
  "event_schema": 3,
  "grain": [
    "integration_id",
    "entity_view",
    "entity_id",
    "epoch",
    "snapshot_id",
    "revision"
  ],
  "entity_keys": {
    "customer": [
      "integration_id",
      "context.customer.customer_id"
    ],
    "method": [
      "integration_id",
      "signals.payment_method.fingerprint"
    ]
  },
  "time": {
    "precision": "UTC microseconds; window lower bound inclusive, upper bound exclusive",
    "anchor": "s: independent customer/method snapshot anchor; t: current gateway attempt start",
    "availability_cutoff": "q: snapshot computation cutoff; separate from s and serving read time",
    "window": "[s-window,s)",
    "eligibility": "unique scoped start AND committed RiskDecisionRecorded available at q; declines contribute; undecided starts do not",
    "observed_availability": "max(recorded_at, observed availability) for both events when known; missing observed mapping fails; idealized replay is explicitly identified",
    "coverage": "per view and window: complete or unknown; caller must establish source coverage independently of watermark or idle partition; unknown values are null",
    "freshness": "per-view definition/epoch match, anchor <= t and bounded anchor age AND measured source progress; unavailable values never become zero",
    "emission": "on eligible changes and first microsecond after each inclusive lower-bound expiration; live UTC or injected historical logical clock",
    "late_data": "corrections create new revisions and never revise previously served evidence",
    "last_assessed": "latest contributing start timestamp, retained separately; elapsed=floor(t-last); null unless last in [t-7d,t)"
  },
  "features": [
    {
      "name": "amount_minor",
      "type": "int64",
      "units": "USD minor units",
      "formula": "current.context.snapshot.total.minor_units",
      "window_seconds": null,
      "missing": "required current checkout context; invalid or absent context fails",
      "scope": "request"
    },
    {
      "name": "customer_account_age_hours",
      "type": "int64",
      "units": "hours",
      "formula": "floor((t - customer_account_created_at) / 3600 seconds)",
      "window_seconds": null,
      "missing": "required current checkout context; invalid or absent context fails",
      "scope": "request"
    },
    {
      "name": "ip_shipping_country_mismatch",
      "type": "nullable_boolean",
      "units": "boolean",
      "formula": "observed ip_country != shipping.country; null when IP country is absent",
      "window_seconds": null,
      "missing": "null when observed IP country is absent",
      "scope": "request"
    },
    {
      "name": "customer_snapshot_assessed_count_1h",
      "type": "nullable_int64",
      "units": "attempts",
      "formula": "count eligible customer attempts in snapshot window [s-window,s)",
      "window_seconds": 3600,
      "missing": "null when view unavailable or relevant window coverage unknown; complete empty count/sum is zero; last-assessed is null when none",
      "scope": "customer"
    },
    {
      "name": "customer_snapshot_assessed_count_24h",
      "type": "nullable_int64",
      "units": "attempts",
      "formula": "count eligible customer attempts in snapshot window [s-window,s)",
      "window_seconds": 86400,
      "missing": "null when view unavailable or relevant window coverage unknown; complete empty count/sum is zero; last-assessed is null when none",
      "scope": "customer"
    },
    {
      "name": "method_snapshot_assessed_count_1h",
      "type": "nullable_int64",
      "units": "attempts",
      "formula": "count eligible method attempts in snapshot window [s-window,s)",
      "window_seconds": 3600,
      "missing": "null when view unavailable or relevant window coverage unknown; complete empty count/sum is zero; last-assessed is null when none",
      "scope": "method"
    },
    {
      "name": "method_snapshot_assessed_count_24h",
      "type": "nullable_int64",
      "units": "attempts",
      "formula": "count eligible method attempts in snapshot window [s-window,s)",
      "window_seconds": 86400,
      "missing": "null when view unavailable or relevant window coverage unknown; complete empty count/sum is zero; last-assessed is null when none",
      "scope": "method"
    },
    {
      "name": "customer_snapshot_assessed_amount_minor_24h",
      "type": "nullable_int64",
      "units": "USD minor units",
      "formula": "sum eligible customer attempt amounts",
      "window_seconds": 86400,
      "missing": "null when view unavailable or relevant window coverage unknown; complete empty count/sum is zero; last-assessed is null when none",
      "scope": "customer"
    },
    {
      "name": "customer_snapshot_distinct_devices_7d",
      "type": "nullable_int64",
      "units": "devices",
      "formula": "exact count of distinct non-null observed devices in eligible customer attempts",
      "window_seconds": 604800,
      "missing": "null when view unavailable or relevant window coverage unknown; complete empty count/sum is zero; last-assessed is null when none",
      "scope": "customer"
    },
    {
      "name": "customer_seconds_since_snapshot_last_assessed_7d",
      "type": "nullable_int64",
      "units": "seconds",
      "formula": "floor(t - customer_snapshot_last_assessed_at); null unless timestamp in [t-7d,t) and 7d snapshot coverage complete",
      "window_seconds": 604800,
      "missing": "null when view unavailable or relevant window coverage unknown; complete empty count/sum is zero; last-assessed is null when none",
      "scope": "customer"
    }
  ],
  "excluded": [
    "scenario",
    "is_fraud",
    "simulation_truth",
    "chargebacks",
    "risk_outcome",
    "risk_score",
    "reason_codes",
    "future_processor_results",
    "hidden_profile_timezone"
  ],
  "hash": "SHA256 of exact definition file bytes",
  "conformance": "fraud-snapshot-v1.examples.json",
  "snapshot_metadata": [
    "definition id and SHA256",
    "epoch",
    "entity view and scoped key",
    "snapshot_id",
    "revision",
    "anchor",
    "publication time",
    "observed availability time",
    "online write timestamp",
    "source progress with partition/offset/heartbeat basis",
    "per-window coverage",
    "customer last-assessed start timestamp"
  ]
}
