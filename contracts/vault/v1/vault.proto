syntax = "proto3";
package vault.v1;

option go_package = "github.com/phuchoang2603/payment-gateway-fraud-detection/shared/proto/vault/v1;vaultv1";

// Synthetic vault: allow-listed test cards only; never a cardholder-data environment.
// The two services listen on separate ports so the mesh authorizes each caller by
// workload identity and port: Edge reaches VaultService, only the processor reaches
// ProcessingService.
service VaultService {
  rpc TokenizeCard(TokenizeCardRequest) returns (TokenizeCardResponse);
  rpc DescribeMethod(DescribeMethodRequest) returns (DescribeMethodResponse);
}
service ProcessingService {
  rpc ResolveForProcessing(ResolveForProcessingRequest) returns (ResolveForProcessingResponse);
}
message TokenizeCardRequest {
  string integration_id = 1;
  string card_number = 2;
}
message TokenizeCardResponse {
  string token = 1;
  MethodMetadata metadata = 2;
}
message DescribeMethodRequest {
  string integration_id = 1;
  string token = 2;
}
message DescribeMethodResponse {
  MethodMetadata metadata = 1;
}
// Safe to pass to Payments and fraud: no card identity or behavior.
message MethodMetadata {
  string type = 1;
  string fingerprint = 2;
}
message ResolveForProcessingRequest {
  string integration_id = 1;
  string token = 2;
}
message ResolveForProcessingResponse {
  ProcessingFixture fixture = 1;
}
enum Behavior {
  BEHAVIOR_UNSPECIFIED = 0;
  BEHAVIOR_APPROVE = 1;
  BEHAVIOR_INSUFFICIENT_FUNDS = 2;
  BEHAVIOR_ISSUER_DECLINE = 3;
  BEHAVIOR_INVALID = 4;
}
message ProcessingFixture {
  string card_reference = 1;
  Behavior behavior = 2;
}
