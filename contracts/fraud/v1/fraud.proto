syntax = "proto3";
package fraud.v1;

option go_package = "github.com/phuchoang2603/payment-gateway-fraud-detection/shared/proto/fraud/v1;fraudv1";
import "google/protobuf/timestamp.proto";
import "payments/v1/types.proto";
import "fraud/v1/evidence.proto";

service FraudService { rpc Decide(DecideRequest) returns (DecideResponse); }
message DecideRequest {
  string integration_id = 1;
  string payment_id = 2;
  string attempt_id = 3;
  payments.v1.MerchantRef merchant = 4;
  payments.v1.CustomerRef customer = 5;
  payments.v1.CheckoutSnapshot snapshot = 6;
  payments.v1.AttemptSignals signals = 7;
}
// A decline is a successful response, not an error.
message DecideResponse {
  payments.v1.RiskAssessment assessment = 1;
  google.protobuf.Timestamp evaluated_at = 2;
  reserved 3;
  AssessmentEvidence evidence = 4;
}
