apiVersion: v1.1.0
kind: DataProduct
id: urn:dataproduct:fraud:historical-payments
name: Historical synthetic payments
version: 4.1.0
status: active
domain: fraud-detection
type: sourceAligned
description:
  purpose: Reproducible synthetic payment histories and delayed fraud labels for pipeline development.
  usage: Select a completed immutable dataset by its manifest. Each output port's ODCS contract defines its schema and quality rules.
  limitations: Synthetic source only; no claim of real-world fraud performance, production model acceptance or processing benchmark scale. Drift and history duration depend on the selected dataset configuration.
team:
  name: Fraud data platform
  members:
    - username: phuchoang2603
      role: owner
tags: [synthetic, source, payments]
customProperties:
  - property: endpoint
    value: https://minio.home.phuchoang.sbs
  - property: locationTemplate
    value: s3://synthetic-source/historical/{dataset_version}/
  - property: completionMarker
    value: manifest.json
  - property: accessPolicy
    value: Shared historical-source identity from Doppler prd; historical/* list/read/write, no deletion or pipeline artifact access. Accepted versions are immutable by publication protocol.
  - property: generator
    value: https://github.com/phuchoang2603/payment-gateway-fraud-detection/tree/main/src/data-pipeline/simulator
outputPorts:
  - name: payment-events
    version: 3.1.0
    type: files
    contractId: urn:datacontract:fraud:historical-payment-events
    description: Complete payment lifecycle histories in daily occurred_date partitions of sorted Zstandard Parquet.
    customProperties:
      - property: path
        value: payment_events/occurred_date={YYYY-MM-DD}/
      - property: consumption
        value: Deduplicate identical event deliveries and read complete histories across occurrence dates. Drift metadata is manifest-only.
  - name: fraud-labels
    version: 1.0.0
    type: files
    contractId: urn:datacontract:fraud:historical-fraud-labels
    description: Simulation truth and delayed chargebacks in daily label_available_date partitions of sorted Zstandard Parquet.
    inputContracts:
      - id: urn:datacontract:fraud:historical-payment-events
        version: 3.1.0
    customProperties:
      - property: path
        value: fraud_labels/label_available_date={YYYY-MM-DD}/
      - property: consumption
        value: Join labels only after label_available_at, exclude feature warmup, and never use scenario as a feature.
support:
  - channel: GitHub maintainer
    url: https://github.com/phuchoang2603
    scope: support
