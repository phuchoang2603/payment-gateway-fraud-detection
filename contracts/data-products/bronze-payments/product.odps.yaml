apiVersion: v1.1.0
kind: DataProduct
id: urn:dataproduct:fraud:bronze-payments
name: Bronze payments
version: 1.0.0
status: active
domain: fraud-detection
type: sourceAligned
description:
  purpose: Every delivered payment event and fraud label from the historical v18 files and the Kafka topics, kept as Iceberg tables in one shape.
  usage: Query bronze tables for provenance and raw deliveries. Silver is the curated input for analytics and features. Duplicate deliveries are kept here by design.
  limitations: Synthetic data only. Kafka mode reads only records retained by the topics. Records that fail protobuf decoding or the Bronze schema are kept in rejected-records, not in the payment tables.
team:
  name: Fraud data platform
  members:
    - username: phuchoang2603
      role: owner
tags: [synthetic, bronze, payments]
customProperties:
  - property: catalog
    value: lakehouse
  - property: schema
    value: bronze
  - property: runtime
    value: Spark 4.1.3 on Iceberg tables through the Polaris REST catalog; quality checks run as ClickHouse SQL in OpenMetadata.
  - property: partitioning
    value: payment_events by _source and days(occurred_at); fraud_labels by _source and days(label_available_at); rejected_records by days(_ingested_at).
inputPorts:
  - name: historical-payment-events
    version: 1.0.0
    contractId: urn:datacontract:fraud:historical-payment-events
  - name: historical-fraud-labels
    version: 1.0.0
    contractId: urn:datacontract:fraud:historical-fraud-labels
outputPorts:
  - name: payment-events
    version: 1.0.0
    type: tables
    contractId: urn:datacontract:fraud:bronze-payment-events
    description: Payment lifecycle events from both sources, one row per delivery.
    customProperties:
      - property: table
        value: bronze.payment_events
  - name: fraud-labels
    version: 1.0.0
    type: tables
    contractId: urn:datacontract:fraud:bronze-fraud-labels
    description: Simulation truth and chargeback observations from both sources, one row per delivery.
    customProperties:
      - property: table
        value: bronze.fraud_labels
  - name: rejected-records
    version: 1.0.0
    type: tables
    contractId: urn:datacontract:fraud:bronze-rejected-records
    description: Kafka records that failed protobuf decoding, with their raw key and value bytes. Historical files never reach this port because a bad file fails the run.
    customProperties:
      - property: table
        value: bronze.rejected_records
support:
  - channel: GitHub maintainer
    url: https://github.com/phuchoang2603
    scope: support
