apiVersion: v3.1.0
kind: DataContract
id: urn:datacontract:fraud:bronze-payment-events
name: Bronze payment-events
version: 3.0.0
status: active
domain: fraud-detection
description:
  purpose: Raw delivered payment events for historical and recurring ingestion.
  usage: Preserve every delivery and its provenance. DP2 owns deduplication and business-quality validation.
  limitations: Synthetic data only. Recurring batches may contain incomplete lifecycles. Label availability and as-of joins are enforced in DP2.
team:
  name: Fraud data platform
  members:
  - username: phuchoang2603
    role: owner
tags:
- synthetic
- bronze
- payments
customProperties:
- property: classification
  value: synthetic
- property: sqlDialect
  value: starrocks
- property: upstreamContract
  value:
    id: urn:datacontract:fraud:historical-payment-events
    version: 4.0.1
- property: snapshotRetention
  value: Preserve every snapshot referenced by a durable run or acceptance record.
servers:
- server: bronze
  type: custom
  environment: prod
  host: https://minio.home.phuchoang.sbs/iceberg/v1
  database: fraud-lakehouse-prod
  schema: bronze
  description: REST catalog with independently configured signing and S3FileIO credentials. Read accepted snapshot pairs,
    never unvalidated latest state.
schema:
- name: payment_events
  physicalName: bronze.raw_payment_events
  logicalType: object
  physicalType: table
  description: One delivered event; repeated and conflicting business identities are preserved for silver curation. Recurring
    batches may contain incomplete histories.
  dataGranularityDescription: One delivered payment lifecycle event.
  customProperties:
  - property: schemaVersions
    value:
    - 3
  properties:
  - name: event_id
    logicalType: string
    physicalType: string
    required: true
    description: Opaque event identity. Repeated deliveries retain this identity and identical content.
  - name: payment_id
    logicalType: string
    physicalType: string
    required: true
    description: Payment aggregate identity within integration_id.
  - name: aggregate_version
    logicalType: integer
    physicalType: long
    required: true
    description: Consecutive authoritative transition number starting at one; delivery duplicates do not increment it.
  - name: integration_id
    logicalType: string
    physicalType: string
    required: true
    description: Dedicated synthetic integration namespace; never share it with a real integration.
  - name: occurred_at
    logicalType: timestamp
    physicalType: timestamp
    logicalTypeOptions: &id001
      timezone: true
      defaultTimezone: UTC
    required: true
    description: Business occurrence time in UTC at microsecond precision.
  - name: recorded_at
    logicalType: timestamp
    physicalType: timestamp
    logicalTypeOptions: *id001
    required: true
    description: Source recording time, at or after occurred_at; not ingestion time.
  - name: schema_version
    logicalType: integer
    physicalType: long
    required: true
    description: Current physical event schema three includes immutable attempt scoring context.
  - name: correlation_id
    logicalType: string
    physicalType: string
    required: true
    description: Correlation identity shared across one payment history.
  - name: payment_created
    logicalType: object
    description: Initial immutable checkout snapshot. Exactly one lifecycle payload is present per event.
    properties:
    - name: merchant
      logicalType: object
      required: true
      description: Integration-scoped merchant references.
      properties:
      - name: merchant_id
        logicalType: string
        physicalType: string
        required: true
        description: Gateway merchant identity.
      - name: external_seller_id
        logicalType: string
        physicalType: string
        required: true
        description: Integration seller identity.
    - name: customer
      logicalType: object
      required: true
      description: Integration-scoped customer references.
      properties:
      - name: customer_id
        logicalType: string
        physicalType: string
        required: true
        description: Gateway customer identity.
      - name: external_buyer_id
        logicalType: string
        physicalType: string
        required: true
        description: Integration buyer identity.
    - name: snapshot
      logicalType: object
      required: true
      description: Checkout facts captured at creation; raw personal and payment credentials are excluded.
      properties:
      - name: external_order_id
        logicalType: string
        physicalType: string
        required: true
        description: Integration order reference.
      - name: total
        logicalType: object
        required: true
        description: Total in integer minor units; must equal the item sum.
        properties: &id002
        - name: minor_units
          logicalType: integer
          physicalType: long
          required: true
          description: Nonnegative integer amount in currency minor units.
        - name: currency
          logicalType: string
          physicalType: string
          required: true
          description: Three-letter uppercase currency code shared by all items.
      - name: items
        logicalType: array
        required: true
        description: Nonempty checkout line items.
        items:
          logicalType: object
          required: true
          properties:
          - name: product_id
            logicalType: string
            physicalType: string
            required: true
            description: Product reference.
          - name: category
            logicalType: string
            physicalType: string
            required: true
            description: Refurbished electronics product type, such as phone, laptop or accessory.
          - name: condition
            logicalType: string
            physicalType: string
            required: true
            description: 'Refurbished condition grade: excellent, good or fair.'
          - name: quantity
            logicalType: integer
            physicalType: int
            required: true
            description: Positive item quantity.
          - name: unit_price
            logicalType: object
            required: true
            description: Price for one item in checkout currency.
            properties: *id002
      - name: merchant_account_created_at
        logicalType: timestamp
        physicalType: timestamp
        logicalTypeOptions: *id001
        required: true
        description: Merchant account creation time.
      - name: customer_account_created_at
        logicalType: timestamp
        physicalType: timestamp
        logicalTypeOptions: *id001
        required: true
        description: Customer account creation time.
      - name: shipping
        logicalType: object
        required: true
        description: Coarse shipping geography and synthetic address fingerprint.
        properties:
        - name: country
          logicalType: string
          physicalType: string
          required: true
          description: Shipping country code.
        - name: region
          logicalType: string
          physicalType: string
          required: true
          description: Shipping region.
        - name: postal_code
          logicalType: string
          physicalType: string
          required: true
          description: Shipping postal code.
        - name: address_fingerprint
          logicalType: string
          physicalType: string
          required: true
          description: Normalized keyed synthetic address fingerprint; no street lines.
  - name: attempt_started
    logicalType: object
    description: Starts a new nonconcurrent attempt on an open payment.
    properties:
    - name: attempt_id
      logicalType: string
      physicalType: string
      required: true
      description: Attempt identity unique within this payment.
    - name: signals
      logicalType: object
      required: true
      description: Runtime observations; unavailable optional signals remain null.
      properties:
      - name: attempted_at
        logicalType: timestamp
        physicalType: timestamp
        logicalTypeOptions: *id001
        required: true
        description: Attempt occurrence time.
      - name: payment_method
        logicalType: object
        required: true
        description: Method category and keyed synthetic token fingerprint.
        properties:
        - name: type
          logicalType: string
          physicalType: string
          required: true
          description: Payment method category.
        - name: fingerprint
          logicalType: string
          physicalType: string
          required: true
          description: Synthetic method fingerprint; never raw credentials.
      - name: device_fingerprint
        logicalType: string
        physicalType: string
        description: Observed synthetic device fingerprint.
      - name: ip_country
        logicalType: string
        physicalType: string
        description: Resolved IP country if available.
      - name: ip_network_fingerprint
        logicalType: string
        physicalType: string
        description: Keyed network fingerprint; never raw IP.
      - name: user_agent_family
        logicalType: string
        physicalType: string
        description: Optional observed browser family.
        customProperties:
        - property: sinceSchemaVersion
          value: 2
    - name: context
      logicalType: object
      required: true
      description: Immutable scoring context matching PaymentCreated and the Fraud request.
      properties:
      - name: merchant
        logicalType: object
        required: true
        description: Integration-scoped merchant references.
        properties:
        - name: merchant_id
          logicalType: string
          physicalType: string
          required: true
          description: Gateway merchant identity.
        - name: external_seller_id
          logicalType: string
          physicalType: string
          required: true
          description: Integration seller identity.
      - name: customer
        logicalType: object
        required: true
        description: Integration-scoped customer references.
        properties:
        - name: customer_id
          logicalType: string
          physicalType: string
          required: true
          description: Gateway customer identity.
        - name: external_buyer_id
          logicalType: string
          physicalType: string
          required: true
          description: Integration buyer identity.
      - name: snapshot
        logicalType: object
        required: true
        description: Checkout facts captured at creation; raw personal and payment credentials are excluded.
        properties:
        - name: external_order_id
          logicalType: string
          physicalType: string
          required: true
          description: Integration order reference.
        - name: total
          logicalType: object
          required: true
          description: Total in integer minor units; must equal the item sum.
          properties: &id003
          - name: minor_units
            logicalType: integer
            physicalType: long
            required: true
            description: Nonnegative integer amount in currency minor units.
          - name: currency
            logicalType: string
            physicalType: string
            required: true
            description: Three-letter uppercase currency code shared by all items.
        - name: items
          logicalType: array
          required: true
          description: Nonempty checkout line items.
          items:
            logicalType: object
            required: true
            properties:
            - name: product_id
              logicalType: string
              physicalType: string
              required: true
              description: Product reference.
            - name: category
              logicalType: string
              physicalType: string
              required: true
              description: Refurbished electronics product type, such as phone, laptop or accessory.
            - name: condition
              logicalType: string
              physicalType: string
              required: true
              description: 'Refurbished condition grade: excellent, good or fair.'
            - name: quantity
              logicalType: integer
              physicalType: int
              required: true
              description: Positive item quantity.
            - name: unit_price
              logicalType: object
              required: true
              description: Price for one item in checkout currency.
              properties: *id003
        - name: merchant_account_created_at
          logicalType: timestamp
          physicalType: timestamp
          logicalTypeOptions: *id001
          required: true
          description: Merchant account creation time.
        - name: customer_account_created_at
          logicalType: timestamp
          physicalType: timestamp
          logicalTypeOptions: *id001
          required: true
          description: Customer account creation time.
        - name: shipping
          logicalType: object
          required: true
          description: Coarse shipping geography and synthetic address fingerprint.
          properties:
          - name: country
            logicalType: string
            physicalType: string
            required: true
            description: Shipping country code.
          - name: region
            logicalType: string
            physicalType: string
            required: true
            description: Shipping region.
          - name: postal_code
            logicalType: string
            physicalType: string
            required: true
            description: Shipping postal code.
          - name: address_fingerprint
            logicalType: string
            physicalType: string
            required: true
            description: Normalized keyed synthetic address fingerprint; no street lines.
  - name: risk_decision_recorded
    logicalType: object
    description: Exactly one assessment for the active attempt before any processor request.
    properties:
    - name: attempt_id
      logicalType: string
      physicalType: string
      required: true
      description: Active attempt identity.
    - name: assessment
      logicalType: object
      required: true
      description: Decision evidence. Optional model and feature versions are absent for rules-only decisions.
      properties:
      - name: outcome
        logicalType: string
        physicalType: string
        required: true
        description: RISK_OUTCOME_APPROVE or RISK_OUTCOME_DECLINE.
      - name: reason_codes
        logicalType: array
        required: true
        description: Nonempty policy reason codes.
        items:
          logicalType: string
          physicalType: string
          required: true
      - name: policy_version
        logicalType: string
        physicalType: string
        required: true
        description: Evaluated policy version.
      - name: model_version
        logicalType: string
        physicalType: string
        description: Evaluated model version if a model was used.
      - name: feature_set_version
        logicalType: string
        physicalType: string
        description: Evaluated feature-set version if features were used.
      - name: risk_score
        logicalType: number
        physicalType: double
        description: Optional model risk score.
  - name: processor_operation_requested
    logicalType: object
    description: Processor authorization request after risk approval.
    properties:
    - name: attempt_id
      logicalType: string
      physicalType: string
      required: true
      description: Active approved attempt identity.
    - name: operation_key
      logicalType: string
      physicalType: string
      required: true
      description: Idempotent processor operation identity.
  - name: processor_outcome_unknown
    logicalType: object
    description: Pending processor result; only processor decline or success can resolve it.
    properties:
    - name: attempt_id
      logicalType: string
      physicalType: string
      required: true
      description: Active requested attempt identity.
  - name: attempt_declined
    logicalType: object
    description: Risk or processor decline that permits a subsequent attempt.
    properties:
    - name: attempt_id
      logicalType: string
      physicalType: string
      required: true
      description: Active declined attempt identity.
    - name: source
      logicalType: string
      physicalType: string
      required: true
      description: DECLINE_SOURCE_RISK or DECLINE_SOURCE_PROCESSOR.
    - name: reason
      logicalType: string
      physicalType: string
      required: true
      description: Decline reason.
  - name: payment_succeeded
    logicalType: object
    description: Terminal successful processor result.
    properties:
    - name: attempt_id
      logicalType: string
      physicalType: string
      required: true
      description: Successful requested attempt identity.
    - name: processor_reference
      logicalType: string
      physicalType: string
      required: true
      description: Synthetic processor result reference.
  - name: payment_expired
    logicalType: object
    description: Terminal expiry with no pending processor result.
    properties:
    - name: _present
      logicalType: boolean
      physicalType: boolean
      required: true
      description: True marker for the otherwise empty expiry payload.
  - name: _source_dataset_version
    logicalType: string
    physicalType: string
    required: true
    description: Immutable source dataset version, independent of contract and product versions.
  - name: _source_manifest_sha256
    logicalType: string
    physicalType: string
    required: true
    description: SHA-256 of exact completed source manifest bytes.
  - name: _source_file
    logicalType: string
    physicalType: string
    required: true
    description: Exact manifest-selected input object URI.
  - name: _ingestion_run_id
    logicalType: string
    physicalType: string
    required: true
    description: Stable logical ingestion identity, reused after driver retries.
  - name: _ingested_at
    logicalType: timestamp
    physicalType: timestamp
    required: true
    description: Stable UTC microsecond ingestion time, distinct from source recorded_at.
  - name: _source_epoch
    logicalType: string
    physicalType: string
    description: Immutable landing epoch; null for historical exports.
  - name: _source_batch
    logicalType: string
    physicalType: string
    description: Exact completion-manifest key for this source file; null for historical
      exports.
  - name: _transport
    logicalType: object
    description: Original Kafka envelope, including ordered headers; null for historical
      sources.
    properties:
    - name: topic
      logicalType: string
      physicalType: string
      required: true
    - name: partition
      logicalType: integer
      physicalType: int
      required: true
    - name: offset
      logicalType: integer
      physicalType: long
      required: true
    - name: timestamp
      logicalType: timestamp
      physicalType: timestamp
    - name: key
      logicalType: string
      physicalType: binary
    - name: value
      logicalType: string
      physicalType: binary
      required: true
    - name: headers
      logicalType: array
      items:
        logicalType: object
        properties:
        - name: key
          logicalType: string
          physicalType: string
          required: true
        - name: value
          logicalType: string
          physicalType: binary
