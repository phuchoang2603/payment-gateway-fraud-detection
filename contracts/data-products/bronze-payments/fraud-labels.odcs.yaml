apiVersion: v3.1.0
kind: DataContract
id: urn:datacontract:fraud:bronze-fraud-labels
name: Bronze fraud-labels
version: 3.0.0
status: active
domain: fraud-detection
description:
  purpose: Separately delivered simulation truth and delayed chargebacks for historical and recurring payment deliveries.
  usage: Join labels to payment attempts only after label_available_at. DP2 validates linkage and maturity using referenced payment history.
  limitations: Synthetic data only. Scenario truth and future outcomes must never become decision inputs. Labels may only
    be used after label_available_at.
team:
  name: Fraud data platform
  members:
  - username: xuanphuc.a1gv
    role: owner
tags:
- synthetic
- bronze
- payments
customProperties:
- property: classification
  value: synthetic
- property: sqlDialect
  value: starrocks
- property: upstreamContract
  value:
    id: urn:datacontract:fraud:historical-fraud-labels
    version: 1.0.0
- property: snapshotRetention
  value: Preserve every snapshot referenced by a durable run or acceptance record.
servers:
- server: bronze
  type: custom
  environment: prod
  host: http://iceberg-catalog.data.svc.cluster.local:8181/api/catalog/v1
  database: lakehouse
  schema: bronze
  description: REST catalog with OAuth2 catalog authentication and independently configured S3FileIO credentials. Read accepted snapshot pairs,
    never unvalidated latest state.
schema:
- name: fraud_labels
  physicalName: bronze.raw_fraud_labels
  logicalType: object
  physicalType: table
  description: Separate synthetic attempt truth and delayed chargebacks. Never join future labels into features.
  dataGranularityDescription: One label source observation for one scoped payment attempt.
  customProperties:
  - property: schemaVersions
    value:
    - 1
  properties:
  - name: integration_id
    logicalType: string
    physicalType: string
    required: true
    description: Same dedicated synthetic namespace as the referenced payment.
  - name: payment_id
    logicalType: string
    physicalType: string
    required: true
    description: Referenced payment aggregate identity.
  - name: attempt_id
    logicalType: string
    physicalType: string
    required: true
    description: Referenced started attempt identity.
  - name: is_fraud
    logicalType: boolean
    physicalType: boolean
    required: true
    description: Fraud truth according to this source; friendly-fraud chargebacks may differ from simulation truth.
  - name: occurred_at
    logicalType: timestamp
    physicalType: timestamp
    logicalTypeOptions: &id001
      timezone: true
      defaultTimezone: UTC
    required: true
    description: Time of the labeled business occurrence.
  - name: label_available_at
    logicalType: timestamp
    physicalType: timestamp
    logicalTypeOptions: *id001
    required: true
    description: Earliest time this label may be used by training or evaluation.
  - name: source
    logicalType: string
    physicalType: string
    required: true
    description: LABEL_SOURCE_SIMULATION_TRUTH or LABEL_SOURCE_CHARGEBACK.
  - name: scenario
    logicalType: string
    physicalType: string
    description: Synthetic generating scenario on simulation truth only; excluded from features.
  - name: _source_dataset_version
    logicalType: string
    physicalType: string
    required: true
    description: Immutable source dataset version, independent of contract and product versions.
  - name: _source_manifest_sha256
    logicalType: string
    physicalType: string
    required: true
    description: SHA-256 of exact completed source manifest bytes.
  - name: _source_file
    logicalType: string
    physicalType: string
    required: true
    description: Exact manifest-selected input object URI.
  - name: _source_schema_version
    logicalType: integer
    physicalType: int
    required: true
    description: Physical schema version of the selected label source file.
  - name: _ingestion_run_id
    logicalType: string
    physicalType: string
    required: true
    description: Stable logical ingestion identity, reused after driver retries.
  - name: _ingested_at
    logicalType: timestamp
    physicalType: timestamp
    required: true
    description: Stable UTC microsecond ingestion time, distinct from source recorded_at.
  - name: _source_epoch
    logicalType: string
    physicalType: string
    description: Immutable landing epoch; null for historical exports.
  - name: _source_batch
    logicalType: string
    physicalType: string
    description: Exact completion-manifest key for this source file; null for historical
      exports.
  - name: _transport
    logicalType: object
    description: Original Kafka envelope, including ordered headers; null for historical
      sources.
    properties:
    - name: topic
      logicalType: string
      physicalType: string
      required: true
    - name: partition
      logicalType: integer
      physicalType: int
      required: true
    - name: offset
      logicalType: integer
      physicalType: long
      required: true
    - name: timestamp
      logicalType: timestamp
      physicalType: timestamp
    - name: key
      logicalType: string
      physicalType: binary
    - name: value
      logicalType: string
      physicalType: binary
      required: true
    - name: headers
      logicalType: array
      items:
        logicalType: object
        properties:
        - name: key
          logicalType: string
          physicalType: string
          required: true
        - name: value
          logicalType: string
          physicalType: binary
