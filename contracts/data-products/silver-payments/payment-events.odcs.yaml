apiVersion: v3.1.0
kind: DataContract
id: urn:datacontract:fraud:silver-payment-events
name: Silver payment events
version: 1.0.0
status: active
domain: fraud-detection
description:
  purpose: One authoritative copy of each payment event for payments without conflicting deliveries.
  usage: Read for lifecycle detail. Use silver.attempts for attempt-level analysis. Republished exports are collapsed here; the copy kept is the one with the earliest recorded_at.
  limitations: Synthetic data only. Payments whose deliveries conflict are excluded and listed in silver.rejected_events.
team:
  name: Fraud data platform
  members:
    - username: phuchoang2603
      role: owner
tags: [synthetic, silver, payments]
customProperties:
  - property: sqlDialect
    value: starrocks
servers:
  - server: starrocks
    type: mysql
    environment: dev
    host: kube-starrocks-fe-service.starrocks.svc.cluster.local
    port: 9030
    database: silver
    description: Iceberg table payment_events in schema silver, read through the StarRocks fraud_lakehouse catalog. The rule placeholder {object} stands for the fully qualified table.
schema:
  - name: payment_events
    physicalName: silver.payment_events
    logicalType: object
    physicalType: table
    description: One row per distinct event_id with the payments.v1.PaymentEvent business fields of the kept copy.
    dataGranularityDescription: One payment lifecycle event.
    customProperties:
      - property: partitioning
        value: days(occurred_at)
    properties:
      - {name: event_id, logicalType: string, physicalType: VARCHAR, required: true, description: Opaque event identity; unique within this table.}
      - {name: payment_id, logicalType: string, physicalType: VARCHAR, required: true, description: Payment aggregate identity within integration_id.}
      - {name: integration_id, logicalType: string, physicalType: VARCHAR, required: true, description: Dedicated synthetic integration namespace.}
      - {name: aggregate_version, logicalType: integer, physicalType: BIGINT, required: true, description: Authoritative transition number.}
      - {name: occurred_at, logicalType: timestamp, physicalType: TIMESTAMPTZ, required: true, description: Business occurrence time in UTC.}
      - {name: recorded_at, logicalType: timestamp, physicalType: TIMESTAMPTZ, required: true, description: Recording time of the kept copy, the earliest among identical deliveries.}
      - {name: schema_version, logicalType: integer, physicalType: INTEGER, required: true, description: Event schema version, two or three.}
      - {name: correlation_id, logicalType: string, physicalType: VARCHAR, required: true, description: Correlation identity shared across one payment history.}
      - {name: event_hash, logicalType: string, physicalType: VARCHAR, required: true, description: SHA-256 over every business field except recorded_at and provenance.}
      - {name: payment_created, logicalType: object, description: Checkout snapshot at creation.}
      - {name: attempt_started, logicalType: object, description: Attempt start with signals and context.}
      - {name: risk_decision_recorded, logicalType: object, description: Risk assessment for the active attempt.}
      - {name: processor_operation_requested, logicalType: object, description: Processor request after approval.}
      - {name: processor_outcome_unknown, logicalType: object, description: Pending processor result.}
      - {name: attempt_declined, logicalType: object, description: Risk or processor decline.}
      - {name: payment_succeeded, logicalType: object, description: Terminal success.}
      - {name: payment_expired, logicalType: object, description: Terminal expiry.}
      - {name: _source, logicalType: string, physicalType: VARCHAR, required: true, description: Source of the kept copy, historical or kafka.}
    quality:
      - id: silver_unique_event
        type: sql
        description: Each event identity appears once.
        query: |
          SELECT count(*) FROM (SELECT event_id FROM {object} GROUP BY event_id HAVING count(*) > 1) AS duplicates
        mustBe: 0
      - id: silver_payment_amounts
        type: sql
        description: Checkout totals are nonnegative in one currency, have line items, and equal the sum of quantity times unit price.
        query: |
          SELECT count(*) FROM {object}
          WHERE payment_created IS NOT NULL AND (
            payment_created.snapshot.total.minor_units < 0
            OR payment_created.snapshot.total.currency NOT REGEXP '^[A-Z]{3}$'
            OR array_length(payment_created.snapshot.items) = 0
            OR payment_created.snapshot.total.minor_units <> array_sum(
              array_map(item -> item.quantity * item.unit_price.minor_units, payment_created.snapshot.items))
            OR array_contains(array_map(item ->
              item.quantity <= 0 OR item.unit_price.minor_units < 0
              OR item.unit_price.currency <> payment_created.snapshot.total.currency,
              payment_created.snapshot.items), true)
          )
        mustBe: 0
      - id: silver_risk_assessment
        type: sql
        description: Decisions declare an approve or decline outcome and a policy version. Declines require a reason; reason codes are nonempty strings.
        query: |
          SELECT count(*) FROM {object}
          WHERE risk_decision_recorded IS NOT NULL AND (
            risk_decision_recorded.assessment.outcome NOT IN ('RISK_OUTCOME_APPROVE', 'RISK_OUTCOME_DECLINE')
            OR nullif(risk_decision_recorded.assessment.policy_version, '') IS NULL
            OR (risk_decision_recorded.assessment.outcome = 'RISK_OUTCOME_DECLINE'
              AND array_length(risk_decision_recorded.assessment.reason_codes) = 0)
            OR array_contains(risk_decision_recorded.assessment.reason_codes, '')
          )
        mustBe: 0
      - id: silver_attempt_amount_context
        type: sql
        description: Each attempt carries the checkout total of its payment creation.
        query: |
          SELECT count(*) FROM {object} AS attempt
          JOIN {object} AS created
            ON created.integration_id = attempt.integration_id AND created.payment_id = attempt.payment_id
          WHERE attempt.attempt_started IS NOT NULL AND created.payment_created IS NOT NULL
            AND (attempt.attempt_started.context.snapshot.total.minor_units
                <> created.payment_created.snapshot.total.minor_units
              OR attempt.attempt_started.context.snapshot.total.currency
                <> created.payment_created.snapshot.total.currency)
        mustBe: 0
